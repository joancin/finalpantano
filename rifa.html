<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rifa Festera</title>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body { 
            background: #2c3e50; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Roboto Mono', monospace;
            background-image: radial-gradient(#34495e 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .ticket-container {
            perspective: 1000px;
        }

        .ticket {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            width: 320px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            color: #4e342e;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        
        .ticket:hover { transform: rotateY(10deg) rotateX(5deg); }

        .ticket::before, .ticket::after {
            content: ''; position: absolute; width: 40px; height: 40px; background: #2c3e50; border-radius: 50%; top: 50%; transform: translateY(-50%); z-index: 10;
        }
        .ticket::before { left: -20px; }
        .ticket::after { right: -20px; }

        .ticket-header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px dashed #4e342e;
            position: relative;
        }
        .ticket-header h1 {
            font-family: 'Abril Fatface', cursive;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }

        .ticket-body {
            padding: 30px 20px;
            text-align: center;
        }
        
        .win-label { font-size: 0.9rem; margin-bottom: 10px; display: block; opacity: 0.8; }
        
        .win-number {
            font-size: 4rem;
            font-weight: bold;
            background: white;
            color: #d35400;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            letter-spacing: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .date-info {
            margin-top: 20px;
            font-size: 0.9rem;
            border: 2px solid #4e342e;
            padding: 5px;
            border-radius: 50px;
            display: inline-block;
            background: rgba(255,255,255,0.2);
        }

        .btn-back { position: fixed; top: 20px; left: 20px; background: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .loading-text { font-size: 1rem; color: #4e342e; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Escuchar cambios en la rifa en tiempo real
      onSnapshot(doc(db, "config", "rifa"), (docSnap) => {
          if (docSnap.exists()) {
              const data = docSnap.data();
              document.getElementById("win-num").innerText = data.numero || "???";
              document.getElementById("draw-date").innerText = "📅 Sorteo: " + (data.fecha || "Próximamente");
          } else {
              document.getElementById("win-num").innerText = "---";
          }
      });
    </script>
</head>
<body>

    <button class="btn-back" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="ticket-container">
        <div class="ticket">
            <div class="ticket-header">
                <h1>Sorteo</h1>
                <div class="subtitle">Fiestas Pantano</div>
            </div>
            
            <div class="ticket-body">
                <span class="win-label">NÚMERO GANADOR</span>
                <div id="win-num" class="win-number">
                    <span class="loading-text">...</span>
                </div>
                
                <br>
                
                <div id="draw-date" class="date-info">
                    Cargando fecha...
                </div>
            </div>
        </div>
    </div>

</body>
</html>
