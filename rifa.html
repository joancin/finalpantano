<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rifa Festera</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body { 
            background: #2c3e50; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; /* Cambiado para permitir scroll */
            font-family: 'Roboto Mono', monospace;
            background-image: radial-gradient(#34495e 1px, transparent 1px);
            background-size: 20px 20px;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- TICKET PRINCIPAL --- */
        .ticket-container {
            perspective: 1000px;
            margin-top: 60px; /* Espacio para el botón de volver */
            margin-bottom: 50px;
            z-index: 2;
        }

        .ticket {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            width: 320px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            color: #4e342e;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        
        .ticket:hover { transform: rotateY(10deg) rotateX(5deg); }

        .ticket::before, .ticket::after {
            content: ''; position: absolute; width: 40px; height: 40px; background: #2c3e50; border-radius: 50%; top: 50%; transform: translateY(-50%); z-index: 10;
        }
        .ticket::before { left: -20px; }
        .ticket::after { right: -20px; }

        .ticket-header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px dashed #4e342e;
            position: relative;
        }
        .ticket-header h1 {
            font-family: 'Abril Fatface', cursive;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }

        .ticket-body {
            padding: 30px 20px;
            text-align: center;
        }
        
        .win-label { font-size: 0.9rem; margin-bottom: 10px; display: block; opacity: 0.8; }
        
        .win-number {
            font-size: 4rem;
            font-weight: bold;
            background: white;
            color: #d35400;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            letter-spacing: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .date-info {
            margin-top: 20px;
            font-size: 0.9rem;
            border: 2px solid #4e342e;
            padding: 5px;
            border-radius: 50px;
            display: inline-block;
            background: rgba(255,255,255,0.2);
        }

        .btn-back { position: fixed; top: 20px; left: 20px; background: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .loading-text { font-size: 1rem; color: #4e342e; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- NUEVO: HISTORIAL DE RIFAS --- */
        .history-section {
            width: 100%;
            max-width: 1200px; /* Aumentado para acomodar imágenes más grandes */
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .history-title {
            color: #f1c40f;
            font-family: 'Abril Fatface', cursive;
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .history-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px; /* Espacio aumentado entre imágenes */
            padding-bottom: 50px;
        }

        .history-item {
            width: 250px;  /* Ancho fijo más grande */
            height: 180px; /* Alto fijo para cuadrar todas */
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #34495e;
            background: #fff;
            cursor: pointer;
            overflow: hidden; /* Importante para que la imagen no se salga */
        }

        .history-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que la imagen llene el contenedor sin deformarse */
            display: block;
        }

        .history-item:hover {
            transform: scale(1.08) rotate(1deg); /* Efecto hover ligeramente ajustado */
            border-color: #f1c40f;
            z-index: 10;
            box-shadow: 0 12px 30px rgba(241, 196, 15, 0.4);
        }

        /* CONTROLES ADMIN */
        #admin-controls {
            margin-top: 20px;
            margin-bottom: 50px;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 15px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }
        .admin-input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 100px; font-size: 1.2rem; text-align: center; margin-right: 10px; }
        .btn-save { background: #d35400; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, onSnapshot, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      // Escuchar cambios en la rifa en tiempo real
      onSnapshot(doc(db, "config", "rifa"), (docSnap) => {
          if (docSnap.exists()) {
              const data = docSnap.data();
              document.getElementById("win-num").innerText = data.numero || "???";
              document.getElementById("draw-date").innerText = "📅 Sorteo: " + (data.fecha || "Próximamente");
          } else {
              document.getElementById("win-num").innerText = "---";
          }
      });

      // Verificar rol para mostrar controles
      onAuthStateChanged(auth, async (user) => {
          if(user) {
              const uDoc = await getDoc(doc(db, "usuarios", user.uid));
              if(uDoc.exists()) {
                  const rol = uDoc.data().rol;
                  if(rol === 'admin' || rol === 'festero') {
                      document.getElementById("admin-controls").style.display = "block";
                  }
              }
          }
      });

      window.actualizarRifa = async () => {
          const num = document.getElementById("admin-num").value;
          const fecha = document.getElementById("admin-date").value;
          if(!num) return alert("Escribe un número");

          try {
              await setDoc(doc(db, "config", "rifa"), { numero: num, fecha: fecha || "Próximamente" }, { merge: true });
              alert("✅ Rifa Actualizada");
          } catch(e) { alert("Error: " + e.message); }
      }
    </script>
</head>
<body>

    <button class="btn-back" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="ticket-container">
        <div class="ticket">
            <div class="ticket-header">
                <h1>Sorteo</h1>
                <div class="subtitle">Fiestas Pantano</div>
            </div>
            
            <div class="ticket-body">
                <span class="win-label">NÚMERO GANADOR</span>
                <div id="win-num" class="win-number">
                    <span class="loading-text">...</span>
                </div>
                
                <br>
                
                <div id="draw-date" class="date-info">
                    Cargando fecha...
                </div>
            </div>
        </div>
    </div>

    <div class="history-section">
        <h2 class="history-title">Historial de Sorteos</h2>
        <div class="history-grid">
            <div class="history-item"><img src="https://i.postimg.cc/dtCGFDWF/1.png" alt="Rifa 1"></div>
            <div class="history-item"><img src="https://i.postimg.cc/4xTVxZ0q/2.png" alt="Rifa 2"></div>
            <div class="history-item"><img src="https://i.postimg.cc/BnGHnsyq/3.png" alt="Rifa 3"></div>
            <div class="history-item"><img src="https://i.postimg.cc/qvdyv0F5/4.png" alt="Rifa 4"></div>
            <div class="history-item"><img src="https://i.postimg.cc/YCfg4ZKN/5.png" alt="Rifa 5"></div>
            <div class="history-item"><img src="https://i.postimg.cc/52qvHTdS/6.png" alt="Rifa 6"></div>
            <div class="history-item"><img src="https://i.postimg.cc/htbxJ6Wr/7.png" alt="Rifa 7"></div>
            <div class="history-item"><img src="https://i.postimg.cc/9QtT4K5J/8.png" alt="Rifa 8"></div>
            <div class="history-item"><img src="https://i.postimg.cc/6QWZCctH/9.png" alt="Rifa 9"></div>
            <div class="history-item"><img src="https://i.postimg.cc/d0sCG6wH/10.png" alt="Rifa 10"></div>
            <div class="history-item"><img src="https://i.postimg.cc/KYGTtfx6/11.png" alt="Rifa 11"></div>
            <div class="history-item"><img src="https://i.postimg.cc/yNLZjRN7/12.png" alt="Rifa 12"></div>
            <div class="history-item"><img src="https://i.postimg.cc/0NVwnSNj/13.png" alt="Rifa 13"></div>
            <div class="history-item"><img src="https://i.postimg.cc/BvmKpFvt/14.png" alt="Rifa 14"></div>
        </div>
    </div>

    <div id="admin-controls">
        <h3 style="margin-top:0; color:#333;">🛠️ Panel de Control</h3>
        <input type="number" id="admin-num" class="admin-input" placeholder="Nº">
        <input type="text" id="admin-date" class="admin-input" placeholder="Fecha (ej: 24 Ago)" style="width:120px;">
        <br><br>
        <button class="btn-save" onclick="actualizarRifa()">Publicar</button>
    </div>

</body>
</html>
