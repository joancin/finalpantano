<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Festeros</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Anton', sans-serif; letter-spacing: 2px; font-size: 2.5rem; color: #333; margin: 0; text-transform: uppercase; }
        
        .grid-festeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        
        /* DISEÑO TIPO DORSAL/TICKET */
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; border: 2px solid #333; display: flex; flex-direction: column; }
        
        .card-num { background: #333; color: white; padding: 5px 10px; font-family: 'Anton', sans-serif; font-size: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 15px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .name { font-weight: 800; font-size: 1.1rem; line-height: 1.2; text-transform: uppercase; }
        .role { margin-top: 5px; font-size: 0.75rem; background: #ffeaa7; padding: 3px 8px; border-radius: 4px; display: inline-block; font-weight: bold; align-self: center; }
        
        /* Colores alternos para diversión */
        .card:nth-child(odd) .card-num { background: #ff7675; }
        .card:nth-child(even) .card-num { background: #74b9ff; }
        .card:nth-child(3n) .card-num { background: #55efc4; color: #333; }
        .card:nth-child(4n) .card-num { background: #a29bfe; color: white; }

        /* Colaboradores */
        .separator { text-align: center; margin: 40px 0 20px; font-weight: bold; color: gray; letter-spacing: 2px; }
        .collab .card-num { background: #dfe6e9 !important; color: #636e72 !important; }

        .btn-back { position: fixed; top: 15px; left: 15px; background: white; border: 2px solid #333; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 #333; z-index: 100; }
        .btn-back:active { transform: translate(2px, 2px); box-shadow: none; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="header">
        <h1>Festeros 2025</h1>
        <p>Jóvenes pero responsables 😎</p>
    </div>

    <div class="grid-festeros">
        <div class="card">
            <div class="card-num"><span>001</span></div>
            <div class="card-body">
                <div class="name">Rocio<br>Gil</div>
                <div class="role">Presidenta</div>
            </div>
        </div>

        <div class="card">
            <div class="card-num"><span>002</span></div>
            <div class="card-body">
                <div class="name">Mario<br>Izquierdo</div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-num"><span>003</span></div>
            <div class="card-body">
                <div class="name">Idaira<br>Lloira</div>
            </div>
        </div>

        <div class="card">
            <div class="card-num"><span>004</span></div>
            <div class="card-body">
                <div class="name">Joan<br>Chirivella</div>
            </div>
        </div>
        
        </div>

    <div class="separator">COLABORADORES</div>

    <div class="grid-festeros">
        <div class="card collab">
            <div class="card-num"><span>C01</span></div>
            <div class="card-body">
                <div class="name">Celia<br>Sastriques</div>
                <div class="role" style="background:#eee">Colab</div>
            </div>
        </div>
    </div>

</body>
</html>
