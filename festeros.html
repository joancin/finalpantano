<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Festeros 2026 · Fiestas Pantano</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e8400c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Lora:ital@0;1&display=swap" rel="stylesheet">

    <style>
        /* ── VARIABLES ──────────────────────────────────────────────── */
        :root {
            --bg: #fdf6ee; --bg2: #f0e4d4; --text: #1a1208; --text2: #7a6550;
            --card: #ffffff; --border: rgba(0,0,0,0.07);
            --accent: #e8400c; --gold: #f59e0b;
            --green: #059669;
            --shadow: 0 4px 20px rgba(0,0,0,0.07);
            --radius: 18px;
        }
        html.dark-mode {
            --bg: #140e08; --bg2: #1e1610; --text: #f0e8dc; --text2: #a89070;
            --card: #241c14; --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 20px rgba(0,0,0,0.45);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* ── HERO ───────────────────────────────────────────────────── */
        .hero {
            position: relative; overflow: hidden;
            padding: 70px 24px 50px;
            text-align: center;
        }

        /* Fondo degradado festivo */
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(160deg, #e8400c 0%, #f59e0b 60%, #fdf6ee 100%);
            opacity: 0.12;
        }
        html.dark-mode .hero::before { opacity: 0.18; }

        /* Patrón de puntos decorativo */
        .hero::after {
            content: '';
            position: absolute; inset: 0; pointer-events: none;
            background-image: radial-gradient(circle, rgba(232,64,12,.12) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .btn-back {
            position: fixed; top: 18px; left: 18px; z-index: 100;
            background: var(--card); border: 1px solid var(--border);
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text);
            box-shadow: var(--shadow); transition: transform .15s;
        }
        .btn-back:active { transform: scale(.9); }

        .hero-content { position: relative; z-index: 1; }

        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(232,64,12,.1); color: var(--accent);
            border: 1px solid rgba(232,64,12,.2);
            padding: 5px 14px; border-radius: 30px;
            font-size: 0.75rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .5px;
            margin-bottom: 16px;
        }
        .hero-eyebrow-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.7);opacity:.4} }

        .hero h1 {
            font-size: clamp(3rem, 14vw, 5.5rem);
            font-weight: 800; line-height: .95;
            letter-spacing: -2px;
        }
        .hero h1 .line-plain { display: block; color: var(--text); }
        .hero h1 .line-accent {
            display: block;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-sub {
            font-family: 'Lora', serif; font-style: italic;
            font-size: 1rem; color: var(--text2);
            margin-top: 10px;
        }

        .hero-count {
            display: inline-flex; gap: 20px;
            margin-top: 24px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 50px; padding: 10px 24px;
            box-shadow: var(--shadow);
        }
        .hc-item { text-align: center; }
        .hc-num  { display: block; font-size: 1.4rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .hc-lbl  { display: block; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); }
        .hc-sep  { width: 1px; background: var(--border); align-self: stretch; }

        /* ── SECCIÓN LABEL ──────────────────────────────────────────── */
        .section-wrap { max-width: 680px; margin: 0 auto; padding: 0 18px; }

        .section-label {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text2); margin: 32px 0 16px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .section-label .sl-badge {
            background: var(--accent); color: white;
            padding: 2px 8px; border-radius: 10px; font-size: 0.65rem;
        }
        .section-label.collab .sl-badge { background: var(--green); }

        /* ── GRID ───────────────────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 12px;
        }

        /* ── CARD ───────────────────────────────────────────────────── */
        .card {
            background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); overflow: hidden;
            box-shadow: var(--shadow);
            display: flex; flex-direction: column;
            animation: fadeUp .4s ease backwards;
            transition: transform .2s, box-shadow .2s;
            position: relative;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(0,0,0,.1); }
        .card:active { transform: scale(.97); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }

        /* Barra de color top */
        .card-stripe {
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--gold));
        }
        .card.collab .card-stripe {
            background: linear-gradient(90deg, var(--green), #34d399);
        }
        .card.presi .card-stripe {
            height: 5px;
            background: linear-gradient(90deg, #7c3aed, #e8400c, #f59e0b);
        }

        .card-num {
            position: absolute; top: 10px; right: 12px;
            font-size: 0.65rem; font-weight: 800; color: var(--text2);
            letter-spacing: .5px; opacity: .5;
        }

        .card-body {
            padding: 18px 14px 16px;
            display: flex; flex-direction: column;
            align-items: center; text-align: center;
            flex: 1; gap: 8px;
        }

        /* Avatar con iniciales */
        .avatar {
            width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 800; color: white;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--avatar-c1, #e8400c), var(--avatar-c2, #f59e0b));
        }
        .card.presi .avatar {
            width: 58px; height: 58px; font-size: 1.2rem;
            box-shadow: 0 4px 14px rgba(232,64,12,.4);
        }

        .card-name {
            font-size: 0.88rem; font-weight: 800;
            line-height: 1.25; color: var(--text);
        }

        .card-role {
            font-size: 0.68rem; font-weight: 700;
            padding: 3px 10px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: .3px;
        }
        .role-festero  { background: rgba(232,64,12,.08);  color: var(--accent); }
        .role-presi    { background: linear-gradient(135deg,rgba(124,58,237,.12),rgba(232,64,12,.12)); color: #7c3aed; }
        .role-collab   { background: rgba(5,150,105,.1); color: var(--green); }

        /* Card especial presidenta */
        .card.presi {
            grid-column: span 2;
            flex-direction: row;
        }
        .card.presi .card-stripe {
            width: 5px; height: auto;
            background: linear-gradient(180deg, #7c3aed, #e8400c, #f59e0b);
        }
        .card.presi .card-body {
            flex-direction: row; text-align: left;
            align-items: center; gap: 14px;
            padding: 18px 16px;
        }
        .card.presi .card-num { top: 12px; right: 14px; }

        @media (max-width: 360px) {
            .card.presi { grid-column: span 1; flex-direction: column; }
            .card.presi .card-stripe { width: auto; height: 4px; }
            .card.presi .card-body { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.history.back()" aria-label="Volver">
        <span class="material-symbols-outlined" style="font-size:20px">arrow_back</span>
    </button>

    <!-- HERO -->
    <div class="hero">
        <div class="hero-content">
            <div class="hero-eyebrow">
                <span class="hero-eyebrow-dot"></span>
                Fiestas Pantano · Torrent
            </div>
            <h1>
                <span class="line-plain">El equipo</span>
                <span class="line-accent">Festero</span>
            </h1>
            <p class="hero-sub">La gente que lo hace posible</p>
            <div class="hero-count">
                <div class="hc-item">
                    <span class="hc-num" id="cnt-festeros">21</span>
                    <span class="hc-lbl">Festeros</span>
                </div>
                <div class="hc-sep"></div>
                <div class="hc-item">
                    <span class="hc-num" id="cnt-collab">3</span>
                    <span class="hc-lbl">Colaboradores</span>
                </div>
                <div class="hc-sep"></div>
                <div class="hc-item">
                    <span class="hc-num">2026</span>
                    <span class="hc-lbl">Edición</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FESTEROS -->
    <div class="section-wrap">
        <div class="section-label">
            Festeros oficiales
            <span class="sl-badge" id="badge-festeros">21</span>
        </div>
        <div id="lista-festeros" class="grid"></div>

        <!-- COLABORADORES -->
        <div class="section-label collab">
            Colaboradores
            <span class="sl-badge" id="badge-collab">3</span>
        </div>
        <div id="lista-colaboradores" class="grid"></div>
    </div>

    <script>
        /* ── DATOS ── igual que el original, solo añado 2026 ─────── */
        const nombres = [
          "Rocio Gil","Mario Izquierdo","Idaira Lloria","Joan Chirivella",
          "Paula Mata","Hugo Lopez","Isabel Lopez","Enrique Gil",
          "Olga Moncholi","Dani Moncayo","Neus Adsuara","Paula Martínez",
          "Miguel Santamaria","Carla Muñoz","Rebeca Muñoz","Nayara Muñoz",
          "Alberto Lopez","Patri Lopez","Joan Ramirez","Enric Juan","Cristina Martín"
        ];
        const colaboradores = ["Celia Sastriques","Nicolas Santamaría","Inés Muñoz"];

        /* Paleta de colores para avatares — cicla */
        const avatarPalettes = [
            ['#e8400c','#f59e0b'], ['#7c3aed','#e8400c'], ['#0ea5e9','#6366f1'],
            ['#059669','#34d399'], ['#ec4899','#f97316'], ['#f59e0b','#84cc16'],
            ['#6366f1','#0ea5e9'], ['#e8400c','#ec4899'],
        ];

        function initials(name) {
            return name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
        }

        function renderCards(lista, containerId, esColaborador) {
            const container = document.getElementById(containerId);
            lista.forEach((nombre, index) => {
                const esPresidenta = index === 0 && !esColaborador;
                const rol     = esPresidenta ? 'Presidenta' : esColaborador ? 'Colaborador/a' : 'Festero/a';
                const rolCls  = esPresidenta ? 'role-presi'  : esColaborador ? 'role-collab' : 'role-festero';
                const cardCls = esPresidenta ? 'card presi'  : esColaborador ? 'card collab' : 'card';
                const num     = esColaborador ? 'C' + (index+1) : String(index+1).padStart(3,'0');
                const pal     = avatarPalettes[index % avatarPalettes.length];
                const delay   = index * 40;

                const card = document.createElement('div');
                card.className = cardCls;
                card.style.animationDelay = delay + 'ms';
                card.innerHTML = `
                    <div class="card-stripe"></div>
                    <div class="card-body">
                        <div class="avatar" style="--avatar-c1:${pal[0]};--avatar-c2:${pal[1]}">
                            ${initials(nombre)}
                        </div>
                        <div>
                            <div class="card-name">${nombre}</div>
                            <div class="card-role ${rolCls}">${rol}</div>
                        </div>
                    </div>
                    <span class="card-num">${num}</span>
                `;
                container.appendChild(card);
            });
        }

        /* Actualizar contadores */
        document.getElementById('cnt-festeros').innerText = nombres.length;
        document.getElementById('cnt-collab').innerText   = colaboradores.length;
        document.getElementById('badge-festeros').innerText = nombres.length;
        document.getElementById('badge-collab').innerText   = colaboradores.length;

        renderCards(nombres, 'lista-festeros', false);
        renderCards(colaboradores, 'lista-colaboradores', true);
    </script>
</body>
</html>
