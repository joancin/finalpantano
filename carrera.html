<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Festera</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #9c27b0; }
        body.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { background: transparent; border: 1px solid var(--text); color: var(--text); padding: 8px 15px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .grid-gestion { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        @media (max-width: 800px) { .grid-gestion { grid-template-columns: 1fr; } }

        .card { background: var(--card); padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #ddd; padding-bottom: 10px; font-size: 1.2rem; }
        
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; background: var(--card); color: var(--text); }
        button.action { width: 100%; background: var(--accent); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button.action:hover { opacity: 0.9; }

        .scroll-list { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
        .list-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .activity-item { background: rgba(0,0,0,0.02); margin-bottom: 8px; padding: 10px; border-radius: 5px; border-left: 4px solid var(--accent); display: flex; gap: 10px; align-items: center; }
        .activity-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #ddd; }
        .activity-content { flex: 1; }
        
        .activity-header { display: flex; justify-content: space-between; font-weight: bold; align-items: flex-start; }
        .activity-details { font-size: 12px; color: gray; margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
        .btn-del { background: #ff4444; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }

        .tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .tag.free { background: #e8f5e9; color: green; }
        .tag.used { background: #ffebee; color: red; }
        
        /* Etiquetas nuevas */
        .tag-cat-adulto { background: #333; color: white; }
        .tag-cat-infantil { background: #ffeb3b; color: #333; }
        .tag-cat-todos { background: #2196f3; color: white; }

        .msg { margin-top: 10px; font-weight: bold; display: none; }
        .success { color: green; } .error { color: red; }
        .hidden { display: none; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot, where, getDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          const docSnap = await getDoc(doc(db, "usuarios", user.uid));
          if (!docSnap.exists() || (docSnap.data().rol !== 'festero' && docSnap.data().rol !== 'admin')) {
              window.location.href = "panel.html";
          }
          currentUser = user;
          aplicarTema();
          escucharCodigos();
          escucharActividades();
      });

      // --- CÓDIGOS ---
      window.generarCodigo = async () => {
          const codeInput = document.getElementById("new-code");
          const codigo = codeInput.value.trim().toUpperCase();
          const status = document.getElementById("status-code");

          if(codigo.length < 3) { mostrarMsg(status, "Mínimo 3 letras", "error"); return; }
          try {
              const q = query(collection(db, "invitaciones"), where("codigo", "==", codigo));
              const querySnapshot = await getDocs(q);
              if (!querySnapshot.empty) { mostrarMsg(status, "¡Ya existe!", "error"); return; }

              await addDoc(collection(db, "invitaciones"), {
                  codigo: codigo, rol: "usuario", usado: false, creado_por: currentUser.uid, fecha_creacion: new Date()
              });
              mostrarMsg(status, `✅ Código ${codigo} creado.`, "success");
              codeInput.value = ""; 
          } catch (e) { console.error(e); mostrarMsg(status, "Error: " + e.message, "error"); }
      }

      function escucharCodigos() {
          const q = query(collection(db, "invitaciones"), orderBy("fecha_creacion", "desc"));
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("lista-codigos");
              lista.innerHTML = "";
              if(snapshot.empty) { lista.innerHTML = "<li>Sin códigos.</li>"; return; }
              snapshot.forEach((doc) => {
                  const d = doc.data();
                  const estadoClass = d.usado ? "used" : "free";
                  const estadoTexto = d.usado ? `${d.usado_por}` : "LIBRE";
                  lista.innerHTML += `<li class="list-item"><div><strong>${d.codigo}</strong></div><span class="tag ${estadoClass}">${estadoTexto}</span></li>`;
              });
          });
      }

      // --- ACTIVIDADES ---
      window.checkModalidad = () => {
          const tipo = document.getElementById("act-modalidad").value;
          const divGrupo = document.getElementById("div-grupo-size");
          if (tipo === 'grupo') divGrupo.classList.remove("hidden"); else divGrupo.classList.add("hidden");
      }

      window.crearActividad = async () => {
          const titulo = document.getElementById("act-titulo").value;
          const fecha = document.getElementById("act-fecha").value;
          const genero = document.getElementById("act-genero").value;
          const categoria = document.getElementById("act-categoria").value; // NUEVO
          const modalidad = document.getElementById("act-modalidad").value;
          const tamano = document.getElementById("act-tamano").value;
          const imagen = document.getElementById("act-imagen").value.trim();
          const status = document.getElementById("status-act");

          if(!titulo || !fecha) { mostrarMsg(status, "Pon título y fecha", "error"); return; }
          
          let equipoSize = 1;
          if(modalidad === 'parejas') equipoSize = 2;
          if(modalidad === 'grupo') equipoSize = parseInt(tamano) || 3;

          // Icono por defecto inteligente
          let imgFinal = imagen;
          if(!imgFinal) {
              if(genero === 'carrera') imgFinal = 'https://cdn-icons-png.flaticon.com/512/2553/2553658.png';
              else if(genero === 'torneo') imgFinal = 'https://cdn-icons-png.flaticon.com/512/1606/1606141.png';
              else if(genero === 'comida') imgFinal = 'https://cdn-icons-png.flaticon.com/512/1638/1638069.png';
              else imgFinal = 'https://cdn-icons-png.flaticon.com/512/3159/3159066.png';
          }

          try {
              await addDoc(collection(db, "actividades"), {
                  titulo: titulo,
                  fecha: new Date(fecha),
                  genero: genero,
                  categoria: categoria, // GUARDAR CATEGORÍA
                  modalidad: modalidad,
                  tamano_equipo: equipoSize,
                  imagen: imgFinal,
                  creado_por: currentUser.uid,
                  participantes: [],
                  inscritos: [] // Array importante para la nueva lógica
              });

              mostrarMsg(status, "✅ Actividad publicada", "success");
              document.getElementById("act-titulo").value = "";
          } catch (e) { console.error(e); mostrarMsg(status, "Error: " + e.message, "error"); }
      }

      function escucharActividades() {
          const q = query(collection(db, "actividades"), orderBy("fecha", "asc"));
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("lista-actividades");
              lista.innerHTML = "";
              if(snapshot.empty) { lista.innerHTML = "<p>No hay actividades.</p>"; return; }

              snapshot.forEach((docSnap) => {
                  const act = docSnap.data();
                  const fechaLegible = act.fecha.toDate ? act.fecha.toDate().toLocaleString() : new Date(act.fecha).toLocaleString();
                  const inscritosCount = act.inscritos ? act.inscritos.length : 0;
                  
                  // Lógica del botón de gestión
                  let botonGestion = "";
                  
                  if (act.genero === 'torneo') {
                      botonGestion = `<button style="background:#2196f3; color:white; border:none; border-radius:3px; cursor:pointer; padding:4px 8px; font-size:11px; margin-right:5px;" onclick="window.location.href='torneo.html?id=${docSnap.id}'">Gestionar Torneo</button>`;
                  } else if (act.genero === 'carrera') {
                      botonGestion = `<button style="background:#4caf50; color:white; border:none; border-radius:3px; cursor:pointer; padding:4px 8px; font-size:11px; margin-right:5px;" onclick="alert('Próximamente: Gestionar Carrera (Podio)')">Gestionar Carrera</button>`;
                  }

                  const html = `
                    <div class="activity-item">
                        <img src="${act.imagen}" class="activity-img" alt="img" onerror="this.src='https://placehold.co/50'">
                        <div class="activity-content">
                            <div class="activity-header">
                                <span>${act.titulo}</span>
                                <div>
                                    ${botonGestion}
                                    <button class="btn-del" onclick="borrarActividad('${docSnap.id}', '${act.titulo}')">X</button>
                                </div>
                            </div>
                            <div class="activity-details">
                                <span>📅 ${fechaLegible}</span>
                                <span class="tag tag-cat-${act.categoria || 'todos'}">${(act.categoria || 'Todos').toUpperCase()}</span>
                                <span style="background:#eee; padding:2px 5px; border-radius:4px; font-size:10px;">${act.genero.toUpperCase()}</span>
                                <span>👥 ${inscritosCount} apuntados</span>
                            </div>
                        </div>
                    </div>
                  `;
                  lista.innerHTML += html;
              });
          });
      }

      window.borrarActividad = async (id, titulo) => {
          if(confirm(`¿Borrar "${titulo}"?`)) await deleteDoc(doc(db, "actividades", id));
      }

      function mostrarMsg(el, txt, tipo) { el.innerText = txt; el.className = "msg " + tipo; el.style.display = "block"; setTimeout(()=>el.style.display='none', 4000); }
      function aplicarTema() { if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Gestión Festera</h1>
            <button class="btn-back" onclick="window.location.href='panel.html'"><span class="material-symbols-outlined">arrow_back</span> Volver</button>
        </div>
        <div class="grid-gestion">
            <div class="card">
                <h2>🎫 Invitaciones</h2>
                <input type="text" id="new-code" placeholder="Código (ej: VECINO24)">
                <button class="action" onclick="generarCodigo()">Crear Código</button>
                <p id="status-code" class="msg"></p>
                <h3 style="margin-top:20px; font-size: 14px;">Historial</h3>
                <ul id="lista-codigos" class="scroll-list"><li>Cargando...</li></ul>
            </div>

            <div class="card">
                <h2>📅 Crear Actividad</h2>
                
                <input type="text" id="act-titulo" placeholder="Título (ej: Carrera de Sacos)">
                <input type="datetime-local" id="act-fecha">
                <input type="url" id="act-imagen" placeholder="Enlace de imagen (Opcional)">
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label style="font-size:12px;">Tipo</label>
                        <select id="act-genero">
                            <option value="torneo">🏆 Torneo (Bracket)</option>
                            <option value="carrera">🏃 Carrera (Podio)</option>
                            <option value="comida">🥘 Comida/Cena</option>
                            <option value="fiesta">🪩 Fiesta/Evento</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px;">Categoría</label>
                        <select id="act-categoria">
                            <option value="todos">🌍 Todos</option>
                            <option value="infantil">👶 Infantil</option>
                            <option value="adulto">🍺 Adultos</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top:10px;">
                    <label style="font-size:12px;">Modalidad de Inscripción</label>
                    <select id="act-modalidad" onchange="checkModalidad()">
                        <option value="individual">👤 Individual</option>
                        <option value="parejas">👥 Parejas</option>
                        <option value="grupo">👨‍👩‍👧‍👦 Grupo</option>
                    </select>
                </div>

                <div id="div-grupo-size" class="hidden">
                    <label style="font-size:12px;">Personas por grupo</label>
                    <input type="number" id="act-tamano" value="4" min="2" max="20">
                </div>

                <button class="action" onclick="crearActividad()">Publicar Actividad</button>
                <p id="status-act" class="msg"></p>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                
                <h3 style="font-size: 14px;">Actividades Creadas</h3>
                <div id="lista-actividades"></div>
            </div>
        </div>
    </div>
</body>
</html>
