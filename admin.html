<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Pro</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f8f9fa; --text: #2d3436; --card: white; --accent: #6c5ce7; --danger: #ff7675; }
        html.dark-mode { --bg: #18191a; --text: #dfe6e9; --card: #242526; --accent: #a29bfe; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; transition: background 0.3s; padding-bottom: 80px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* HEADER CON STATS */
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .stat-num { font-size: 2rem; font-weight: 800; color: var(--accent); display: block; }
        .stat-label { font-size: 0.8rem; color: gray; font-weight: 600; text-transform: uppercase; }

        /* TARJETAS PRINCIPALES */
        .admin-card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; position: relative; overflow: hidden; }
        .card-title { margin-top: 0; display: flex; align-items: center; gap: 10px; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* FORMULARIOS */
        .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input, select { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 10px; background: var(--bg); color: var(--text); outline: none; font-family: inherit; }
        button.action-btn { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); transition: transform 0.2s; }
        button.action-btn:active { transform: scale(0.95); }

        /* LISTAS */
        .scroll-box { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); transition: background 0.2s; }
        .user-item:hover { background: rgba(0,0,0,0.02); }
        
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; font-size: 1rem; }
        .user-role { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; display: inline-block; width: fit-content; margin-top: 4px; font-weight: 600; text-transform: uppercase; }
        
        .role-admin { background: #ffebee; color: #c62828; }
        .role-festero { background: #e1bee7; color: #6a1b9a; }
        .role-usuario { background: #e0f2f1; color: #00695c; }

        .btn-reset { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .btn-reset:hover { background: var(--danger); color: white; }

        .btn-back-float { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: var(--bg); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; border: none; z-index: 100; }
        
        .msg { padding: 10px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; display: none; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, query, onSnapshot, where, getDoc, doc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          const docSnap = await getDoc(doc(db, "usuarios", user.uid));
          if (!docSnap.exists() || docSnap.data().rol !== 'admin') window.location.href = "panel.html";
          currentUser = user;
          escucharTodo();
      });

      function escucharTodo() {
          // 1. USUARIOS
          onSnapshot(query(collection(db, "usuarios"), orderBy("rol")), (snap) => {
              const lista = document.getElementById("user-list");
              lista.innerHTML = "";
              let total = 0, festeros = 0;
              
              snap.forEach(d => {
                  const u = d.data();
                  total++;
                  if(u.rol === 'festero' || u.rol === 'admin') festeros++;
                  
                  // IMPORTANTE: data-name guarda el nombre en minúsculas para buscar
                  lista.innerHTML += `
                    <div class="user-item" data-name="${u.username.toLowerCase()}">
                        <div class="user-info">
                            <span class="user-name">${u.username}</span>
                            <span class="user-role role-${u.rol}">${u.rol}</span>
                        </div>
                        ${u.rol !== 'admin' ? 
                          `<button class="btn-reset" onclick="resetearUsuario('${d.id}', '${u.username}')">
                             <span class="material-symbols-outlined" style="font-size:16px">restart_alt</span> REINICIAR
                           </button>` : ''}
                    </div>`;
              });
              
              document.getElementById("stat-total").innerText = total;
              document.getElementById("stat-festeros").innerText = festeros;
              
              // Refrescar filtro por si había algo escrito
              filtrarUsuarios(); 
          });

          // 2. CÓDIGOS VIP
          onSnapshot(query(collection(db, "invitaciones")), (snap) => {
              const lista = document.getElementById("vip-list");
              lista.innerHTML = "";
              let hayCodigos = false;
              
              snap.forEach(d => {
                  const data = d.data();
                  if(!data.usado && (data.rol === 'admin' || data.rol === 'festero')) {
                      hayCodigos = true;
                      lista.innerHTML += `
                        <div class="user-item">
                            <div class="user-info">
                                <span class="user-name" style="letter-spacing:1px; font-family:monospace; font-size:1.1rem;">${data.codigo}</span>
                                <span class="user-role role-${data.rol}">PARA ${data.rol.toUpperCase()}</span>
                            </div>
                            <button class="btn-reset" style="border-color:#ccc; color:gray;" onclick="borrarCodigo('${d.id}')">🗑️</button>
                        </div>`;
                  }
              });
              if(!hayCodigos) lista.innerHTML = "<p style='text-align:center; color:gray; font-size:0.9rem;'>No hay códigos pendientes.</p>";
          });
      }

      // --- FUNCIÓN DE BÚSQUEDA CORREGIDA ---
      window.filtrarUsuarios = () => {
          const input = document.getElementById("search-user");
          const filter = input.value.toLowerCase();
          const items = document.getElementsByClassName("user-item");

          for (let i = 0; i < items.length; i++) {
              // Solo filtramos los que tengan el atributo data-name (para no afectar a la lista VIP)
              if (items[i].hasAttribute("data-name")) {
                  const name = items[i].getAttribute("data-name");
                  if (name.indexOf(filter) > -1) {
                      items[i].style.display = "flex";
                  } else {
                      items[i].style.display = "none";
                  }
              }
          }
      }

      window.crearVIP = async () => {
          const code = document.getElementById("vip-code").value.trim().toUpperCase();
          const role = document.getElementById("vip-role").value;
          if(code.length < 3) return alert("Código muy corto");
          
          try {
              const q = query(collection(db, "invitaciones"), where("codigo", "==", code));
              const snap = await getDocs(q);
              if(!snap.empty) return alert("¡Ese código ya existe!");

              await addDoc(collection(db, "invitaciones"), {
                  codigo: code, rol: role, usado: false, creado_por: currentUser.uid, fecha_creacion: new Date()
              });
              document.getElementById("vip-code").value = "";
              mostrarNoti("Código Creado", "#e8f5e9", "green");
          } catch(e) { alert("Error: " + e.message); }
      }

      window.resetearUsuario = async (id, nombre) => {
          if(confirm(`⚠️ ATENCIÓN ⚠️\n\nVas a ELIMINAR la cuenta de "${nombre}".\n\nEsto sirve para que se pueda volver a registrar si olvidó la contraseña.\n\n¿Confirmar?`)) {
              await deleteDoc(doc(db, "usuarios", id));
              mostrarNoti("Usuario eliminado. Ya puede registrarse de nuevo.", "#fff3e0", "#e65100");
          }
      }

      window.borrarCodigo = async (id) => { if(confirm("¿Borrar este código?")) await deleteDoc(doc(db, "invitaciones", id)); }

      function mostrarNoti(txt, bg, col) {
          const el = document.getElementById("noti");
          el.innerText = txt; el.style.background = bg; el.style.color = col; el.style.display = "block";
          setTimeout(() => el.style.display="none", 3000);
      }
    </script>
</head>
<body>

    <div class="dashboard-header">
        <h1 style="margin:0;">🎛️ Panel de Mando</h1>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <span id="stat-total" class="stat-num">...</span>
            <span class="stat-label">Usuarios Totales</span>
        </div>
        <div class="stat-card">
            <span id="stat-festeros" class="stat-num">...</span>
            <span class="stat-label">Equipo Festero</span>
        </div>
    </div>

    <div class="admin-card">
        <h3 class="card-title">
            <span class="material-symbols-outlined" style="color:var(--accent)">stars</span>
            Generar Invitación VIP
        </h3>
        <div class="input-row">
            <input type="text" id="vip-code" placeholder="CÓDIGO (Ej: PEPE25)" style="text-transform:uppercase; font-weight:bold;">
            <select id="vip-role" style="flex:0.6;">
                <option value="festero">Festero</option>
                <option value="admin">Admin</option>
            </select>
            <button class="action-btn" onclick="crearVIP()">Crear</button>
        </div>
        <div style="margin-top:20px;">
            <strong style="font-size:0.8rem; color:gray;">CÓDIGOS PENDIENTES DE USO:</strong>
            <div id="vip-list" style="margin-top:10px;"></div>
        </div>
    </div>

    <div class="admin-card">
        <h3 class="card-title">
            <span class="material-symbols-outlined" style="color:#00b894;">group</span>
            Censo de Usuarios
        </h3>
        
        <input type="text" id="search-user" placeholder="🔍 Buscar usuario por nombre..." oninput="filtrarUsuarios()" style="margin-bottom:15px; background:#f0f2f5;">
        
        <div id="user-list" class="scroll-box">
            Cargando lista...
        </div>
    </div>

    <div id="noti" class="msg"></div>

    <button class="btn-back-float" onclick="window.location.href='panel.html'">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

</body>
</html>
