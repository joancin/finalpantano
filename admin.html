<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #e91e63; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { background: transparent; border: 1px solid var(--text); color: var(--text); padding: 8px 15px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h2 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        
        /* FORMULARIOS */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; background: var(--bg); color: var(--text); box-sizing: border-box; }
        
        button.action { width: 100%; background: var(--accent); color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 10px; }
        button.action:hover { opacity: 0.9; }

        /* LISTAS */
        .list-container { max-height: 300px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .item-info { display: flex; flex-direction: column; }
        .item-role { font-size: 0.8rem; padding: 2px 8px; border-radius: 10px; display: inline-block; width: fit-content; margin-top: 4px; font-weight: bold; }
        
        .role-admin { background: #fce4ec; color: #c2185b; }
        .role-festero { background: #f3e5f5; color: #7b1fa2; }
        .role-usuario { background: #e0f2f1; color: #00695c; }

        .btn-del { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        
        .msg { padding: 10px; border-radius: 5px; margin-top: 10px; display: none; text-align: center; }
        .success { background: #e8f5e9; color: green; }
        .error { background: #ffebee; color: red; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot, where, getDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          const docSnap = await getDoc(doc(db, "usuarios", user.uid));
          
          if (!docSnap.exists() || docSnap.data().rol !== 'admin') {
              alert("Acceso denegado. Solo para Jefes.");
              window.location.href = "panel.html";
          }
          
          currentUser = user;
          aplicarTema();
          escucharUsuarios();
          escucharCodigosVIP();
      });

      // --- GENERAR CÓDIGO VIP (Festero/Admin) ---
      window.crearCodigoVIP = async () => {
          const codigo = document.getElementById("vip-code").value.trim().toUpperCase();
          const rol = document.getElementById("vip-role").value;
          const status = document.getElementById("status-vip");

          if(codigo.length < 3) return mostrarMsg(status, "Código muy corto", "error");

          try {
              // Verificar si existe
              const q = query(collection(db, "invitaciones"), where("codigo", "==", codigo));
              const snap = await getDocs(q);
              if(!snap.empty) return mostrarMsg(status, "Ese código ya existe", "error");

              await addDoc(collection(db, "invitaciones"), {
                  codigo: codigo,
                  rol: rol,
                  usado: false,
                  creado_por: currentUser.uid,
                  fecha_creacion: new Date()
              });

              mostrarMsg(status, `✅ Código ${rol.toUpperCase()} creado`, "success");
              document.getElementById("vip-code").value = "";
          } catch(e) {
              console.error(e);
              mostrarMsg(status, "Error: " + e.message, "error");
          }
      }

      function escucharCodigosVIP() {
          // CONSULTA SIMPLIFICADA PARA EVITAR ERRORES DE ÍNDICE EN FIREBASE
          const q = query(collection(db, "invitaciones"), orderBy("fecha_creacion", "desc"));
          
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("lista-codigos-vip");
              lista.innerHTML = "";
              let count = 0;
              
              snapshot.forEach((doc) => {
                  const d = doc.data();
                  
                  // FILTRAMOS AQUÍ CON JAVASCRIPT:
                  // 1. Que NO esté usado
                  // 2. Que sea rol ADMIN o FESTERO (para que no salgan los de usuario normal)
                  if(!d.usado && (d.rol === 'admin' || d.rol === 'festero')) {
                      count++;
                      lista.innerHTML += `
                        <div class="item-row">
                            <div class="item-info">
                                <strong style="font-size:1.2rem; letter-spacing:1px;">${d.codigo}</strong>
                                <span class="item-role role-${d.rol}">Rol: ${d.rol.toUpperCase()}</span>
                            </div>
                            <button class="btn-del" onclick="borrarDoc('invitaciones', '${doc.id}')">🗑️</button>
                        </div>`;
                  }
              });
              
              if(count === 0) lista.innerHTML = "<p style='text-align:center; color:gray'>No hay invitaciones VIP activas.</p>";
          });
      }

      // --- LISTADO DE USUARIOS (Para control) ---
      function escucharUsuarios() {
          const q = query(collection(db, "usuarios"), orderBy("rol", "asc"));
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("lista-usuarios");
              lista.innerHTML = "";
              
              snapshot.forEach((docSnap) => {
                  const u = docSnap.data();
                  lista.innerHTML += `
                    <div class="item-row">
                        <div class="item-info">
                            <strong>${u.username}</strong>
                            <span class="item-role role-${u.rol}">${u.rol.toUpperCase()}</span>
                        </div>
                        ${u.rol !== 'admin' ? `<button class="btn-del" onclick="borrarUsuario('${docSnap.id}', '${u.username}')">Expulsar</button>` : ''}
                    </div>`;
              });
          });
      }

      window.borrarDoc = async (col, id) => {
          if(confirm("¿Eliminar este código?")) await deleteDoc(doc(db, col, id));
      }

      window.borrarUsuario = async (id, nombre) => {
          if(confirm(`¿Estás seguro de que quieres echar a ${nombre}? No podrá volver a entrar.`)) {
              await deleteDoc(doc(db, "usuarios", id));
          }
      }

      function mostrarMsg(el, txt, tipo) { 
          el.innerText = txt; el.className = "msg " + tipo; el.style.display = "block"; 
          setTimeout(()=>el.style.display='none', 3000); 
      }
      function aplicarTema() { if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); }
    </script>
</head>
<script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Zona de Jefes (Admin)</h1>
            <button class="btn-back" onclick="window.location.href='panel.html'">Volver</button>
        </div>

        <div class="card" style="border-left: 5px solid #e91e63;">
            <h2>👑 Generar Invitación VIP</h2>
            <p style="color:gray; font-size:0.9rem;">Crea un código para que tus compañeros se registren ellos mismos.</p>
            
            <div class="form-group">
                <label>Código de Invitación</label>
                <input type="text" id="vip-code" placeholder="Ej: FESTERO25" style="text-transform:uppercase; letter-spacing:2px; font-weight:bold;">
            </div>
            
            <div class="form-group">
                <label>Permisos (Rol)</label>
                <select id="vip-role">
                    <option value="festero" selected>🟣 Festero (Puede crear actividades)</option>
                    <option value="admin">🔴 Admin (Poder absoluto)</option>
                </select>
            </div>

            <button class="action" onclick="crearCodigoVIP()">Crear Invitación VIP</button>
            <div id="status-vip" class="msg"></div>

            <h4 style="margin-bottom:10px;">Códigos VIP activos (sin usar)</h4>
            <div id="lista-codigos-vip" class="list-container" style="background:#f9f9f9; border-radius:8px; height:150px;">
                </div>
        </div>

        <div class="card">
            <h2>👥 Censo de Usuarios</h2>
            <p style="color:gray; font-size:0.9rem;">Aquí están todos los registrados en la App.</p>
            <div id="lista-usuarios" class="list-container">
                Cargando...
            </div>
        </div>

    </div>
</body>
</html>
