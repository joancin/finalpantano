<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades · Fiestas Pantano 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e8400c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">

    <!-- ═══ FIREBASE — LÓGICA 100% IDÉNTICA AL ORIGINAL ══════════════ -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc,
               arrayUnion, getDoc, where, enableIndexedDbPersistence }
          from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged }
          from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
          apiKey:"AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
          authDomain:"fiestas-pantano.firebaseapp.com",
          projectId:"fiestas-pantano",
          storageBucket:"fiestas-pantano.firebasestorage.app",
          messagingSenderId:"801380435613",
          appId:"1:801380435613:web:a842572cf7cee93ac57674",
          measurementId:"G-EG2MZGBT1B"
      };
      const app  = initializeApp(firebaseConfig);
      const db   = getFirestore(app);
      const auth = getAuth(app);

      enableIndexedDbPersistence(db).catch(err => console.log("Persistencia:", err.code));

      let currentUser = null, myUsername = "";
      let allActivities = [], selectedDay = "";

      onAuthStateChanged(auth, async (user) => {
          if (!user) { window.location.href = "index.html"; return; }
          currentUser = user;
          const uDoc = await getDoc(doc(db,"usuarios",user.uid));
          if (uDoc.exists()) myUsername = uDoc.data().username;
          cargarActividades();
      });

      async function cargarActividades() {
          const q = query(collection(db,"actividades"), orderBy("fecha","asc"));
          const snap = await getDocs(q);
          allActivities = [];
          snap.forEach(d => allActivities.push({ id:d.id, ...d.data() }));
          generarTabsDias();
          if (!selectedDay && allActivities.length > 0)
              selectedDay = allActivities[0].fecha.toDate().toDateString();
          renderActivities();
      }

      function generarTabsDias() {
          const container = document.getElementById("date-tabs");
          const uniqueDays = {};
          allActivities.forEach(act => {
              const d = act.fecha.toDate(), key = d.toDateString();
              if (!uniqueDays[key]) uniqueDays[key] = d;
          });
          container.innerHTML = Object.keys(uniqueDays).map(key => {
              const d = uniqueDays[key];
              const dayName = d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','');
              const mon     = d.toLocaleDateString('es-ES',{month:'short'}).replace('.','');
              return `
                <button class="date-tab ${selectedDay===key?'active':''}"
                        onclick="setDay('${key}')" aria-label="${dayName} ${d.getDate()}">
                    <span class="tab-day">${dayName}</span>
                    <span class="tab-num">${d.getDate()}</span>
                    <span class="tab-mon">${mon}</span>
                </button>`;
          }).join('');
      }

      window.setDay = (key) => {
          selectedDay = key; generarTabsDias(); renderActivities();
      };

      window.renderActivities = () => {
          const container = document.getElementById("activities-container");
          const filtered = allActivities.filter(a => a.fecha.toDate().toDateString()===selectedDay);
          if (filtered.length === 0) {
              container.innerHTML = `
                <div class="empty-state">
                    <span class="material-symbols-outlined">event_busy</span>
                    <p>No hay eventos este día</p>
                    <span>Prueba con otro día usando las pestañas de arriba</span>
                </div>`; return;
          }
          container.innerHTML = filtered.map((act, i) => {
              const timeStr  = act.fecha.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
              const cat      = getCat(act.genero);
              const inscritos = act.inscritos || [];
              const yoEstoy  = inscritos.some(e =>
                  e.capitan_uid===currentUser?.uid ||
                  e.miembros?.some(m=>m.uid===currentUser?.uid));
              const estaLibre = act.modalidad==='sin_inscripcion';
              return `
              <div class="act-card" onclick="verDetalles('${act.id}')"
                   role="button" tabindex="0" style="animation-delay:${i*45}ms">
                  ${act.imagen
                    ? `<div class="act-img-wrap"><img src="${act.imagen}" class="act-img" alt="${act.titulo}"
                           onerror="this.parentElement.innerHTML='<div class=act-img-placeholder style=background:${cat.bg}><span>${cat.emoji}</span></div>'"></div>`
                    : `<div class="act-img-placeholder" style="background:${cat.bg}"><span>${cat.emoji}</span></div>`}
                  <div class="act-body">
                      <div class="act-top">
                          <span class="cat-badge" style="background:${cat.bg};color:${cat.fg}">
                              ${cat.emoji} ${cat.label}
                          </span>
                          ${yoEstoy   ? `<span class="status-badge s-in">✅ Apuntado</span>` : ''}
                          ${!yoEstoy && estaLibre ? `<span class="status-badge s-libre">🔓 Libre</span>` : ''}
                      </div>
                      <h3 class="act-title">${act.titulo}</h3>
                      <div class="meta-row">
                          <span class="meta-pill"><span class="material-symbols-outlined">schedule</span>${timeStr}</span>
                          <span class="meta-pill"><span class="material-symbols-outlined">location_on</span>${act.lugar||'Por definir'}</span>
                          ${inscritos.length>0?`<span class="meta-pill"><span class="material-symbols-outlined">group</span>${inscritos.length} apuntado${inscritos.length!==1?'s':''}</span>`:''}
                      </div>
                      <div class="act-cta">
                          Ver detalles <span class="material-symbols-outlined" style="font-size:16px">chevron_right</span>
                      </div>
                  </div>
              </div>`;
          }).join('');
      };

      window.verDetalles = (id) => {
          const act = allActivities.find(a=>a.id===id);
          if (!act) return;
          const cat = getCat(act.genero);
          const dateFull = act.fecha.toDate().toLocaleString([],{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
          const inscritos = act.inscritos || [];
          let estoyDentro=false, miRol=null;

          // Imagen o placeholder
          const imgWrap = document.getElementById("d-img-wrap");
          imgWrap.innerHTML = act.imagen
            ? `<img src="${act.imagen}" class="modal-header-img" alt="${act.titulo}"
                   onerror="this.parentElement.innerHTML='<div class=modal-placeholder style=background:${cat.bg}><span>${cat.emoji}</span></div>'">`
            : `<div class="modal-placeholder" style="background:${cat.bg}"><span>${cat.emoji}</span></div>`;

          document.getElementById("d-cat").innerHTML =
            `<span class="cat-badge" style="background:${cat.bg};color:${cat.fg}">${cat.emoji} ${cat.label}</span>`;
          document.getElementById("d-title").innerText  = act.titulo;
          document.getElementById("d-date").innerHTML   =
            `<span class="material-symbols-outlined">schedule</span> ${dateFull}`;
          document.getElementById("d-place").innerHTML  =
            `<span class="material-symbols-outlined">location_on</span> ${act.lugar||'Por definir'}`;
          document.getElementById("d-desc").innerHTML   =
            act.descripcion ? `<div class="detail-desc">${act.descripcion}</div>` : "";

          // Participantes
          let pHTML = "";
          if (inscritos.length===0) {
              pHTML = `<p class="no-inscritos">Nadie apuntado aún — ¡sé el primero!</p>`;
          } else {
              pHTML = inscritos.map(e => {
                  const nombre = e.nombre_equipo||e.capitan||"Usuario";
                  const members = e.miembros?.map(m=>m.nombre).join(", ")||"";
                  if (e.capitan_uid===currentUser.uid) { estoyDentro=true; miRol='capitan'; }
                  if (e.miembros?.some(m=>m.uid===currentUser.uid)) { estoyDentro=true; miRol='miembro'; }
                  return `
                    <div class="p-row">
                        <div class="p-ava">${nombre[0]?.toUpperCase()||'?'}</div>
                        <div class="p-info">
                            <div class="p-name">${nombre}</div>
                            ${members?`<div class="p-mems">${members}</div>`:''}
                        </div>
                    </div>`;
              }).join('');
          }
          document.getElementById("d-list").innerHTML  = pHTML;
          document.getElementById("d-count").innerText =
            inscritos.length===0 ? "nadie aún" : inscritos.length+" participante"+(inscritos.length!==1?"s":"");

          // Botones extra — igual al original
          let extraHTML = `<a href="chat.html?id=${act.id}" class="btn-extra btn-blue">💬 Chat del evento</a>`;
          if (act.genero==='carrera'||act.genero==='concurso')
              extraHTML += `<a href="ver_carrera.html?id=${act.id}" class="btn-extra btn-orange">📊 Resultados</a>`;
          if (act.genero==='torneo')
              extraHTML += `<a href="ver_torneo.html?id=${act.id}" class="btn-extra btn-pink">🏆 Cuadro</a>`;
          document.getElementById("d-actions").innerHTML = `<div class="extra-row">${extraHTML}</div>`;

          // Botón inscripción — igual al original
          const inscArea = document.getElementById("d-inscripcion");
          if (act.modalidad==='sin_inscripcion') {
              inscArea.innerHTML = `
                <div class="badge-libre">
                    <span class="material-symbols-outlined">lock_open</span>
                    <div><strong>Entrada libre</strong><span>No necesitas apuntarte</span></div>
                </div>`;
          } else if (estoyDentro) {
              inscArea.innerHTML = `
                <button class="btn-full btn-leave" onclick="salirDeActividad('${act.id}','${miRol}')">
                    <span class="material-symbols-outlined">person_remove</span> Darme de baja
                </button>`;
          } else {
              inscArea.innerHTML = `
                <button class="btn-full btn-join" onclick="prepararInscripcion('${act.id}','${act.modalidad}',${act.tamano_equipo||1})">
                    <span class="material-symbols-outlined">how_to_reg</span> ¡Apuntarme!
                </button>`;
          }
          abrirModal('modal-detalles');
      };

      window.cerrarDetalles = () => cerrarModal('modal-detalles');

      let currentActId="", currentModalidad="";

      window.prepararInscripcion = (id, mod, size) => {
          cerrarModal('modal-detalles');
          currentActId=id; currentModalidad=mod;
          document.getElementById("modal-titulo").innerText =
            mod==='individual' ? "Confirmar asistencia" : `Inscribir equipo (${mod})`;
          let html = "";
          if (mod==='individual') {
              html = `<div class="confirm-box"><span>🎉</span><p>¿Te apuntas?</p>
                      <span>Te registras como: <strong>${myUsername}</strong></span></div>`;
          } else {
              html = `<div class="capitan-row"><span class="material-symbols-outlined">star</span>
                      Capitán: <strong>${myUsername}</strong></div>
                      <p class="mates-hint">Añade compañeros (opcional, deben tener cuenta):</p>`;
              const n = mod==='parejas' ? 1 : (size-1);
              for (let i=0;i<n;i++) html += `
                <div class="mate-field">
                    <span class="material-symbols-outlined">person_search</span>
                    <input type="text" class="mate-input"
                           placeholder="Usuario compañero ${i+1}"
                           onkeyup="verificarUsuario(this)">
                </div>`;
          }
          document.getElementById("modal-inputs").innerHTML = html;
          abrirModal('modal-inscripcion');
      };

      window.cerrarInscripcion = () => cerrarModal('modal-inscripcion');

      window.verificarUsuario = async (input) => {
          const val = input.value.trim();
          if (val.length<2) { input.classList.remove('mate-ok','mate-err'); input.removeAttribute('data-uid'); return; }
          const q = query(collection(db,"usuarios"), where("username","==",val));
          const snap = await getDocs(q);
          if (!snap.empty) { input.classList.add('mate-ok'); input.classList.remove('mate-err'); input.setAttribute('data-uid',snap.docs[0].id); }
          else { input.classList.remove('mate-ok'); input.classList.add('mate-err'); input.removeAttribute('data-uid'); }
      };

      window.confirmarInscripcion = async () => {
          const btn = document.getElementById("btn-confirmar");
          btn.innerText="Guardando…"; btn.disabled=true;
          try {
              let data = { capitan:myUsername, capitan_uid:currentUser.uid, fecha:new Date(), nombre_equipo:myUsername, miembros:[] };
              if (currentModalidad!=='individual') {
                  document.querySelectorAll(".mate-input").forEach(inp => {
                      if (inp.value.trim()) data.miembros.push({
                          nombre:inp.value.trim(),
                          uid:inp.getAttribute('data-uid')||null,
                          vinculado:!!inp.getAttribute('data-uid')
                      });
                  });
              }
              await updateDoc(doc(db,"actividades",currentActId), { inscritos: arrayUnion(data) });
              cerrarModal('modal-inscripcion');
              showToast("✅ ¡Inscrito correctamente!");
              cargarActividades();
          } catch(e) { showToast("❌ "+e.message); }
          btn.innerText="Confirmar"; btn.disabled=false;
      };

      window.salirDeActividad = async (actId, miRol) => {
          if (!confirm("¿Seguro que quieres borrarte?")) return;
          try {
              const actRef = doc(db,"actividades",actId);
              const snap   = await getDoc(actRef);
              let inscritos = snap.data().inscritos;
              let nuevos;
              if (miRol==='capitan') nuevos = inscritos.filter(e=>e.capitan_uid!==currentUser.uid);
              else nuevos = inscritos.map(e => {
                  if (e.miembros?.some(m=>m.uid===currentUser.uid))
                      e.miembros = e.miembros.filter(m=>m.uid!==currentUser.uid);
                  return e;
              });
              await updateDoc(actRef, { inscritos:nuevos });
              cerrarModal('modal-detalles');
              showToast("🗑️ Te has dado de baja");
              cargarActividades();
          } catch(e) { showToast("❌ "+e.message); }
      };

      /* helpers */
      function getCat(g) {
          return ({
              deporte: {emoji:'⚽',label:'Deporte', bg:'#dbeafe',fg:'#1d4ed8'},
              concurso:{emoji:'🏆',label:'Concurso',bg:'#fef9c3',fg:'#854d0e'},
              fiesta:  {emoji:'🎉',label:'Fiesta',  bg:'#f3e8ff',fg:'#7e22ce'},
              torneo:  {emoji:'🎮',label:'Torneo',  bg:'#fce7f3',fg:'#9d174d'},
              carrera: {emoji:'🏃',label:'Carrera', bg:'#dcfce7',fg:'#166534'},
          }[g]) || {emoji:'📌',label:'Otro',bg:'#f1f5f9',fg:'#475569'};
      }

      function abrirModal(id) {
          const m=document.getElementById(id);
          m.style.display="flex"; document.body.style.overflow='hidden';
          requestAnimationFrame(()=>m.classList.add('open'));
      }
      function cerrarModal(id) {
          const m=document.getElementById(id);
          m.classList.remove('open');
          setTimeout(()=>{ m.style.display="none"; document.body.style.overflow=''; },280);
      }

      window.showToast = (msg) => {
          const t=document.getElementById('toast');
          t.innerText=msg; t.classList.add('show');
          clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
      };
    </script>

    <style>
        :root {
            --bg:#fdf6ee; --bg2:#f0e4d4; --text:#1a1208; --text2:#7a6550;
            --card:#fff; --border:rgba(0,0,0,0.07);
            --accent:#e8400c; --gold:#f59e0b;
            --shadow:0 4px 20px rgba(0,0,0,0.07); --radius:18px;
        }
        html.dark-mode {
            --bg:#140e08; --bg2:#1e1610; --text:#f0e8dc; --text2:#a89070;
            --card:#241c14; --border:rgba(255,255,255,0.08);
            --shadow:0 4px 20px rgba(0,0,0,0.45);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);
             color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:90px;}

        /* TOPBAR */
        .topbar{position:fixed;top:0;left:0;right:0;z-index:100;
            background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);}
        .topbar-row{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;}
        .topbar-title{font-size:1.2rem;font-weight:800;flex:1;}
        .btn-ico{background:var(--card);border:1px solid var(--border);width:38px;height:38px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            cursor:pointer;color:var(--text);transition:transform .15s;box-shadow:var(--shadow);
            text-decoration:none;flex-shrink:0;}
        .btn-ico:active{transform:scale(.9);}

        /* TABS */
        .tabs-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;
            scrollbar-width:none;-webkit-overflow-scrolling:touch;}
        .tabs-scroll::-webkit-scrollbar{display:none;}
        .date-tab{background:var(--card);border:2px solid var(--border);
            padding:10px 16px;border-radius:14px;text-align:center;min-width:64px;
            cursor:pointer;flex-shrink:0;transition:all .2s;
            display:flex;flex-direction:column;align-items:center;gap:1px;
            font-family:inherit;color:var(--text2);}
        .date-tab.active{background:var(--accent);color:white;border-color:var(--accent);
            box-shadow:0 4px 14px rgba(232,64,12,.35);transform:scale(1.06);}
        .tab-day{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;}
        .tab-num{font-size:1.5rem;font-weight:800;line-height:1;}
        .tab-mon{font-size:.58rem;text-transform:uppercase;opacity:.7;}

        /* MAIN */
        .main-content{padding:18px;padding-top:130px;max-width:680px;margin:0 auto;}

        /* EMPTY */
        .empty-state{text-align:center;padding:60px 20px;color:var(--text2);
            display:flex;flex-direction:column;align-items:center;gap:10px;}
        .empty-state .material-symbols-outlined{font-size:52px;opacity:.25;}
        .empty-state p{font-size:1rem;font-weight:700;color:var(--text);}
        .empty-state span{font-size:.82rem;}

        /* CARD */
        .act-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
            overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;
            transition:transform .2s,box-shadow .2s;
            animation:fadeUp .3s ease backwards;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
        .act-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.1);}
        .act-card:active{transform:scale(.98);}

        .act-img-wrap{position:relative;}
        .act-img{width:100%;height:170px;object-fit:cover;display:block;}
        .act-img-placeholder{width:100%;height:110px;display:flex;align-items:center;
            justify-content:center;font-size:2.8rem;opacity:.85;}

        .act-body{padding:16px 18px 14px;}
        .act-top{display:flex;align-items:center;justify-content:space-between;
            margin-bottom:10px;gap:8px;flex-wrap:wrap;}
        .cat-badge{padding:4px 12px;border-radius:20px;font-size:.72rem;
            font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
        .status-badge{padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:800;}
        .s-in   {background:#dcfce7;color:#166534;}
        .s-libre{background:#f0fdf4;color:#15803d;}

        .act-title{font-size:1.1rem;font-weight:800;line-height:1.25;margin-bottom:10px;}
        .meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
        .meta-pill{display:flex;align-items:center;gap:4px;font-size:.78rem;color:var(--text2);
            font-weight:600;background:var(--bg2);padding:4px 10px;border-radius:20px;}
        .meta-pill .material-symbols-outlined{font-size:14px;}
        .act-cta{display:flex;align-items:center;justify-content:flex-end;gap:2px;
            color:var(--accent);font-size:.8rem;font-weight:800;}

        /* MODAL */
        .modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);
            display:none;justify-content:center;align-items:flex-end;backdrop-filter:blur(6px);}
        .modal-overlay.open .modal-sheet{animation:sheetUp .3s cubic-bezier(.32,.72,0,1);}
        @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-sheet{background:var(--card);border-radius:28px 28px 0 0;width:100%;
            max-width:620px;max-height:90vh;overflow-y:auto;position:relative;}
        .modal-handle{width:40px;height:4px;background:var(--border);
            border-radius:2px;margin:12px auto 0;}
        .btn-close{position:sticky;top:0;float:right;margin:8px 16px 0 0;
            background:var(--bg2);border:none;color:var(--text);width:36px;height:36px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;
            cursor:pointer;z-index:10;transition:background .2s;}
        .btn-close:hover{background:var(--border);}

        .modal-header-img{width:100%;height:220px;object-fit:cover;display:block;}
        .modal-placeholder{width:100%;height:150px;display:flex;align-items:center;
            justify-content:center;font-size:3.5rem;opacity:.8;}
        .modal-body{padding:20px 20px 44px;}
        .detail-title{font-size:1.5rem;font-weight:800;line-height:1.2;margin:12px 0 10px;}
        .detail-meta{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
        .detail-meta-item{display:flex;align-items:center;gap:8px;font-size:.88rem;
            color:var(--text2);font-weight:600;}
        .detail-meta-item .material-symbols-outlined{font-size:18px;color:var(--accent);}
        .detail-desc{background:var(--bg2);border-radius:14px;padding:14px 16px;
            font-size:.88rem;line-height:1.7;margin:14px 0;color:var(--text);}

        .extra-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
        .btn-extra{padding:10px 16px;border-radius:12px;font-weight:800;font-size:.82rem;
            text-decoration:none;display:inline-flex;align-items:center;gap:6px;
            transition:transform .15s;font-family:inherit;border:none;cursor:pointer;}
        .btn-extra:active{transform:scale(.95);}
        .btn-blue  {background:#dbeafe;color:#1d4ed8;}
        .btn-orange{background:#ffedd5;color:#c2410c;}
        .btn-pink  {background:#fce7f3;color:#9d174d;}

        .btn-full{width:100%;padding:16px;border-radius:16px;border:none;font-weight:800;
            font-size:1rem;font-family:inherit;cursor:pointer;display:flex;align-items:center;
            justify-content:center;gap:10px;transition:transform .15s,opacity .2s;margin-top:8px;}
        .btn-full:active{transform:scale(.97);}
        .btn-full:disabled{opacity:.6;cursor:not-allowed;}
        .btn-join {background:var(--accent);color:white;box-shadow:0 4px 14px rgba(232,64,12,.35);}
        .btn-leave{background:#fef2f2;color:#dc2626;border:2px solid #fecaca;}

        .badge-libre{display:flex;align-items:center;gap:14px;background:#f0fdf4;
            border:1px solid #bbf7d0;border-radius:14px;padding:16px;color:#166534;margin-top:8px;}
        .badge-libre .material-symbols-outlined{font-size:26px;color:#16a34a;}
        .badge-libre strong{display:block;font-size:.95rem;font-weight:800;}
        .badge-libre span{font-size:.78rem;opacity:.75;}

        .sec-lbl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;
            color:var(--text2);margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
        .sec-lbl::after{content:'';flex:1;height:1px;background:var(--border);}
        .p-row{display:flex;align-items:center;gap:12px;padding:10px 0;
            border-bottom:1px solid var(--border);}
        .p-row:last-child{border-bottom:none;}
        .p-ava{width:36px;height:36px;border-radius:50%;flex-shrink:0;
            background:linear-gradient(135deg,var(--accent),var(--gold));
            display:flex;align-items:center;justify-content:center;
            color:white;font-weight:800;font-size:.9rem;}
        .p-name{font-weight:700;font-size:.9rem;}
        .p-mems{font-size:.75rem;color:var(--text2);margin-top:2px;}
        .no-inscritos{text-align:center;padding:20px;color:var(--text2);
            font-size:.85rem;line-height:1.6;}

        /* Inscripción modal */
        .confirm-box{text-align:center;padding:20px 10px;display:flex;
            flex-direction:column;align-items:center;gap:8px;}
        .confirm-box span:first-child{font-size:2.5rem;}
        .confirm-box p{font-size:1rem;font-weight:800;}
        .confirm-box span{font-size:.85rem;color:var(--text2);}
        .capitan-row{display:flex;align-items:center;gap:8px;background:rgba(232,64,12,.08);
            border:1px solid rgba(232,64,12,.2);border-radius:12px;padding:12px 14px;
            font-size:.88rem;font-weight:700;color:var(--accent);margin-bottom:14px;}
        .mates-hint{font-size:.8rem;color:var(--text2);margin-bottom:10px;}
        .mate-field{display:flex;align-items:center;gap:10px;background:var(--bg2);
            border-radius:12px;padding:10px 14px;margin-bottom:8px;
            border:2px solid transparent;transition:border-color .2s;}
        .mate-field:focus-within{border-color:var(--accent);}
        .mate-field .material-symbols-outlined{font-size:20px;color:var(--text2);flex-shrink:0;}
        .mate-input{flex:1;border:none;background:transparent;color:var(--text);
            font-family:inherit;font-size:.9rem;outline:none;}
        .mate-input.mate-ok {color:#16a34a;}
        .mate-input.mate-err{color:#dc2626;}
        .modal-btns{display:flex;gap:10px;margin-top:20px;}
        .btn-cancel{flex:1;padding:14px;border-radius:14px;border:none;background:var(--bg2);
            color:var(--text2);font-weight:700;font-family:inherit;font-size:.9rem;cursor:pointer;}

        /* TOAST */
        #toast{position:fixed;bottom:88px;left:50%;
            transform:translateX(-50%) translateY(14px);
            background:#1a1208;color:white;padding:10px 22px;border-radius:30px;
            font-size:.82rem;font-weight:700;opacity:0;transition:all .26s;z-index:9999;
            pointer-events:none;white-space:nowrap;}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        /* BOTTOM NAV */
        .bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);
            border-top:1px solid var(--border);display:flex;justify-content:space-around;
            padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:1000;
            backdrop-filter:blur(12px);}
        .nav-item{border:none;background:transparent;color:var(--text2);
            display:flex;flex-direction:column;align-items:center;font-size:.68rem;
            cursor:pointer;gap:3px;flex:1;text-decoration:none;
            font-family:inherit;transition:color .15s;}
        .nav-item.active{color:var(--accent);font-weight:800;}
        .nav-item .material-symbols-outlined{font-size:24px;}
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-row">
            <a href="panel.html" class="btn-ico" aria-label="Inicio">
                <span class="material-symbols-outlined" style="font-size:20px">home</span>
            </a>
            <span class="topbar-title">🎉 Actividades</span>
        </div>
        <div id="date-tabs" class="tabs-scroll"></div>
    </div>

    <!-- LISTA -->
    <div class="main-content" id="activities-container">
        <div class="empty-state">
            <span class="material-symbols-outlined">hourglass_empty</span>
            <p>Cargando actividades…</p>
            <span>Un momento por favor</span>
        </div>
    </div>

    <!-- MODAL DETALLES -->
    <div id="modal-detalles" class="modal-overlay"
         onclick="if(event.target===this) cerrarDetalles()">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <button class="btn-close" onclick="cerrarDetalles()" aria-label="Cerrar">
                <span class="material-symbols-outlined" style="font-size:18px">close</span>
            </button>
            <div id="d-img-wrap"></div>
            <div class="modal-body">
                <div id="d-cat"></div>
                <h2 id="d-title" class="detail-title"></h2>
                <div class="detail-meta">
                    <div id="d-date" class="detail-meta-item"></div>
                    <div id="d-place" class="detail-meta-item"></div>
                </div>
                <div id="d-desc"></div>
                <div id="d-actions"></div>
                <div id="d-inscripcion"></div>
                <div class="sec-lbl">
                    <span class="material-symbols-outlined" style="font-size:16px">group</span>
                    Participantes
                    <span id="d-count" style="margin-left:auto;font-size:.68rem;font-weight:700;text-transform:none;letter-spacing:0;color:var(--text2);"></span>
                </div>
                <div id="d-list"></div>
            </div>
        </div>
    </div>

    <!-- MODAL INSCRIPCIÓN -->
    <div id="modal-inscripcion" class="modal-overlay"
         onclick="if(event.target===this) cerrarInscripcion()">
        <div class="modal-sheet" style="max-width:460px;">
            <div class="modal-handle"></div>
            <button class="btn-close" onclick="cerrarInscripcion()" aria-label="Cerrar">
                <span class="material-symbols-outlined" style="font-size:18px">close</span>
            </button>
            <div style="padding:10px 20px 40px;">
                <h2 id="modal-titulo" style="font-size:1.2rem;font-weight:800;margin-bottom:16px;"></h2>
                <div id="modal-inputs"></div>
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="cerrarInscripcion()">Cancelar</button>
                    <button id="btn-confirmar" class="btn-full btn-join"
                            style="margin-top:0;flex:2;" onclick="confirmarInscripcion()">
                        <span class="material-symbols-outlined">check_circle</span> Confirmar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <nav class="bottom-nav">
        <a href="panel.html"             class="nav-item"><span class="material-symbols-outlined">home</span>Inicio</a>
        <a href="actividades.html"       class="nav-item active"><span class="material-symbols-outlined">event</span>Fiestas</a>
        <a href="mis_inscripciones.html" class="nav-item"><span class="material-symbols-outlined">confirmation_number</span>Tickets</a>
        <a href="perfil.html"            class="nav-item"><span class="material-symbols-outlined">person</span>Perfil</a>
    </nav>
</body>
</html>
