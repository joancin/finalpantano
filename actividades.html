<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades - Fiestas</title>
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff5722; --border: #ddd; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; padding-bottom: 90px; /* Espacio para la barra */ }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: transparent; border: 1px solid var(--text); color: var(--text); padding: 8px 15px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .act-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .act-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .act-body { padding: 20px; }
        .act-title { margin: 0; font-size: 1.4rem; color: var(--accent); }
        .act-meta { display: flex; gap: 15px; font-size: 0.9rem; color: gray; margin: 10px 0; align-items: center; }
        .badge { background: #eee; color: #333; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        
        .act-footer { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-join { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-leave { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        
        /* BARRA DE NAVEGACIÓN APP */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; transition: color 0.3s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-item .material-symbols-outlined { font-size: 24px; margin-bottom: 2px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: var(--card); padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; color: var(--text); }
        .modal input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .teammate-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
        
        .msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; display: none; z-index: 3000; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, getDocs, query, orderBy, onSnapshot, doc, updateDoc, arrayUnion, getDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;
      let myUsername = "";
      let currentActId = "", currentModalidad = "", currentTeamSize = 1;

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          currentUser = user;
          const uDoc = await getDoc(doc(db, "usuarios", user.uid));
          if(uDoc.exists()) myUsername = uDoc.data().username;
          aplicarTema();
          cargarActividades();
      });

      function cargarActividades() {
          const q = query(collection(db, "actividades"), orderBy("fecha", "asc"));
          onSnapshot(q, (snapshot) => {
              const container = document.getElementById("activities-container");
              container.innerHTML = "";
              if (snapshot.empty) { container.innerHTML = "<p style='text-align:center'>No hay actividades.</p>"; return; }

              snapshot.forEach((docSnap) => {
                  const act = docSnap.data();
                  const actId = docSnap.id;
                  const fechaStr = new Date(act.fecha.toDate ? act.fecha.toDate() : act.fecha).toLocaleString();
                  const inscritos = act.inscritos || []; 
                  let estoyDentro = false;
                  inscritos.forEach(equipo => {
                      if (equipo.capitan_uid === currentUser.uid) estoyDentro = true;
                      if (equipo.miembros && equipo.miembros.some(m => m.uid === currentUser.uid)) estoyDentro = true;
                  });

                  let imgUrl = act.imagen;
                  if(!imgUrl) {
                      if(act.genero === 'carrera') imgUrl = 'https://cdn-icons-png.flaticon.com/512/2553/2553658.png';
                      else if(act.genero === 'torneo') imgUrl = 'https://cdn-icons-png.flaticon.com/512/1606/1606141.png';
                      else imgUrl = 'https://cdn-icons-png.flaticon.com/512/3159/3159066.png';
                  }

                  const div = document.createElement("div");
                  div.className = "act-card";
                  div.innerHTML = `
                      <img src="${imgUrl}" class="act-img" onerror="this.src='https://placehold.co/600x200?text=Fiesta'">
                      <div class="act-body">
                          <h3 class="act-title">${act.titulo}</h3>
                          <div class="act-meta"><span>📅 ${fechaStr}</span><span class="badge">${act.modalidad}</span></div>
                          <div class="act-footer">
                              <div>${estoyDentro ? '<span style="color:green; font-weight:bold;">✅ Inscrito</span>' : `<span style="color:gray">${inscritos.length} inscritos</span>`}</div>
                              <div style="display:flex; gap:5px;">
                                  <button class="btn-join" style="background:#607d8b; padding:8px 12px;" onclick="window.location.href='chat.html?id=${actId}'"><span class="material-symbols-outlined" style="font-size:18px; vertical-align:middle;">chat</span></button>
                                  ${act.genero === 'torneo' && act.bracket ? `<button class="btn-join" style="background:#ff9800; padding:8px 15px;" onclick="window.location.href='ver_torneo.html?id=${actId}'">🏆 Cuadro</button>` : ''}
                                  ${act.genero === 'carrera' ? `<button class="btn-join" style="background:#4caf50; padding:8px 15px;" onclick="window.location.href='ver_carrera.html?id=${actId}'">📊 Podio</button>` : ''}
                                  ${estoyDentro ? `<button class="btn-leave" onclick="alert('Contacta a un organizador.')">Salir</button>` : `<button class="btn-join" onclick="abrirModal('${actId}', '${act.modalidad}', ${act.tamano_equipo || 1})">¡Apuntar!</button>`}
                              </div>
                          </div>
                      </div>`;
                  container.appendChild(div);
              });
          });
      }

      window.abrirModal = (id, modalidad, size) => {
          currentActId = id; currentModalidad = modalidad; currentTeamSize = size;
          const modal = document.getElementById("modal-inscripcion");
          const container = document.getElementById("modal-inputs");
          const tituloModal = document.getElementById("modal-titulo");
          container.innerHTML = ""; 
          
          if (modalidad === 'individual') {
              tituloModal.innerText = "Confirmar Inscripción";
              container.innerHTML = "<p>¿Te apuntas a esta actividad?</p>";
          } else {
              tituloModal.innerText = `Inscripción ${modalidad}`;
              container.innerHTML += `<label>Nombre del Equipo:</label><input type="text" id="team-name" placeholder="Ej: Los Invencibles">`;
              const numCompaneros = (modalidad === 'parejas') ? 1 : (size - 1);
              for(let i=0; i < numCompaneros; i++) {
                  container.innerHTML += `<div class="teammate-row"><input type="text" class="mate-input" placeholder="Usuario compañero ${i+1}"></div>`;
              }
          }
          modal.style.display = "flex";
      }

      window.cerrarModal = () => { document.getElementById("modal-inscripcion").style.display = "none"; }

      window.confirmarInscripcion = async () => {
          const btn = document.getElementById("btn-confirmar");
          btn.innerText = "Procesando..."; btn.disabled = true;
          try {
              let datosEquipo = { capitan: myUsername, capitan_uid: currentUser.uid, fecha_registro: new Date(), miembros: [] };
              if (currentModalidad !== 'individual') {
                  const nombreEquipo = document.getElementById("team-name").value;
                  if (!nombreEquipo) throw new Error("Pon nombre de equipo");
                  datosEquipo.nombre_equipo = nombreEquipo;
                  const inputs = document.querySelectorAll(".mate-input");
                  const promesas = Array.from(inputs).map(async (input) => {
                      const nombre = input.value.trim().toLowerCase(); 
                      if (!nombre) return null; 
                      const q = query(collection(db, "usuarios"), where("username", "==", nombre));
                      const snap = await getDocs(q);
                      return !snap.empty ? { nombre: snap.docs[0].data().username, uid: snap.docs[0].id, vinculado: true } : { nombre: input.value.trim(), vinculado: false };
                  });
                  const res = await Promise.all(promesas);
                  datosEquipo.miembros = res.filter(r => r !== null);
              }
              await updateDoc(doc(db, "actividades", currentActId), { inscritos: arrayUnion(datosEquipo) });
              mostrarToat("✅ ¡Inscripción completada!");
              cerrarModal();
          } catch (e) { alert("Error: " + e.message); } finally { btn.innerText = "Confirmar"; btn.disabled = false; }
      }

      function mostrarToat(txt) { const t = document.getElementById("toast"); t.innerText = txt; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3000); }
      function aplicarTema() { if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode'); }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Calendario</h1>
        </div>
        <div id="activities-container">Cargando...</div>
        <div id="toast" class="msg"></div>
    </div>

    <div id="modal-inscripcion" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-titulo">Inscripción</h2>
            <div id="modal-inputs"></div>
            <div style="margin-top:20px; display:flex; gap:10px;">
                <button onclick="confirmarInscripcion()" id="btn-confirmar" class="btn-join" style="width:100%">Confirmar</button>
                <button onclick="cerrarModal()" class="btn-leave">Cancelar</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item">
            <span class="material-symbols-outlined">home</span>Inicio
        </a>
        <a href="#" class="nav-item active"> <span class="material-symbols-outlined">event</span>Fiestas
        </a>
        <a href="mis_inscripciones.html" class="nav-item">
            <span class="material-symbols-outlined">confirmation_number</span>Tickets
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="material-symbols-outlined">person</span>Perfil
        </a>
    </nav>
</body>
</html>
