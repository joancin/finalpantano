<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Eventos</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff5722; --border: #ddd; }
        
        /* MODO OSCURO EN HTML */
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; padding-bottom: 90px; transition: background 0.3s; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .ticket-card { background: var(--card); border-left: 5px solid var(--accent); padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .ticket-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .ticket-date { color: gray; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
        .ticket-role { position: absolute; top: 15px; right: 15px; background: #eee; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: #333; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; transition: color 0.3s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-item .material-symbols-outlined { font-size: 24px; margin-bottom: 2px; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          
          const q = query(collection(db, "actividades"), orderBy("fecha", "asc"));
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("my-tickets");
              lista.innerHTML = "";
              let count = 0;

              snapshot.forEach((docSnap) => {
                  const act = docSnap.data();
                  const inscritos = act.inscritos || [];
                  let miRol = null;

                  inscritos.forEach(equipo => {
                      if (equipo.capitan_uid === user.uid) miRol = "Capitán";
                      else if (equipo.miembros && equipo.miembros.some(m => m.uid === user.uid)) miRol = "Miembro";
                  });

                  if (miRol) {
                      count++;
                      const fecha = act.fecha.toDate ? act.fecha.toDate().toLocaleString() : new Date(act.fecha).toLocaleString();
                      lista.innerHTML += `
                        <div class="ticket-card">
                            <div class="ticket-title">${act.titulo}</div>
                            <div class="ticket-date"><span class="material-symbols-outlined" style="font-size:16px">event</span> ${fecha}</div>
                            <div class="ticket-role">${miRol}</div>
                        </div>`;
                  }
              });
              if(count === 0) lista.innerHTML = "<p style='text-align:center; margin-top:50px; color:gray;'>No estás apuntado a nada aún.</p>";
          });
      });
    </script>
</head>
<body>
    <div class="container">
        <h1>🎟️ Mis Inscripciones</h1>
        <div id="my-tickets">Cargando...</div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item">
            <span class="material-symbols-outlined">home</span>Inicio
        </a>
        <a href="actividades.html" class="nav-item">
            <span class="material-symbols-outlined">event</span>Fiestas
        </a>
        <a href="#" class="nav-item active"> <span class="material-symbols-outlined">confirmation_number</span>Tickets
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="material-symbols-outlined">person</span>Perfil
        </a>
    </nav>
</body>
</html>
