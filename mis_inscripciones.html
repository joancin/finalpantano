<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tickets</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff5722; --border: #ddd; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 90px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.5rem; }

        /* SWITCH TOGGLE */
        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* GRID LAYOUT */
        .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

        .ticket { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; border: 1px solid var(--border); transition: transform 0.2s; }
        .ticket:active { transform: scale(0.98); }
        .ticket.past { opacity: 0.6; filter: grayscale(1); }
        
        .ticket-head { background: var(--accent); padding: 10px; height: 40px; position: relative; }
        .ticket.past .ticket-head { background: gray; }
        
        /* Círculo decorativo */
        .ticket-head::after { content: ""; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: var(--card); border-radius: 50%; }

        .ticket-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 20px; }
        .t-title { font-size: 0.95rem; margin: 0; margin-bottom: 5px; line-height: 1.2; font-weight: 800; }
        .t-date { font-size: 0.8rem; color: gray; display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
        
        .t-badge { display: inline-block; padding: 3px 8px; background: rgba(0,0,0,0.05); border-radius: 10px; font-size: 0.7rem; font-weight: bold; color: var(--text); border: 1px solid var(--border); width: fit-content; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .material-symbols-outlined { font-size: 24px; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      let allTickets = [];
      let myUsername = "";

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          
          // Obtenemos tu nombre de usuario para buscar también por nombre (para registros viejos)
          const uDoc = await getDoc(doc(db, "usuarios", user.uid));
          if(uDoc.exists()) myUsername = uDoc.data().username;

          const q = query(collection(db, "actividades"), orderBy("fecha", "asc"));
          onSnapshot(q, (snapshot) => {
              allTickets = [];
              snapshot.forEach((docSnap) => {
                  const act = docSnap.data();
                  const inscritos = act.inscritos || [];
                  const fechaEvento = act.fecha.toDate ? act.fecha.toDate() : new Date(act.fecha);
                  
                  let miRol = null;
                  let miEquipo = null;

                  // 1. ¿SOY CAPITÁN? (Por UID o por Nombre)
                  const capitan = inscritos.find(e => e.capitan_uid === user.uid || e.capitan === myUsername);
                  
                  if (capitan) {
                      miRol = "Titular";
                      miEquipo = capitan;
                  } else {
                      // 2. ¿SOY MIEMBRO? (Buscamos por nombre en la lista de miembros)
                      const miembro = inscritos.find(e => e.miembros && e.miembros.some(m => m.nombre === myUsername));
                      if (miembro) {
                          miRol = "Acompañante";
                          miEquipo = miembro;
                      }
                  }

                  if (miEquipo) {
                      allTickets.push({
                          id: docSnap.id,
                          titulo: act.titulo,
                          fecha: fechaEvento,
                          rol: miRol,
                          equipo: miEquipo.nombre_equipo || 'Individual',
                          esPasado: fechaEvento < new Date()
                      });
                  }
              });
              renderTickets();
          });
      });

      window.renderTickets = () => {
          const container = document.getElementById("tickets-grid");
          const hidePast = document.getElementById("toggle-past").checked;
          
          container.innerHTML = "";

          const filtered = allTickets.filter(t => hidePast ? !t.esPasado : true);

          if(filtered.length === 0) {
              container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:gray; margin-top:40px;">No encuentro entradas con tu usuario.</p>`;
              return;
          }

          filtered.forEach(t => {
              const fechaStr = t.fecha.toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
              
              container.innerHTML += `
                <div class="ticket ${t.esPasado ? 'past' : ''}">
                    <div class="ticket-head"></div>
                    <div class="ticket-body">
                        <div>
                            <h3 class="t-title">${t.titulo}</h3>
                            <div class="t-date"><span class="material-symbols-outlined" style="font-size:16px">event</span> ${fechaStr}</div>
                            <div class="t-date"><span class="material-symbols-outlined" style="font-size:16px">group</span> ${t.equipo}</div>
                        </div>
                        <div style="margin-top:10px;">
                            <span class="t-badge" style="${t.rol === 'Titular' ? 'background:#e3f2fd; color:#1565c0' : 'background:#f3e5f5; color:#7b1fa2'}">${t.rol}</span>
                            ${t.esPasado ? '<span class="t-badge" style="background:#eee; color:gray">FINALIZADO</span>' : ''}
                        </div>
                    </div>
                </div>`;
          });
      }
    </script>
</head>
<body>
    <div class="container">
        <div class="header-tools">
            <h1>Mis Tickets</h1>
            <label class="toggle-container">
                Ocultar Pasados
                <div class="switch">
                    <input type="checkbox" id="toggle-past" checked onchange="renderTickets()">
                    <span class="slider"></span>
                </div>
            </label>
        </div>

        <div id="tickets-grid" class="tickets-grid">Cargando...</div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item"><span class="material-symbols-outlined">home</span>Inicio</a>
        <a href="actividades.html" class="nav-item"><span class="material-symbols-outlined">event</span>Fiestas</a>
        <a href="#" class="nav-item active"><span class="material-symbols-outlined">confirmation_number</span>Tickets</a>
        <a href="perfil.html" class="nav-item"><span class="material-symbols-outlined">person</span>Perfil</a>
    </nav>
</body>
</html>
