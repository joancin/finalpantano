<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #009688; --border: #ddd; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; padding-bottom: 90px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 4px solid var(--accent); display: inline-block; padding-bottom: 5px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        /* Input File Personalizado */
        input[type="file"] { padding: 10px; background: rgba(0,0,0,0.05); cursor: pointer; }

        .btn-create { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-cancel { background: #9e9e9e; display: none; margin-top: 10px; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border); }
        .item-info { flex: 1; }
        .item-actions { display: flex; gap: 5px; }
        
        .btn-icon { border: none; border-radius: 8px; cursor: pointer; font-weight: bold; padding: 8px 12px; display: flex; align-items: center; justify-content: center; }
        .btn-del { background: #ff4444; color: white; }
        .btn-edit { background: #2196f3; color: white; }
        .btn-manage { background: #ff9800; color: white; }
        .btn-users { background: #673ab7; color: white; }

        .img-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; background: #eee; }

        /* MODAL LISTA */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: var(--card); padding: 20px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; color: var(--text); display: flex; flex-direction: column; }
        
        .participant-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px; border-bottom: 1px solid var(--border); }
        
        /* FORMULARIO MANUAL DINÁMICO */
        .add-section { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--border); }
        .manual-inputs-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .manual-input { padding: 8px !important; font-size: 0.9rem; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .material-symbols-outlined { font-size: 24px; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, updateDoc, query, orderBy, onSnapshot, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      // IMPORTAMOS STORAGE PARA LAS IMÁGENES
      import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      const storage = getStorage(app);
      
      let editMode = false;
      let editId = "";
      let currentParticipantsAct = null; // Guardamos el objeto entero de la actividad

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          const uDoc = await getDoc(doc(db, "usuarios", user.uid));
          if (!uDoc.exists() || (uDoc.data().rol !== 'festero' && uDoc.data().rol !== 'admin')) window.location.href = "panel.html";
          escucharActividades();
      });

      // --- SUBIDA DE IMAGEN ---
      window.previewImage = () => {
          const file = document.getElementById("act-image-file").files[0];
          const img = document.getElementById("img-preview");
          if(file) { 
              img.src = URL.createObjectURL(file); 
              img.style.display = "block"; 
          } else { img.style.display = "none"; }
      }

      async function subirImagen(file) {
          if(!file) return null;
          // Creamos una referencia única: imagenes/timestamp_nombre
          const storageRef = ref(storage, `actividades/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          return await getDownloadURL(storageRef);
      }

      window.guardarActividad = async () => {
          const btn = document.getElementById("btn-submit");
          btn.innerText = "Subiendo..."; btn.disabled = true;

          try {
              const titulo = document.getElementById("act-title").value;
              const fechaStr = document.getElementById("act-date").value;
              const lugar = document.getElementById("act-place").value;
              const descripcion = document.getElementById("act-desc").value;
              const genero = document.getElementById("act-genre").value;
              const audiencia = document.getElementById("act-audience").value;
              const modalidad = document.getElementById("act-modality").value;
              const tamano = document.getElementById("act-size").value;
              const fileInput = document.getElementById("act-image-file");

              if(!titulo || !fechaStr) throw new Error("Faltan datos obligatorios");
              
              let imagenUrl = document.getElementById("img-preview").src; // Mantener la que había si no se cambia
              // Si hay archivo nuevo, lo subimos
              if(fileInput.files.length > 0) {
                  imagenUrl = await subirImagen(fileInput.files[0]);
              } else if (!editMode && fileInput.files.length === 0) {
                  imagenUrl = ""; // Si es nuevo y no hay foto
              }

              const data = { 
                  titulo, fecha: new Date(fechaStr), lugar, descripcion, 
                  imagen: imagenUrl, // Guardamos la URL de Firebase
                  genero, audiencia, modalidad, 
                  tamano_equipo: parseInt(tamano)
              };

              if (editMode) {
                  await updateDoc(doc(db, "actividades", editId), data);
                  alert("✅ Actividad Actualizada");
                  cancelarEdicion();
              } else {
                  data.inscritos = []; 
                  await addDoc(collection(db, "actividades"), data);
                  alert("✅ Actividad Creada");
                  limpiarForm();
              }
          } catch(e) { 
              alert("Error: " + e.message); 
          }
          btn.innerText = editMode ? "Guardar Cambios" : "Publicar"; btn.disabled = false;
      }

      function escucharActividades() {
          const q = query(collection(db, "actividades"), orderBy("fecha", "asc"));
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("admin-list");
              lista.innerHTML = "";
              snapshot.forEach((d) => {
                  const act = d.data();
                  const fecha = act.fecha.toDate ? act.fecha.toDate().toLocaleDateString() : '';
                  
                  let btnGestion = "";
                  if (act.genero === 'torneo') btnGestion = `<button class="btn-icon btn-manage" onclick="window.location.href='gestionar_bracket.html?id=${d.id}'"><span class="material-symbols-outlined" style="font-size:18px">emoji_events</span></button>`;
                  else if (act.genero === 'carrera' || act.genero === 'concurso') btnGestion = `<button class="btn-icon btn-manage" onclick="window.location.href='gestionar_podio.html?id=${d.id}'"><span class="material-symbols-outlined" style="font-size:18px">podium</span></button>`;

                  // Pasamos el ID y los datos crudos para evitar errores de JSON
                  lista.innerHTML += `
                    <div class="list-item">
                        <img src="${act.imagen || 'https://via.placeholder.com/50'}" style="width:50px; height:50px; object-fit:cover; border-radius:5px; margin-right:10px;">
                        <div class="item-info">
                            <strong>${act.titulo}</strong><br>
                            <small>${fecha} - ${act.genero} (${act.inscritos ? act.inscritos.length : 0} apuntados)</small>
                        </div>
                        <div class="item-actions">
                            <button class="btn-icon btn-users" onclick="abrirParticipantes('${d.id}')">👥</button>
                            ${btnGestion}
                            <button class="btn-icon btn-edit" onclick="prepararEdicion('${d.id}')">✏️</button>
                            <button class="btn-icon btn-del" onclick="borrar('${d.id}')">🗑️</button>
                        </div>
                    </div>`;
              });
          });
      }

      // --- LÓGICA DE GESTIÓN DE PARTICIPANTES (CORREGIDA) ---
      window.abrirParticipantes = async (actId) => {
          const modal = document.getElementById("modal-participantes");
          const snap = await getDoc(doc(db, "actividades", actId));
          currentParticipantsAct = { id: actId, ...snap.data() };
          
          document.getElementById("p-title").innerText = "Inscritos: " + currentParticipantsAct.titulo;
          
          // GENERAR INPUTS SEGÚN MODALIDAD
          const inputsContainer = document.getElementById("manual-inputs");
          inputsContainer.innerHTML = ""; // Limpiar
          
          // Input Capitán (Siempre)
          inputsContainer.innerHTML += `<input type="text" id="manual-cap" class="manual-input" placeholder="Nombre Capitán / Participante">`;
          
          // Inputs Extra si es equipo
          if (currentParticipantsAct.modalidad !== 'individual') {
              const numExtras = currentParticipantsAct.modalidad === 'parejas' ? 1 : (currentParticipantsAct.tamano_equipo - 1);
              for(let i=0; i < numExtras; i++) {
                  inputsContainer.innerHTML += `<input type="text" class="manual-mate manual-input" placeholder="Nombre Compañero ${i+1}">`;
              }
          }

          renderListaParticipantes(currentParticipantsAct.inscritos || []);
          modal.style.display = "flex";
      }

      function renderListaParticipantes(inscritos) {
          const lista = document.getElementById("p-list");
          lista.innerHTML = "";
          
          if(inscritos.length === 0) { lista.innerHTML = "<p style='color:gray; text-align:center;'>Nadie apuntado aún.</p>"; return; }

          inscritos.forEach((insc, idx) => {
              const nombre = insc.nombre_equipo || insc.capitan || "Sin Nombre";
              // Mostrar miembros si los hay
              let miembrosTxt = "";
              if(insc.miembros && insc.miembros.length > 0) {
                  miembrosTxt = "<br><small style='color:gray'>+ " + insc.miembros.map(m => m.nombre).join(", ") + "</small>";
              }
              
              lista.innerHTML += `
                <div class="participant-row">
                    <div>
                        <strong>${nombre}</strong>
                        ${miembrosTxt}
                        <div style="font-size:0.75rem; color:var(--accent); margin-top:2px;">${insc.capitan_uid === 'manual' ? '📝 Manual' : '📱 App'}</div>
                    </div>
                    <button class="btn-icon btn-del" style="padding:5px;" onclick="borrarParticipante(${idx})">×</button>
                </div>`;
          });
      }

      window.agregarParticipanteManual = async () => {
          const capName = document.getElementById("manual-cap").value.trim();
          if(!capName) return alert("Falta el nombre principal");

          // Recoger compañeros
          const miembros = [];
          document.querySelectorAll(".manual-mate").forEach(input => {
              if(input.value.trim()) {
                  miembros.push({ nombre: input.value.trim(), uid: null, vinculado: false });
              }
          });

          const nuevaInscripcion = {
              capitan: capName,
              nombre_equipo: capName, // Importante para que salga en torneos
              capitan_uid: 'manual',
              fecha: new Date(),
              miembros: miembros
          };

          try {
              const actRef = doc(db, "actividades", currentParticipantsAct.id);
              const snap = await getDoc(actRef); // Recargar por si acaso
              const inscritos = snap.data().inscritos || [];
              
              inscritos.push(nuevaInscripcion);
              
              await updateDoc(actRef, { inscritos: inscritos });
              
              // Limpiar inputs
              document.getElementById("manual-cap").value = "";
              document.querySelectorAll(".manual-mate").forEach(i => i.value = "");
              
              renderListaParticipantes(inscritos);
          } catch(e) { alert("Error: " + e.message); }
      }

      window.borrarParticipante = async (index) => {
          if(!confirm("¿Borrar a este participante?")) return;
          try {
              const actRef = doc(db, "actividades", currentParticipantsAct.id);
              const snap = await getDoc(actRef);
              let inscritos = snap.data().inscritos || [];
              
              inscritos.splice(index, 1);
              
              await updateDoc(actRef, { inscritos: inscritos });
              renderListaParticipantes(inscritos);
          } catch(e) { alert("Error: " + e.message); }
      }

      window.cerrarParticipantes = () => document.getElementById("modal-participantes").style.display = "none";

      // --- EDICIÓN ---
      window.prepararEdicion = async (id) => {
          const snap = await getDoc(doc(db, "actividades", id));
          if(!snap.exists()) return;
          const data = {id: id, ...snap.data()};
          
          editMode = true; editId = data.id;
          document.getElementById("form-title").innerText = "Editar Actividad";
          document.getElementById("btn-submit").innerText = "Guardar Cambios";
          document.getElementById("btn-cancel").style.display = "block";
          
          document.getElementById("act-title").value = data.titulo;
          // Formato fecha para input datetime-local: YYYY-MM-DDTHH:MM
          const d = data.fecha.toDate();
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          document.getElementById("act-date").value = d.toISOString().slice(0,16);
          
          document.getElementById("act-place").value = data.lugar || "";
          document.getElementById("act-desc").value = data.descripcion || "";
          document.getElementById("act-genre").value = data.genero;
          document.getElementById("act-audience").value = data.audiencia || "todos";
          document.getElementById("act-modality").value = data.modalidad;
          document.getElementById("act-size").value = data.tamano_equipo || 5;
          
          if(data.imagen) {
              document.getElementById("img-preview").src = data.imagen;
              document.getElementById("img-preview").style.display = "block";
          } else {
              document.getElementById("img-preview").style.display = "none";
          }

          document.getElementById("size-group").style.display = data.modalidad==='equipos' ? 'block' : 'none';
          window.scrollTo(0,0);
      }

      window.cancelarEdicion = () => {
          editMode = false; editId = "";
          document.getElementById("form-title").innerText = "Crear Actividad";
          document.getElementById("btn-submit").innerText = "Publicar";
          document.getElementById("btn-cancel").style.display = "none";
          limpiarForm();
      }

      function limpiarForm() {
          document.getElementById("act-title").value = "";
          document.getElementById("act-date").value = "";
          document.getElementById("act-place").value = "";
          document.getElementById("act-desc").value = "";
          document.getElementById("act-image-file").value = ""; // Limpiar input file
          document.getElementById("img-preview").style.display = "none";
          document.getElementById("act-size").value = 5;
      }

      window.borrar = async (id) => { if(confirm("¿Borrar evento? Se perderán los inscritos.")) await deleteDoc(doc(db, "actividades", id)); }
    </script>
</head>
<body>
    <div class="container">
        <h1>🛠️ Gestión</h1>
        <div class="card">
            <h2 id="form-title">Crear Actividad</h2>
            <div class="form-group"><label>Título</label><input type="text" id="act-title"></div>
            <div class="form-group"><label>Fecha</label><input type="datetime-local" id="act-date"></div>
            <div class="form-group"><label>Lugar</label><input type="text" id="act-place"></div>
            <div class="form-group"><label>Descripción / Normas</label><textarea id="act-desc"></textarea></div>
            
            <div class="form-group">
                <label>Imagen</label>
                <input type="file" id="act-image-file" accept="image/*" onchange="previewImage()">
                <img id="img-preview" class="img-preview">
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <select id="act-genre">
                    <option value="concurso">🏆 Concurso</option>
                    <option value="deporte">⚽ Deporte</option>
                    <option value="comida">🥘 Comida</option>
                    <option value="fiesta">🎉 Fiesta</option>
                    <option value="carrera">🏃 Carrera</option>
                    <option value="torneo">🎾 Torneo</option>
                    <option value="otro">🎲 Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Público</label>
                <select id="act-audience">
                    <option value="todos">Para Todos</option>
                    <option value="infantil">👶 Infantil</option>
                    <option value="adultos">🔞 Adultos</option>
                </select>
            </div>
            <div class="form-group">
                <label>Modalidad</label>
                <select id="act-modality" onchange="document.getElementById('size-group').style.display = this.value==='equipos' ? 'block' : 'none'">
                    <option value="individual">Individual</option>
                    <option value="parejas">Parejas</option>
                    <option value="equipos">Equipos</option>
                </select>
            </div>
            <div class="form-group" id="size-group" style="display:none;">
                <label>Miembros</label><input type="number" id="act-size" value="5">
            </div>
            <button id="btn-submit" class="btn-create" onclick="guardarActividad()">Publicar</button>
            <button id="btn-cancel" class="btn-create btn-cancel" onclick="cancelarEdicion()">Cancelar</button>
        </div>
        <div class="card">
            <h2>Activas</h2>
            <div id="admin-list">Cargando...</div>
        </div>
    </div>

    <div id="modal-participantes" class="modal-overlay">
        <div class="modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="p-title" style="margin:0;">Inscritos</h3>
                <button onclick="cerrarParticipantes()" style="background:transparent; border:none; font-size:1.5rem; cursor:pointer;">×</button>
            </div>
            
            <div class="add-section">
                <strong style="display:block; margin-bottom:10px; font-size:0.9rem;">Añadir Manualmente:</strong>
                <div id="manual-inputs" class="manual-inputs-grid">
                    </div>
                <button class="btn-create" style="margin:0; width:100%; padding:10px; font-size:0.9rem;" onclick="agregarParticipanteManual()">+ Añadir</button>
            </div>

            <div id="p-list">Cargando...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item"><span class="material-symbols-outlined">home</span>Inicio</a>
        <a href="actividades.html" class="nav-item"><span class="material-symbols-outlined">event</span>Fiestas</a>
        <a href="admin.html" class="nav-item active"><span class="material-symbols-outlined">settings</span>Gestión</a>
    </nav>
</body>
</html>
