<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Festera</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #9c27b0; } /* Morado para Festeros */
        body.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-back { background: transparent; border: 1px solid var(--text); color: var(--text); padding: 8px 15px; border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        /* Grid para separar zonas */
        .grid-gestion { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 700px) { .grid-gestion { grid-template-columns: 1fr; } }

        .card { background: var(--card); padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--accent); border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button.action { width: 100%; background: var(--accent); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button.action:hover { opacity: 0.9; }

        /* Lista de códigos */
        .code-list { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
        .code-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .tag { padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
        .tag.free { background: #e8f5e9; color: green; }
        .tag.used { background: #ffebee; color: red; }

        .msg { margin-top: 10px; font-weight: bold; display: none; }
        .success { color: green; } .error { color: red; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import { getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // --- CONFIGURACIÓN ---
      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;

      // 1. SEGURIDAD: Solo Festeros y Admins
      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          
          const docSnap = await getDoc(doc(db, "usuarios", user.uid));
          if (!docSnap.exists()) return;
          
          const rol = docSnap.data().rol;
          if (rol !== 'festero' && rol !== 'admin') {
              alert("Zona restringida para organizadores.");
              window.location.href = "panel.html";
          }
          
          currentUser = user;
          aplicarTema();
          escucharCodigos(); // Cargar la lista en tiempo real
      });

      // 2. CREAR CÓDIGO DE INVITACIÓN
      window.generarCodigo = async () => {
          const codeInput = document.getElementById("new-code");
          const codigo = codeInput.value.trim().toUpperCase();
          const status = document.getElementById("status-code");

          if(codigo.length < 3) {
              mostrarMsg(status, "El código debe tener al menos 3 letras", "error");
              return;
          }

          try {
              // Guardamos en la colección 'invitaciones'
              await addDoc(collection(db, "invitaciones"), {
                  codigo: codigo,
                  rol: "usuario", // Por defecto crea usuarios normales
                  usado: false,
                  creado_por: currentUser.uid,
                  fecha_creacion: new Date()
              });

              mostrarMsg(status, `Código ${codigo} creado. ¡Compártelo!`, "success");
              codeInput.value = ""; // Limpiar

          } catch (e) {
              console.error(e);
              mostrarMsg(status, "Error al crear: " + e.message, "error");
          }
      }

      // 3. ESCUCHAR CAMBIOS EN LA LISTA DE CÓDIGOS (Tiempo Real)
      function escucharCodigos() {
          const q = query(collection(db, "invitaciones"), orderBy("fecha_creacion", "desc"));
          
          onSnapshot(q, (snapshot) => {
              const lista = document.getElementById("lista-codigos");
              lista.innerHTML = "";
              
              if(snapshot.empty) {
                  lista.innerHTML = "<p>No hay códigos creados.</p>";
                  return;
              }

              snapshot.forEach((doc) => {
                  const d = doc.data();
                  const estadoClass = d.usado ? "used" : "free";
                  const estadoTexto = d.usado ? `Usado por: ${d.usado_por || '?'}` : "DISPONIBLE";
                  
                  const item = `
                    <li class="code-item">
                        <div>
                            <strong>${d.codigo}</strong>
                            <div style="font-size:12px; color: gray;">Rol: ${d.rol}</div>
                        </div>
                        <span class="tag ${estadoClass}">${estadoTexto}</span>
                    </li>
                  `;
                  lista.innerHTML += item;
              });
          });
      }

      function mostrarMsg(el, txt, tipo) {
          el.innerText = txt;
          el.className = "msg " + tipo;
          el.style.display = "block";
          setTimeout(() => el.style.display = 'none', 5000);
      }

      function aplicarTema() {
        if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
      }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Gestión Festera</h1>
            <button class="btn-back" onclick="window.location.href='panel.html'">
                <span class="material-symbols-outlined">arrow_back</span> Volver
            </button>
        </div>

        <div class="grid-gestion">
            
            <div class="card">
                <h2>🎫 Generar Invitaciones</h2>
                <p>Crea códigos para que los vecinos se registren.</p>
                
                <input type="text" id="new-code" placeholder="Escribe un código (ej: VECINO24)">
                <button class="action" onclick="generarCodigo()">Crear Código</button>
                <p id="status-code" class="msg"></p>

                <h3 style="margin-top:20px; font-size: 16px;">Historial de Códigos</h3>
                <ul id="lista-codigos" class="code-list">
                    <li>Cargando...</li>
                </ul>
            </div>

            <div class="card" style="opacity: 0.7;">
                <h2>📅 Crear Actividad</h2>
                <p>Próximamente aquí podrás crear torneos, paellas y eventos.</p>
                <button class="action" style="background: gray; cursor: not-allowed;">En construcción</button>
            </div>

        </div>
    </div>
</body>
</html>
