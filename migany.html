<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mig Any · Fiesta Vaquera 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#c8860a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤠</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

    <style>
        /* ── RESET ──────────────────────────────────────────────────── */
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

        /* ── FONDO FULL SCREEN ──────────────────────────────────────── */
        body {
            font-family:'Bricolage Grotesque',sans-serif;
            min-height:100vh; overflow-x:hidden;
            background:#0d0700;
            display:flex; flex-direction:column; align-items:center;

            /* Cielo estrellado generado en CSS */
            background-image:
                radial-gradient(1px 1px at 15%  8%, rgba(255,248,200,.9), transparent),
                radial-gradient(1px 1px at 42% 12%, rgba(255,248,200,.7), transparent),
                radial-gradient(1px 1px at 70%  5%, rgba(255,248,200,.8), transparent),
                radial-gradient(1px 1px at 85% 18%, rgba(255,248,200,.6), transparent),
                radial-gradient(1px 1px at 25% 22%, rgba(255,248,200,.5), transparent),
                radial-gradient(1px 1px at 58% 28%, rgba(255,248,200,.7), transparent),
                radial-gradient(1px 1px at  8% 35%, rgba(255,248,200,.4), transparent),
                radial-gradient(1px 1px at 90% 32%, rgba(255,248,200,.6), transparent),
                radial-gradient(1px 1px at 33% 42%, rgba(255,248,200,.5), transparent),
                radial-gradient(1px 1px at 76% 45%, rgba(255,248,200,.8), transparent),
                radial-gradient(2px 2px at 50% 10%, rgba(255,248,200,.6), transparent),
                radial-gradient(2px 2px at 20% 15%, rgba(255,248,200,.4), transparent),
                /* Resplandor horizonte */
                radial-gradient(ellipse 100% 30% at 50% 100%, #3d1a00 0%, transparent 70%),
                radial-gradient(ellipse 70%  20% at 50% 100%, #6b2f00 0%, transparent 60%),
                /* Cielo nocturno */
                linear-gradient(180deg, #0d0700 0%, #1a0e00 40%, #2d1500 70%, #0d0700 100%);
        }

        /* Luna */
        body::before {
            content:'';
            position:fixed; top:40px; right:15%;
            width:50px; height:50px; border-radius:50%;
            background:radial-gradient(circle at 35% 35%, #fff8d6, #f0d060);
            box-shadow:0 0 30px 10px rgba(240,200,60,.25), 0 0 60px 20px rgba(240,180,30,.1);
            animation:moonFloat 8s ease-in-out infinite;
        }
        @keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

        /* Polvo animado en el suelo */
        body::after {
            content:'';
            position:fixed; bottom:0; left:0; right:0; height:80px;
            background:linear-gradient(0deg, rgba(100,50,10,.4) 0%, transparent 100%);
            pointer-events:none;
        }

        /* ── BOTÓN VOLVER ───────────────────────────────────────────── */
        .btn-back {
            position:fixed; top:18px; left:18px; z-index:200;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
            backdrop-filter:blur(8px);
            width:42px; height:42px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; color:#fef3c7;
            transition:transform .15s, background .2s;
        }
        .btn-back:active{transform:scale(.9);}
        .btn-back:hover{background:rgba(255,255,255,.15);}

        /* ── CARTEL PRINCIPAL ───────────────────────────────────────── */
        .poster {
            position:relative; z-index:10;
            width:100%; max-width:420px;
            margin:70px 18px 40px;
            animation:posterDrop .8s cubic-bezier(.34,1.56,.64,1) .1s backwards;
        }
        @keyframes posterDrop{
            from{opacity:0; transform:translateY(-40px) rotate(-1deg)}
            to  {opacity:1; transform:translateY(0)    rotate(0)}
        }

        /* Marco exterior del cartel */
        .poster-frame {
            border-radius:16px; overflow:hidden;
            box-shadow:
                0 0 0 3px #8a5c00,
                0 0 0 6px #2a1a00,
                0 0 0 9px #c8860a,
                0 30px 80px rgba(0,0,0,.8),
                0  0 60px rgba(200,134,10,.15);
        }

        /* Textura madera */
        .poster-wood {
            background:
                repeating-linear-gradient(
                    92deg,
                    transparent 0px, transparent 3px,
                    rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px
                ),
                linear-gradient(175deg, #4a2008 0%, #2e1204 30%, #3d1a06 60%, #2a1002 100%);
        }

        /* ── CABECERA DORADA ────────────────────────────────────────── */
        .poster-header {
            background:linear-gradient(160deg, #b8740a 0%, #f0b822 30%, #ffd84a 50%, #f0b822 70%, #b8740a 100%);
            padding:24px 20px 20px; text-align:center; position:relative;
            border-bottom:4px solid #7a4a00;
        }
        /* Marco interior */
        .poster-header::before {
            content:'';
            position:absolute; inset:6px;
            border:1.5px solid rgba(255,255,255,.3);
            border-radius:6px; pointer-events:none;
        }
        /* Brillo animado */
        .poster-header::after {
            content:'';
            position:absolute; inset:0;
            background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.18) 50%, transparent 60%);
            animation:headerShine 4s ease-in-out infinite;
        }
        @keyframes headerShine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(200%)}}

        .header-top {
            font-size:.62rem; font-weight:800; letter-spacing:5px;
            text-transform:uppercase; color:#5c3500; opacity:.8;
            margin-bottom:8px; position:relative; z-index:1;
        }

        .poster-title {
            font-family:'Rye',serif;
            font-size:clamp(3.8rem,18vw,6rem);
            line-height:.88; color:#2a1200;
            text-shadow:
                2px 3px 0 rgba(255,255,255,.25),
                0  4px 12px rgba(0,0,0,.3);
            letter-spacing:3px; position:relative; z-index:1;
            animation:titlePulse 4s ease-in-out infinite;
        }
        @keyframes titlePulse{0%,100%{text-shadow:2px 3px 0 rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.3)}50%{text-shadow:2px 3px 0 rgba(255,255,255,.35),0 4px 20px rgba(0,0,0,.4),0 0 30px rgba(200,134,10,.2)}}

        .poster-sub {
            font-size:.72rem; font-weight:800; letter-spacing:7px;
            text-transform:uppercase; color:#5c3500;
            margin-top:10px; display:flex; align-items:center;
            justify-content:center; gap:8px; position:relative; z-index:1;
        }
        .poster-sub .star{font-size:.55rem; opacity:.6;}

        /* Precio rotado */
        .price-badge {
            position:absolute; top:-8px; right:14px; z-index:5;
            background:radial-gradient(circle at 40% 40%, #e84040, #9b1c1c);
            color:white; font-family:'Rye',serif;
            font-size:1.4rem; line-height:1;
            width:60px; height:60px; border-radius:50%;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            transform:rotate(14deg);
            box-shadow:0 4px 16px rgba(0,0,0,.5), 0 0 0 2px white, 0 0 0 4px #9b1c1c;
            animation:badgeWiggle 3s ease-in-out infinite 1s;
        }
        @keyframes badgeWiggle{0%,100%{transform:rotate(14deg)}50%{transform:rotate(18deg) scale(1.05)}}
        .price-badge small{font-size:.48rem; font-family:'Bricolage Grotesque',sans-serif; letter-spacing:1px; opacity:.8;}

        /* ── CONTENIDO ──────────────────────────────────────────────── */
        .poster-content{padding:24px 22px 26px;}

        .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}

        .info-block {
            background:rgba(0,0,0,.35); border:1px solid rgba(200,134,10,.2);
            border-radius:12px; padding:14px 12px; text-align:center;
            animation:blockIn .5s ease backwards;
        }
        .info-block:nth-child(1){animation-delay:.3s}
        .info-block:nth-child(2){animation-delay:.4s}
        @keyframes blockIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

        .info-lbl {
            font-size:.58rem; font-weight:800; text-transform:uppercase;
            letter-spacing:2px; color:rgba(240,180,50,.55); margin-bottom:6px; display:block;
        }
        .info-val {
            font-family:'Rye',serif; font-size:1.05rem; color:#fef3c7;
            line-height:1.25; text-shadow:0 2px 6px rgba(0,0,0,.5);
        }

        /* Caja incluye */
        .includes-box {
            background:rgba(200,134,10,.12);
            border:1px solid rgba(200,134,10,.35);
            border-radius:12px; padding:13px 16px;
            display:flex; align-items:center; gap:12px;
            color:#fef3c7; margin-bottom:16px;
            animation:blockIn .5s ease .5s backwards;
        }
        .includes-box .material-symbols-outlined{color:#f59e0b; font-size:22px; flex-shrink:0;}
        .includes-box span{font-size:.88rem; line-height:1.4;}
        .includes-box strong{color:#f59e0b;}

        /* Botón mapa */
        .btn-map {
            display:flex; align-items:center; justify-content:center; gap:10px;
            background:#1a73e8; color:white; text-decoration:none;
            padding:14px 20px; border-radius:50px;
            font-weight:800; font-size:.9rem;
            box-shadow:0 4px 0 #1251a3, 0 10px 24px rgba(26,115,232,.4);
            transition:transform .1s, box-shadow .1s;
            animation:blockIn .5s ease .6s backwards;
        }
        .btn-map:active{transform:translateY(4px); box-shadow:none;}

        /* Divisor decorativo */
        .divider {
            display:flex; align-items:center; gap:8px;
            margin:20px 0 0; opacity:.3;
        }
        .divider::before,.divider::after{content:''; flex:1; height:1px; background:#f59e0b;}
        .divider span{font-size:.55rem; letter-spacing:4px; color:#f59e0b;}

        /* Nota */
        .poster-note {
            text-align:center; margin-top:14px;
            font-size:.75rem; color:rgba(255,248,200,.3);
            font-style:italic; line-height:1.6;
        }

        /* ── ESTRELLAS FLOTANTES ────────────────────────────────────── */
        .star-field{
            position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
        }
        .sf {
            position:absolute; width:2px; height:2px; border-radius:50%;
            background:rgba(255,248,200,.7);
            animation:twinkle linear infinite;
        }
        @keyframes twinkle{
            0%,100%{opacity:.1; transform:scale(1)}
            50%{opacity:.9; transform:scale(1.5)}
        }

        /* ── PARTÍCULAS POLVO ───────────────────────────────────────── */
        .dust {
            position:fixed; bottom:0; pointer-events:none; z-index:1;
            width:6px; height:6px; border-radius:50%;
            background:rgba(160,100,30,.4);
            animation:dustFloat linear infinite;
        }
        @keyframes dustFloat{
            0%  {transform:translateY(0)   translateX(0)   scale(1);   opacity:.4;}
            100%{transform:translateY(-60px) translateX(var(--dx,10px)) scale(0); opacity:0;}
        }
    </style>
</head>
<body>

    <!-- Estrellas -->
    <div class="star-field" id="stars"></div>

    <button class="btn-back" onclick="window.history.back()" aria-label="Volver">
        <span class="material-symbols-outlined" style="font-size:20px">arrow_back</span>
    </button>

    <!-- CARTEL -->
    <div class="poster">
        <div class="poster-frame">
            <div class="poster-wood">

                <!-- CABECERA -->
                <div class="poster-header">
                    <div class="price-badge">5€<small>PRECIO</small></div>
                    <div class="header-top">Fiestas Pantano · 2026</div>
                    <div class="poster-title">MIG<br>ANY</div>
                    <div class="poster-sub">
                        <span class="star">✦</span>
                        Fiesta Vaquera
                        <span class="star">✦</span>
                    </div>
                </div>

                <!-- CONTENIDO -->
                <div class="poster-content">

                    <div class="info-grid">
                        <div class="info-block">
                            <span class="info-lbl">Cuándo</span>
                            <div class="info-val">Jueves<br>Santo<br>2 Abril</div>
                        </div>
                        <div class="info-block">
                            <span class="info-lbl">Dónde</span>
                            <div class="info-val">El<br>Rancho</div>
                        </div>
                    </div>

                    <div class="includes-box">
                        <span class="material-symbols-outlined">restaurant</span>
                        <span>¡Incluye <strong>Cena</strong> y Fiesta!</span>
                    </div>

                    <!-- Mismo href del original -->
                    <a href="https://maps.app.goo.gl/QXwAQdLukhfXUzBo7"
                       target="_blank" rel="noopener noreferrer"
                       class="btn-map">
                        <span class="material-symbols-outlined">map</span>
                        Ver en el mapa
                    </a>

                    <div class="divider"><span>✦ ✦ ✦</span></div>

                    <p class="poster-note">
                        * Trae tu mejor sombrero y botas.<br>Será legendario.
                    </p>

                </div>
            </div>
        </div>
    </div>

    <script>
        /* Estrellas parpadeantes */
        const sf = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'sf';
            s.style.cssText = `
                left:${Math.random()*100}%;
                top:${Math.random()*65}%;
                animation-duration:${1.5 + Math.random()*3}s;
                animation-delay:${Math.random()*4}s;
                opacity:${0.2 + Math.random()*.5};
                width:${Math.random()>0.85 ? 3 : 2}px;
                height:${Math.random()>0.85 ? 3 : 2}px;
            `;
            sf.appendChild(s);
        }

        /* Partículas de polvo en el suelo */
        for (let i = 0; i < 12; i++) {
            const d = document.createElement('div');
            d.className = 'dust';
            d.style.cssText = `
                left:${Math.random()*100}%;
                width:${4 + Math.random()*5}px;
                height:${4 + Math.random()*5}px;
                animation-duration:${3 + Math.random()*5}s;
                animation-delay:${Math.random()*6}s;
                --dx:${(Math.random()-0.5)*30}px;
            `;
            document.body.appendChild(d);
        }
    </script>
</body>
</html>
