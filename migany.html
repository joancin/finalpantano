<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mig Any Vaquero</title>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body { background: #3e2723; color: #fff8e1; font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; text-align: center; background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png'); }
        
        .poster { border: 4px solid #fff8e1; padding: 20px; max-width: 400px; margin: 20px auto; border-radius: 10px; background: rgba(0,0,0,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h1 { font-family: 'Rye', serif; font-size: 3rem; color: #ffca28; text-shadow: 3px 3px 0px #3e2723; margin-bottom: 5px; margin-top: 10px; }
        h2 { font-family: 'Rye', serif; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #ffca28; display: inline-block; padding-bottom: 10px; margin-bottom: 30px; }
        
        .details { font-size: 1.2rem; margin: 30px 0; line-height: 1.8; }
        .details strong { color: #ffca28; display: block; font-size: 1.4rem; }
        
        .price-tag { background: #d32f2f; color: white; padding: 10px 30px; font-family: 'Rye', serif; font-size: 2rem; border-radius: 5px; transform: rotate(-5deg); display: inline-block; margin: 20px 0; box-shadow: 3px 3px 10px rgba(0,0,0,0.5); border: 2px dashed white; }
        
        .btn-back { position: fixed; top: 15px; left: 15px; background: #ffca28; border: none; border-radius: 5px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #3e2723; box-shadow: 2px 2px 0 #3e2723; }
        
        .wanted-img { width: 100px; opacity: 0.8; margin-top: 20px; filter: sepia(100%); }
    </style>
</head>
<body>

    <button class="btn-back" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

    <div class="poster">
        <h1>MIG ANY</h1>
        <h2>Fiesta Vaquera</h2>
        
        <p>¡Se busca a todos los festeros y vecinos!</p>
        
        <div class="details">
            📅 Jueves Santo<br>
            <strong>2 DE ABRIL</strong>
            <br>
            📍 Lugar<br>
            <strong>EL RANCHO</strong>
        </div>

        <div class="price-tag">5€</div>
        
        <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 30px;">
            Incluye entrada, ambientazo y sorpresas.<br>
            ¡Trae tu sombrero! 🤠
        </p>

        <span class="material-symbols-outlined wanted-img" style="font-size: 80px;">bedroom_parent</span>
    </div>

</body>
</html>
