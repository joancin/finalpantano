<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mig Any · Fiesta Vaquera 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤠</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/>

    <style>
        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

        /* ── FONDO CINEMATOGRÁFICO ──────────────────────────────────── */
        html, body { height:100%; width:100%; overflow:hidden; }
        body {
            font-family:'Bricolage Grotesque',sans-serif;
            background:#000;
            display:flex; align-items:center; justify-content:center;
            position:relative;
        }

        /* Capa 1: color de fondo con degradado dramático */
        .bg-layer {
            position:fixed; inset:0; z-index:0;
            background:
                radial-gradient(ellipse 140% 60% at 50% 110%,
                    #7a3800 0%, #3d1a00 30%, #0a0400 65%),
                radial-gradient(ellipse 80% 40% at 80% 20%,
                    rgba(200,130,10,.12) 0%, transparent 60%),
                #050200;
        }

        /* Capa 2: líneas horizontales tipo película */
        .scanlines {
            position:fixed; inset:0; z-index:1; pointer-events:none;
            background:repeating-linear-gradient(
                0deg,
                transparent 0px, transparent 3px,
                rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px
            );
        }

        /* Capa 3: viñeta */
        .vignette {
            position:fixed; inset:0; z-index:2; pointer-events:none;
            background:radial-gradient(ellipse 90% 90% at 50% 50%,
                transparent 40%, rgba(0,0,0,.75) 100%);
        }

        /* Capa 4: polvo ambiental (partículas JS) */
        #particles { position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }

        /* ── BOTÓN VOLVER ───────────────────────────────────────────── */
        .btn-back {
            position:fixed; top:20px; left:20px; z-index:100;
            background:rgba(255,255,255,.06);
            border:1px solid rgba(255,255,255,.12);
            backdrop-filter:blur(8px);
            width:44px; height:44px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; color:rgba(255,240,180,.8);
            transition:background .2s, transform .15s;
            text-decoration:none;
        }
        .btn-back:hover  { background:rgba(255,255,255,.14); }
        .btn-back:active { transform:scale(.9); }

        /* ── ESCENA PRINCIPAL ───────────────────────────────────────── */
        .scene {
            position:relative; z-index:10;
            width:100%; max-width:480px;
            padding:24px 20px;
            display:flex; flex-direction:column;
            align-items:center;
            animation:sceneIn 1.2s cubic-bezier(.22,1,.36,1) backwards;
        }
        @keyframes sceneIn {
            from { opacity:0; transform:translateY(30px) scale(.97); }
            to   { opacity:1; transform:none; }
        }

        /* ── SOMBRERO SVG animado ───────────────────────────────────── */
        .hat-wrap {
            width:120px; height:80px; margin-bottom:8px;
            animation:hatFloat 4s ease-in-out infinite;
            filter:drop-shadow(0 20px 40px rgba(200,130,10,.35));
        }
        @keyframes hatFloat {
            0%,100% { transform:translateY(0) rotate(-1deg); }
            50%      { transform:translateY(-10px) rotate(1deg); }
        }
        .hat-wrap svg { width:100%; height:100%; }

        /* ── TÍTULO ─────────────────────────────────────────────────── */
        .event-label {
            font-size:.62rem; font-weight:800; letter-spacing:6px;
            text-transform:uppercase; color:rgba(200,160,60,.6);
            margin-bottom:10px;
            animation:fadeUp .6s ease .3s backwards;
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

        .main-title {
            font-family:'Rye', serif;
            font-size:clamp(4.5rem,22vw,7.5rem);
            line-height:.88; text-align:center;
            color:#ffe08a;
            text-shadow:
                0 0 60px rgba(200,140,10,.5),
                0 0 120px rgba(200,100,0,.25),
                3px 5px 0 rgba(0,0,0,.5);
            letter-spacing:4px;
            animation:titleReveal 1s ease .2s backwards;
        }
        @keyframes titleReveal {
            from { opacity:0; letter-spacing:12px; filter:blur(4px); }
            to   { opacity:1; letter-spacing:4px;  filter:blur(0); }
        }

        .sub-title {
            font-size:.78rem; font-weight:800; letter-spacing:8px;
            text-transform:uppercase; color:rgba(255,200,80,.55);
            margin-top:10px; display:flex; align-items:center; gap:10px;
            animation:fadeUp .6s ease .5s backwards;
        }
        .sub-line { width:30px; height:1px; background:rgba(255,200,80,.3); }

        /* ── SEPARADOR ──────────────────────────────────────────────── */
        .divider {
            width:100%; margin:28px 0 24px;
            display:flex; align-items:center; gap:12px;
            animation:fadeUp .6s ease .6s backwards;
        }
        .divider-line { flex:1; height:1px; background:rgba(200,140,10,.2); }
        .divider-ico  { color:rgba(200,140,10,.45); font-size:1rem; }

        /* ── BLOQUES DE INFO ────────────────────────────────────────── */
        .info-grid {
            display:grid; grid-template-columns:1fr 1fr;
            gap:12px; width:100%; margin-bottom:16px;
            animation:fadeUp .6s ease .7s backwards;
        }

        .info-block {
            background:rgba(255,255,255,.04);
            border:1px solid rgba(200,140,10,.18);
            border-radius:16px; padding:18px 14px;
            text-align:center; position:relative; overflow:hidden;
            transition:background .2s, border-color .2s;
        }
        .info-block::before {
            content:'';
            position:absolute; inset:0;
            background:linear-gradient(135deg,
                rgba(200,140,10,.06) 0%, transparent 60%);
        }
        .info-block:hover {
            background:rgba(255,255,255,.07);
            border-color:rgba(200,140,10,.35);
        }
        .info-ico {
            font-size:1.6rem; display:block; margin-bottom:8px;
        }
        .info-lbl {
            display:block; font-size:.58rem; font-weight:800;
            text-transform:uppercase; letter-spacing:2.5px;
            color:rgba(200,160,60,.5); margin-bottom:5px;
        }
        .info-val {
            font-family:'Rye', serif;
            font-size:clamp(.9rem,3.5vw,1.1rem);
            color:#fef3c7; line-height:1.3;
            text-shadow:0 2px 8px rgba(0,0,0,.6);
        }

        /* ── CAJA INCLUYE ───────────────────────────────────────────── */
        .includes-row {
            width:100%; display:flex; align-items:center; gap:14px;
            background:rgba(200,140,10,.08);
            border:1px solid rgba(200,140,10,.22);
            border-radius:16px; padding:16px 18px;
            color:#fef3c7; margin-bottom:16px;
            animation:fadeUp .6s ease .8s backwards;
        }
        .inc-ico {
            width:44px; height:44px; border-radius:12px; flex-shrink:0;
            background:rgba(200,140,10,.18);
            display:flex; align-items:center; justify-content:center;
            font-size:1.3rem;
        }
        .inc-txt strong { display:block; font-size:.95rem; font-weight:800; color:#ffd860; }
        .inc-txt span   { font-size:.78rem; color:rgba(255,240,200,.55); margin-top:2px; display:block; }

        /* ── PRECIO BADGE ───────────────────────────────────────────── */
        .price-row {
            display:flex; align-items:center; gap:12px;
            margin-bottom:20px; width:100%;
            animation:fadeUp .6s ease .85s backwards;
        }
        .price-badge {
            background:linear-gradient(135deg, #dc2626, #b91c1c);
            color:white; border-radius:50px;
            padding:10px 20px; font-family:'Rye',serif;
            font-size:1.2rem;
            box-shadow:0 4px 16px rgba(185,28,28,.4),
                       0 0 0 1px rgba(255,255,255,.1) inset;
            animation:pricePop 3s ease-in-out infinite 1s;
        }
        @keyframes pricePop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
        .price-line { flex:1; height:1px; background:rgba(200,140,10,.15); }

        /* ── BOTÓN MAPA ─────────────────────────────────────────────── */
        .btn-map {
            width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
            background:linear-gradient(135deg, #1d4ed8, #1e40af);
            color:white; text-decoration:none; padding:16px 24px;
            border-radius:50px; font-weight:800; font-size:.95rem;
            box-shadow:0 6px 0 #1e3a8a, 0 14px 32px rgba(30,64,175,.45);
            transition:transform .12s, box-shadow .12s;
            animation:fadeUp .6s ease .9s backwards;
            letter-spacing:.3px;
        }
        .btn-map:active { transform:translateY(6px); box-shadow:0 1px 0 #1e3a8a; }

        /* ── NOTA ───────────────────────────────────────────────────── */
        .note {
            margin-top:18px; text-align:center;
            font-size:.72rem; color:rgba(255,240,180,.22);
            font-style:italic; line-height:1.7;
            animation:fadeUp .6s ease 1s backwards;
        }

        /* ── ESTRELLAS ──────────────────────────────────────────────── */
        .star-el {
            position:absolute; border-radius:50%;
            background:rgba(255,248,200,.85);
            animation:twinkle linear infinite;
            pointer-events:none;
        }
        @keyframes twinkle {
            0%,100% { opacity:.1; transform:scale(1); }
            50%      { opacity:1;  transform:scale(1.5); }
        }

        /* ── PARTÍCULAS POLVO ───────────────────────────────────────── */
        .dust-el {
            position:absolute; border-radius:50%;
            background:rgba(160,90,20,.3);
            animation:dustRise linear infinite;
            pointer-events:none;
        }
        @keyframes dustRise {
            0%   { transform:translateY(0) translateX(0) scale(1); opacity:.3; }
            100% { transform:translateY(-100px) translateX(var(--dx,0px)) scale(0); opacity:0; }
        }

        /* Overflow scroll si el contenido es largo en pantallas pequeñas */
        @media (max-height: 700px) {
            html, body { overflow:auto; }
            .scene { padding:80px 20px 40px; }
        }
    </style>
</head>
<body>

    <!-- Capas de fondo -->
    <div class="bg-layer"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div id="particles"></div>

    <!-- Botón volver -->
    <a href="index.html" class="btn-back" aria-label="Volver">
        <span class="material-symbols-outlined" style="font-size:20px">arrow_back</span>
    </a>

    <!-- ESCENA -->
    <div class="scene">

        <!-- Sombrero SVG animado -->
        <div class="hat-wrap" aria-hidden="true">
            <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
                <!-- Ala del sombrero -->
                <ellipse cx="100" cy="95" rx="95" ry="18"
                    fill="#2a1200" stroke="#c8860a" stroke-width="1.5"/>
                <!-- Cuerpo del sombrero -->
                <path d="M45 95 Q50 30 100 25 Q150 30 155 95 Z"
                    fill="#1a0a00" stroke="#c8860a" stroke-width="1.5"/>
                <!-- Banda dorada -->
                <path d="M50 82 Q100 78 150 82"
                    fill="none" stroke="#c8860a" stroke-width="4" opacity=".7"/>
                <!-- Brillo superior -->
                <path d="M70 40 Q100 30 130 40"
                    fill="none" stroke="rgba(255,220,100,.25)" stroke-width="2"/>
            </svg>
        </div>

        <!-- Etiqueta -->
        <div class="event-label">Fiestas Pantano · 2026</div>

        <!-- Título -->
        <h1 class="main-title">MIG<br>ANY</h1>

        <div class="sub-title">
            <span class="sub-line"></span>
            Fiesta Vaquera
            <span class="sub-line"></span>
        </div>

        <!-- Divisor -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-ico">✦</span>
            <div class="divider-line"></div>
        </div>

        <!-- Info -->
        <div class="info-grid">
            <div class="info-block">
                <span class="info-ico">📅</span>
                <span class="info-lbl">Cuándo</span>
                <div class="info-val">Jueves<br>Santo<br>2 Abril</div>
            </div>
            <div class="info-block">
                <span class="info-ico">📍</span>
                <span class="info-lbl">Dónde</span>
                <div class="info-val">El<br>Rancho</div>
            </div>
        </div>

        <!-- Incluye -->
        <div class="includes-row">
            <div class="inc-ico">🍽️</div>
            <div class="inc-txt">
                <strong>¡Incluye Cena y Fiesta!</strong>
                <span>Noche completa en El Rancho</span>
            </div>
        </div>

        <!-- Precio -->
        <div class="price-row">
            <div class="divider-line"></div>
            <div class="price-badge">5€</div>
            <div class="divider-line"></div>
        </div>

        <!-- Botón mapa — mismo href del original -->
        <a href="https://maps.app.goo.gl/QXwAQdLukhfXUzBo7"
           target="_blank" rel="noopener noreferrer"
           class="btn-map">
            <span class="material-symbols-outlined">map</span>
            Ver ubicación en el mapa
        </a>

        <p class="note">* Trae tu mejor sombrero y botas.<br>Será legendario.</p>

    </div>

    <script>
        const pc = document.getElementById('particles');

        /* Estrellas */
        for (let i = 0; i < 80; i++) {
            const s   = document.createElement('div');
            s.className = 'star-el';
            const sz  = Math.random() > .9 ? 3 : Math.random() > .6 ? 2 : 1;
            s.style.cssText = `
                left:${Math.random()*100}%;
                top:${Math.random()*100}%;
                width:${sz}px; height:${sz}px;
                animation-duration:${1 + Math.random()*4}s;
                animation-delay:${Math.random()*6}s;
            `;
            pc.appendChild(s);
        }

        /* Polvo desde abajo */
        for (let i = 0; i < 18; i++) {
            const d   = document.createElement('div');
            d.className = 'dust-el';
            const sz  = 2 + Math.random()*5;
            d.style.cssText = `
                left:${Math.random()*100}%;
                bottom:${Math.random()*15}%;
                width:${sz}px; height:${sz}px;
                animation-duration:${3 + Math.random()*6}s;
                animation-delay:${Math.random()*8}s;
                --dx:${(Math.random()-.5)*50}px;
            `;
            pc.appendChild(d);
        }

        /* Partículas de brasa/chispa flotantes */
        for (let i = 0; i < 12; i++) {
            const e   = document.createElement('div');
            e.style.cssText = `
                position:absolute;
                left:${20 + Math.random()*60}%;
                bottom:${5 + Math.random()*20}%;
                width:${1 + Math.random()*2}px;
                height:${1 + Math.random()*2}px;
                border-radius:50%;
                background:rgba(255,160,30,.7);
                animation:dustRise ${2+Math.random()*4}s linear ${Math.random()*5}s infinite;
                --dx:${(Math.random()-.5)*80}px;
                pointer-events:none;
            `;
            pc.appendChild(e);
        }
    </script>
</body>
</html>
