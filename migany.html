<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mig Any - Vaquero</title>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff5722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        body { 
            background: #212121; 
            color: #fff8e1; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle, #3e2723 10%, #212121 90%);
        }
        
        .poster-container {
            width: 100%;
            max-width: 400px;
            background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #4e342e;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #6d4c41;
            position: relative;
        }

        .poster-header {
            background: #ffb300;
            color: #3e2723;
            padding: 20px;
            text-align: center;
            border-bottom: 2px dashed #3e2723;
        }

        h1 { font-family: 'Rye', serif; font-size: 2.5rem; margin: 0; line-height: 1; }
        .subtitle { font-weight: bold; letter-spacing: 3px; font-size: 0.9rem; margin-top: 5px; text-transform: uppercase; }

        .content { padding: 30px 20px; text-align: center; }

        .info-block { margin-bottom: 25px; }
        .label { color: #ffb300; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 5px; opacity: 0.8; }
        .value { font-size: 1.5rem; font-weight: bold; font-family: 'Rye', serif; }

        .includes-box {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid #5d4037;
        }

        /* BOTONES */
        .btn-map {
            background: #1976d2; /* Azul Google Maps */
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 0 #0d47a1;
            transition: transform 0.1s;
        }
        .btn-map:active { transform: translateY(4px); box-shadow: none; }

        .price-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #d32f2f;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rye', serif;
            font-size: 1.5rem;
            transform: rotate(15deg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 2px solid white;
        }

        .btn-back { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.2); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: #3e2723; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="poster-container">
        <button class="btn-back" onclick="window.history.back()">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>

        <div class="price-badge">5€</div>

        <div class="poster-header">
            <h1>MIG ANY</h1>
            <div class="subtitle">Fiesta Vaquera</div>
        </div>

        <div class="content">
            
            <div class="info-block">
                <span class="label">Cuándo</span>
                <div class="value">Jueves Santo <br> 2 de Abril</div>
            </div>

            <div class="info-block">
                <span class="label">Dónde</span>
                <div class="value">El Rancho</div>
            </div>

            <div class="includes-box">
                <span class="material-symbols-outlined" style="color:#ffb300">restaurant</span>
                <span>¡Incluye <strong>Cena</strong> y Fiesta!</span>
            </div>

            <a href="https://maps.app.goo.gl/QXwAQdLukhfXUzBo7" target="_blank" class="btn-map">
                <span class="material-symbols-outlined">map</span>
                Ver Ubicación en Mapa
            </a>

            <p style="font-size: 0.8rem; margin-top: 20px; opacity: 0.6;">
                * Trae tu mejor sombrero y botas.<br>Será legendario.
            </p>
        </div>
    </div>
</body>
</html>
