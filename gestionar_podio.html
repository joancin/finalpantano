<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Podio</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff9800; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; background: var(--bg); color: var(--text); font-size: 1rem; }
        h1 { margin-top: 0; text-align: center; }
        .btn-save { width: 100%; background: var(--accent); color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const params = new URLSearchParams(window.location.search);
        const actId = params.get("id");

        onAuthStateChanged(auth, async (user) => {
            if(!user) window.location.href="index.html";
            cargarDatos();
        });

        async function cargarDatos() {
            const docRef = doc(db, "actividades", actId);
            const snap = await getDoc(docRef);
            if(!snap.exists()) return alert("Error");
            
            const data = snap.data();
            document.getElementById("titulo").innerText = "Podio: " + data.titulo;
            
            const inscritos = data.inscritos || [];
            let options = '<option value="">-- Seleccionar --</option>';
            inscritos.forEach(i => {
                options += `<option value="${i.nombre_equipo}">${i.nombre_equipo}</option>`;
            });

            // Rellenar selects
            ['oro', 'plata', 'bronce'].forEach(tipo => {
                document.getElementById(tipo).innerHTML = options;
                // Si ya hay ganadores guardados, seleccionarlos
                if(data.ganadores && data.ganadores[tipo]) {
                    document.getElementById(tipo).value = data.ganadores[tipo];
                }
            });
        }

        window.guardarPodio = async () => {
            const ganadores = {
                oro: document.getElementById("oro").value,
                plata: document.getElementById("plata").value,
                bronce: document.getElementById("bronce").value
            };
            try {
                await updateDoc(doc(db, "actividades", actId), { ganadores: ganadores });
                alert("✅ Ganadores guardados");
                window.location.href = "gestion.html";
            } catch(e) { alert(e.message); }
        }
    </script>
</head>
<body>
    <div class="container">
        <button onclick="window.history.back()" style="background:transparent; border:none; color:var(--text); font-size:1.2rem; cursor:pointer;">← Volver</button>
        <div class="card">
            <h1 id="titulo">Cargando...</h1>
            <p style="text-align:center; color:gray; margin-bottom:20px;">Elige a los ganadores de la lista de inscritos.</p>

            <label>🥇 PRIMER PUESTO (ORO)</label>
            <select id="oro"></select>

            <label>🥈 SEGUNDO PUESTO (PLATA)</label>
            <select id="plata"></select>

            <label>🥉 TERCER PUESTO (BRONCE)</label>
            <select id="bronce"></select>

            <button class="btn-save" onclick="guardarPodio()">Guardar Resultados</button>
        </div>
    </div>
</body>
</html>
