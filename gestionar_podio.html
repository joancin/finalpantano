<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Podio</title>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff5722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff9800; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-top: 0; }
        
        select { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #ccc; background: var(--bg); color: var(--text); font-size: 1rem; }
        .btn-save { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        enableIndexedDbPersistence(db).catch(console.log);

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const actId = params.get("id");

        onAuthStateChanged(auth, async (user) => {
            if(!user || !actId) window.location.href="index.html";
            cargarDatos();
        });

        async function cargarDatos() {
            const snap = await getDoc(doc(db, "actividades", actId));
            if(!snap.exists()) return;
            const data = snap.data();
            
            document.getElementById("titulo").innerText = data.titulo;
            const inscritos = data.inscritos || [];
            
            // FIX UNDEFINED
            const options = inscritos.map(i => `<option value="${i.nombre_equipo || i.capitan || 'Anónimo'}">${i.nombre_equipo || i.capitan || 'Anónimo'}</option>`).join("");
            const defaultOpt = '<option value="">-- Desierto --</option>';

            ["oro", "plata", "bronce"].forEach(m => {
                document.getElementById(m).innerHTML = defaultOpt + options;
                if(data.ganadores && data.ganadores[m]) document.getElementById(m).value = data.ganadores[m];
            });
        }

        window.guardar = async () => {
            const ganadores = {
                oro: document.getElementById("oro").value,
                plata: document.getElementById("plata").value,
                bronce: document.getElementById("bronce").value
            };
            try {
                await updateDoc(doc(db, "actividades", actId), { ganadores });
                alert("✅ Guardado");
                window.history.back();
            } catch(e) { alert(e.message); }
        }
    </script>
</head>
<body>
    <div class="container">
        <button onclick="window.history.back()" style="border:none; background:none; cursor:pointer; margin-bottom:10px;">⬅ Volver</button>
        <div class="card">
            <h1 id="titulo">...</h1>
            
            <label>🥇 Ganador (ORO)</label>
            <select id="oro"></select>
            
            <label>🥈 Segundo (PLATA)</label>
            <select id="plata"></select>
            
            <label>🥉 Tercero (BRONCE)</label>
            <select id="bronce"></select>
            
            <button class="btn-save" onclick="guardar()">GUARDAR RESULTADOS</button>
        </div>
    </div>
</body>
</html>
