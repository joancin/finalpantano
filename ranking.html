<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Estrellas</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f4f7f6; --text: #333; --card: white; --gold: #ffc107; --silver: #e0e0e0; --bronze: #cd7f32; }
        html.dark-mode { --bg: #121212; --text: #e0e0e0; --card: #1e1e1e; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; }

        .rank-item {
            background: var(--card); padding: 15px; margin-bottom: 10px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .rank-pos { font-weight: 800; font-size: 1.2rem; width: 30px; text-align: center; }
        .rank-1 { color: var(--gold); font-size: 1.5rem; }
        .rank-2 { color: var(--silver); }
        .rank-3 { color: var(--bronze); }
        
        .user-info { flex-grow: 1; margin-left: 15px; font-weight: 600; }
        .stars { font-weight: 800; color: #ff9800; display: flex; align-items: center; gap: 5px; }

        .btn-back-float { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: var(--bg); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; border: none; z-index: 100; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // TU CONFIG
        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarRanking() {
            const list = document.getElementById("list");
            list.innerHTML = "<p style='text-align:center'>Cargando cracks...</p>";

            // CONSULTA EFICIENTE: Solo los 10 primeros ordenados por estrellas
            const q = query(collection(db, "usuarios"), orderBy("estrellas", "desc"), limit(10));
            
            try {
                const querySnapshot = await getDocs(q);
                list.innerHTML = "";
                let pos = 1;

                querySnapshot.forEach((doc) => {
                    const u = doc.data();
                    const estrellas = u.estrellas || 0;
                    let rankClass = "";
                    if(pos === 1) rankClass = "rank-1";
                    else if(pos === 2) rankClass = "rank-2";
                    else if(pos === 3) rankClass = "rank-3";

                    list.innerHTML += `
                        <div class="rank-item">
                            <div class="rank-pos ${rankClass}">${pos}</div>
                            <div class="user-info">${u.nombre || "Anónimo"}</div>
                            <div class="stars">${estrellas} <span class="material-symbols-outlined">star</span></div>
                        </div>
                    `;
                    pos++;
                });

                if(querySnapshot.empty) list.innerHTML = "<p>Nadie tiene estrellas aún :(</p>";
            } catch (error) {
                console.error(error);
                // Si sale este error es porque falta el Índice en Firebase
                if(error.message.includes("index")) {
                    alert("⚠️ FALTA ÍNDICE: Abre la consola (F12) y haz clic en el enlace que te da Firebase para crear el índice de 'estrellas'.");
                }
            }
        }
        cargarRanking();
    </script>
</head>
<body>
    <div class="container">
        <h1>Ranking de Leyendas 👑</h1>
        <div id="list"></div>
    </div>
    <button class="btn-back-float" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
</body>
</html>
