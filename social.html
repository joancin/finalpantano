<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociales</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; }
        html.dark-mode { --bg: #121212; --text: #e0e0e0; --card: #1e1e1e; }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; text-align: center; }

        /* CABECERA */
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 15px; background: #ddd; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
        p { color: gray; margin-top: 5px; margin-bottom: 30px; font-size: 0.9rem; }

        /* BOTONES REDES */
        .social-link {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card); color: var(--text);
            padding: 15px 20px; border-radius: 50px;
            margin-bottom: 15px; text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
            font-weight: 600;
        }
        .social-link:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        .s-icon { font-size: 24px; width: 30px; text-align: center; }
        
        /* COLORES OFICIALES */
        .insta { color: #E1306C; }
        .tiktok { color: #000000; } 
        html.dark-mode .tiktok { color: white; }
        .facebook { color: #1877F2; }
        .whatsapp { color: #25D366; }

        .btn-back-float { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); cursor: pointer; text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.postimg.cc/05WLqk1s/r.jpg" class="profile-pic" alt="Logo">
        
        <h1>Síguenos</h1>
        <p>@festerospantano26</p>

        <a href="https://www.instagram.com/festerospantano26/" target="_blank" class="social-link">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fa-brands fa-instagram s-icon insta"></i>
                <span>Instagram</span>
            </div>
            <span class="material-symbols-outlined" style="opacity:0.5; font-size:18px;">arrow_outward</span>
        </a>

        <a href="https://www.tiktok.com/@festerospantano_26" target="_blank" class="social-link">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fa-brands fa-tiktok s-icon tiktok"></i>
                <span>TikTok</span>
            </div>
            <span class="material-symbols-outlined" style="opacity:0.5; font-size:18px;">arrow_outward</span>
        </a>

        <a href="https://www.facebook.com/p/Festeros-Pantano-100084741185613/" target="_blank" class="social-link">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fa-brands fa-facebook s-icon facebook"></i>
                <span>Facebook</span>
            </div>
            <span class="material-symbols-outlined" style="opacity:0.5; font-size:18px;">arrow_outward</span>
        </a>

        <a href="https://chat.whatsapp.com/IDNZW3ZDbyvB9WUa9F0MMW" target="_blank" class="social-link">
            <div style="display:flex; align-items:center; gap:15px;">
                <i class="fa-brands fa-whatsapp s-icon whatsapp"></i>
                <span>Grupo de WhatsApp</span>
            </div>
            <span class="material-symbols-outlined" style="opacity:0.5; font-size:18px;">arrow_outward</span>
        </a>

    </div>

    <a href="index.html" class="btn-back-float">
        <span class="material-symbols-outlined">close</span>
    </a>

</body>
</html>
