<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Sorteo</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #e91e63; --winner-bg: #c8e6c9; --winner-border: #4caf50; --winner-text: #2e7d32; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --winner-bg: #1b5e20; --winner-border: #43a047; --winner-text: #a5d6a7; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { margin-top: 0; text-align: center; }

        .match { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.03); padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        .team { padding: 10px 12px; background: var(--card); border: 2px solid #ddd; border-radius: 8px; cursor: pointer; flex: 1; text-align: center; font-weight: bold; transition: all 0.2s; user-select: none; }
        .team:hover { border-color: var(--accent); }
        .team.winner { background: var(--winner-bg); border-color: var(--winner-border); color: var(--winner-text); }
        .vs { padding: 0 10px; font-weight: 900; color: #999; }

        .btn-gen { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-reset { width: 100%; padding: 10px; background: transparent; color: #ff5252; border: 2px solid #ff5252; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; display: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // PERSISTENCIA (Opcional en admin, pero no hace daño)
        enableIndexedDbPersistence(db).catch(err => console.log(err));

        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const actId = params.get("id");
        let currentData = null;

        onAuthStateChanged(auth, async (user) => {
            if(!user || !actId) window.location.href="index.html";
            cargarTorneo();
        });

        async function cargarTorneo() {
            try {
                const snap = await getDoc(doc(db, "actividades", actId));
                if (!snap.exists()) return alert("Error carga");
                
                currentData = snap.data();
                document.getElementById("titulo").innerText = currentData.titulo;
                
                if(currentData.bracket && currentData.bracket.length > 0) {
                    renderBracket(currentData.bracket);
                    document.getElementById("btn-gen").style.display = "none";
                    document.getElementById("btn-reset").style.display = "block";
                } else {
                    document.getElementById("matches").innerHTML = `<p style="text-align:center">Sin sorteo. Inscritos: ${currentData.inscritos ? currentData.inscritos.length : 0}</p>`;
                    document.getElementById("btn-gen").style.display = "flex";
                }
            } catch(e) { console.error(e); }
        }

        window.generarSorteo = async () => {
            const inscritos = currentData.inscritos || [];
            if(inscritos.length < 2) return alert("Mínimo 2 equipos");
            if(!confirm(`¿Generar cruces para ${inscritos.length} equipos?`)) return;

            // FIX UNDEFINED: Usar nombre_equipo O capitan
            const teams = inscritos.map(i => i.nombre_equipo || i.capitan || "Participante").filter(n => n);
            
            // Barajar
            teams.sort(() => Math.random() - 0.5);

            const bracket = [];
            for(let i=0; i < teams.length; i += 2) {
                if(i + 1 < teams.length) {
                    bracket.push({ team1: teams[i], team2: teams[i+1], winner: null });
                } else {
                    bracket.push({ team1: teams[i], team2: "---", winner: teams[i], bye: true });
                }
            }

            try {
                await updateDoc(doc(db, "actividades", actId), { bracket: bracket });
                alert("✅ Sorteo listo");
                location.reload();
            } catch(e) { alert("Error: " + e.message); }
        }

        function renderBracket(bracket) {
            const div = document.getElementById("matches");
            div.innerHTML = "";
            bracket.forEach((match, idx) => {
                if(match.bye) {
                    div.innerHTML += `
                        <div class="match" style="background:#e8f5e9;">
                            <div class="team winner">${match.team1}</div>
                            <span class="vs">➜</span>
                            <div>PASA</div>
                        </div>`;
                } else {
                    div.innerHTML += `
                        <div class="match">
                            <div class="team ${match.winner === match.team1 ? 'winner' : ''}" onclick="setWinner(${idx}, '${match.team1}')">${match.team1}</div>
                            <span class="vs">VS</span>
                            <div class="team ${match.winner === match.team2 ? 'winner' : ''}" onclick="setWinner(${idx}, '${match.team2}')">${match.team2}</div>
                        </div>`;
                }
            });
        }

        window.setWinner = async (matchIdx, winnerName) => {
            if(confirm(`¿Gana ${winnerName}?`)) {
                const newBracket = [...currentData.bracket];
                newBracket[matchIdx].winner = winnerName;
                await updateDoc(doc(db, "actividades", actId), { bracket: newBracket });
                currentData.bracket = newBracket;
                renderBracket(newBracket);
            }
        }

        window.resetSorteo = async () => {
            if(prompt("Escribe BORRAR para reiniciar:") !== 'BORRAR') return;
            await updateDoc(doc(db, "actividades", actId), { bracket: [] });
            location.reload();
        }
    </script>
</head>
<body>
    <div class="container">
        <button onclick="window.history.back()" style="border:none; background:none; cursor:pointer; margin-bottom:10px;">⬅ Volver</button>
        <div class="card">
            <h1 id="titulo">...</h1>
            <button id="btn-gen" class="btn-gen" onclick="generarSorteo()">🎲 REALIZAR SORTEO</button>
            <div id="matches"></div>
            <button id="btn-reset" class="btn-reset" onclick="resetSorteo()">♻️ REINICIAR</button>
        </div>
    </div>
</body>
</html>
