<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Cuadro</title>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff5722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiestas Pantano">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #673ab7; --win-bg: #c8e6c9; --win-text: #2e7d32; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --win-bg: #1b5e20; --win-text: #a5d6a7; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 100%; overflow-x: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: fit-content; }
        h1 { margin-top: 0; text-align: center; }

        .bracket-container { display: flex; padding: 20px 0; gap: 40px; }
        .round { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; min-width: 220px; }
        .round-title { text-align: center; font-weight: bold; margin-bottom: 10px; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }

        .match { background: rgba(0,0,0,0.03); border-radius: 8px; padding: 10px; border: 1px solid rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 8px; position: relative; }
        
        /* Líneas conectoras */
        .round:not(:last-child) .match::after {
            content: ''; position: absolute; right: -40px; top: 50%; width: 40px; height: 2px; background: #ccc; z-index: -1;
        }

        .team { padding: 10px; background: var(--card); border: 2px solid #ddd; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; transition: all 0.2s; user-select: none; font-size: 0.9rem; }
        .team:hover { border-color: var(--accent); }
        .team.winner { background: var(--win-bg); border-color: var(--win-text); color: var(--win-text); }
        .team.bye { opacity: 0.6; border-style: dashed; cursor: default; background: #eee; }

        .btn-gen { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-reset { width: 100%; padding: 10px; background: transparent; color: #ff5252; border: 2px solid #ff5252; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-back { background: transparent; border: none; cursor: pointer; margin-bottom: 10px; font-size: 1rem; color: gray; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        enableIndexedDbPersistence(db).catch(err => console.log(err));
        const auth = getAuth(app);
        const params = new URLSearchParams(window.location.search);
        const actId = params.get("id");
        let currentData = null;

        onAuthStateChanged(auth, async (user) => {
            if(!user || !actId) window.location.href="index.html";
            cargarTorneo();
        });

        async function cargarTorneo() {
            const snap = await getDoc(doc(db, "actividades", actId));
            if (!snap.exists()) return;
            currentData = snap.data();
            document.getElementById("titulo").innerText = currentData.titulo;
            
            // Verificamos si existe bracket y si tiene la estructura nueva (rounds)
            if(currentData.bracket && currentData.bracket.rounds && currentData.bracket.rounds.length > 0) {
                renderBracket(currentData.bracket);
                document.getElementById("btn-gen").style.display = "none";
                document.getElementById("btn-reset").style.display = "block";
            } else {
                document.getElementById("bracket-view").innerHTML = `<p style="text-align:center; color:gray">Sin sorteo realizado.<br>Inscritos: ${currentData.inscritos ? currentData.inscritos.length : 0}</p>`;
                document.getElementById("btn-gen").style.display = "flex";
                document.getElementById("btn-reset").style.display = "none";
            }
        }

        window.generarSorteo = async () => {
            const inscritos = currentData.inscritos || [];
            if(inscritos.length < 2) return alert("Mínimo 2 equipos");
            if(!confirm(`¿Generar cuadro para ${inscritos.length} equipos?`)) return;

            const teams = inscritos.map(i => i.nombre_equipo || i.capitan || "Participante").filter(n => n);
            teams.sort(() => Math.random() - 0.5);

            let round1Matches = [];
            for(let i=0; i < teams.length; i += 2) {
                if(i + 1 < teams.length) {
                    round1Matches.push({ team1: teams[i], team2: teams[i+1], winner: null });
                } else {
                    round1Matches.push({ team1: teams[i], team2: null, winner: teams[i], bye: true });
                }
            }

            // ESTRUCTURA CORREGIDA: Objeto con propiedad 'rounds'
            const bracketStructure = {
                rounds: [
                    { matches: round1Matches }
                ]
            };

            try {
                await updateDoc(doc(db, "actividades", actId), { bracket: bracketStructure });
                alert("✅ Cuadro generado");
                location.reload();
            } catch(e) { alert("Error: " + e.message); }
        }

        function renderBracket(bracketData) {
            const container = document.getElementById("bracket-view");
            container.innerHTML = "";

            bracketData.rounds.forEach((round, roundIndex) => {
                let roundHtml = `<div class="round"><div class="round-title">Ronda ${roundIndex + 1}</div>`;
                
                round.matches.forEach((match, matchIndex) => {
                    if(match.bye) {
                         roundHtml += `
                            <div class="match">
                                <div class="team winner bye">${match.team1} (Pasa directo)</div>
                            </div>`;
                    } else {
                        roundHtml += `
                            <div class="match">
                                <div class="team ${match.winner === match.team1 ? 'winner' : ''}" onclick="setWinner(${roundIndex}, ${matchIndex}, '${match.team1}')">${match.team1}</div>
                                <div class="team ${match.winner === match.team2 ? 'winner' : ''}" onclick="setWinner(${roundIndex}, ${matchIndex}, '${match.team2}')">${match.team2}</div>
                            </div>`;
                    }
                });
                roundHtml += "</div>";
                container.innerHTML += roundHtml;
            });
        }

        window.setWinner = async (roundIndex, matchIndex, winnerName) => {
            let bracket = currentData.bracket; // Copia local
            const currentMatch = bracket.rounds[roundIndex].matches[matchIndex];

            // Si ya hay ganador, preguntar si se quiere cambiar
            if(currentMatch.winner && currentMatch.winner !== winnerName) {
                if(!confirm(`¿Cambiar ganador de ${currentMatch.winner} a ${winnerName}?`)) return;
            } else if (!currentMatch.winner) {
                if(!confirm(`¿Confirmar que gana ${winnerName}?`)) return;
            }

            // Establecer ganador
            bracket.rounds[roundIndex].matches[matchIndex].winner = winnerName;

            // Lógica para avanzar de ronda
            const currentRoundMatches = bracket.rounds[roundIndex].matches;
            const roundComplete = currentRoundMatches.every(m => m.winner !== null);

            // Si la ronda está completa y no es la última ya generada
            if (roundComplete && roundIndex === bracket.rounds.length - 1) {
                const winners = currentRoundMatches.map(m => m.winner);
                
                if (winners.length > 1) {
                    let nextRoundMatches = [];
                    for(let i=0; i < winners.length; i += 2) {
                         if(i + 1 < winners.length) {
                            nextRoundMatches.push({ team1: winners[i], team2: winners[i+1], winner: null });
                        } else {
                            nextRoundMatches.push({ team1: winners[i], team2: null, winner: winners[i], bye: true });
                        }
                    }
                    // Añadimos nueva ronda al array de rounds
                    bracket.rounds.push({ matches: nextRoundMatches });
                    alert("¡Nueva ronda generada!");
                } else {
                    alert(`🏆 ¡TORNEO FINALIZADO! GANADOR: ${winners[0]} 🏆`);
                }
            }

            await updateDoc(doc(db, "actividades", actId), { bracket: bracket });
            location.reload();
        }

        window.resetSorteo = async () => {
            if(confirm("⚠ ¿Borrar todo el cuadro y empezar de cero?")) {
                await updateDoc(doc(db, "actividades", actId), { bracket: null });
                location.reload();
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <button class="btn-back" onclick="window.history.back()">⬅ Volver</button>
        <div class="card">
            <h1 id="titulo">...</h1>
            <button id="btn-gen" class="btn-gen" onclick="generarSorteo()">🎲 GENERAR CUADRO</button>
            <div id="bracket-view" class="bracket-container"></div>
            <button id="btn-reset" class="btn-reset" onclick="resetSorteo()">♻️ REINICIAR CUADRO</button>
        </div>
    </div>
</body>
</html>
