<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Fiestas del Pantano</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff5722; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        button:hover { background: #e64a19; }
        .toggle-link { margin-top: 15px; display: block; color: #ff5722; cursor: pointer; text-decoration: underline; font-size: 14px; }
        .hidden { display: none; }
        .error { color: red; font-size: 14px; margin-top: 10px; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, collection, query, where, getDocs, setDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      // --- TU CONFIGURACIÓN ---
      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      // Si ya está logueado, lo mandamos directo al panel
      onAuthStateChanged(auth, (user) => {
          if (user) {
             window.location.href = "panel.html";
          }
      });

      // --- FUNCIONES ---
      window.toggleView = () => {
          document.getElementById('login-form').classList.toggle('hidden');
          document.getElementById('register-form').classList.toggle('hidden');
          document.getElementById('msg').innerText = "";
      }

      window.login = async () => {
          const user = document.getElementById("login-user").value.trim().toLowerCase();
          const pass = document.getElementById("login-pass").value;
          const msg = document.getElementById("msg");
          
          try {
              const fakeEmail = user + "@fiestaspueblo.com";
              await signInWithEmailAndPassword(auth, fakeEmail, pass);
              // La redirección la hace el onAuthStateChanged de arriba
          } catch (error) {
              console.error(error);
              msg.innerText = "Usuario o contraseña incorrectos";
          }
      }

      window.register = async () => {
        const user = document.getElementById("reg-user").value.trim().toLowerCase();
        const pass = document.getElementById("reg-pass").value;
        const code = document.getElementById("reg-code").value.trim();
        const msg = document.getElementById("msg");

        if(!user || !pass || !code) { msg.innerText = "Rellena todo"; return; }

        try {
            // 1. Verificar código
            const q = query(collection(db, "invitaciones"), where("codigo", "==", code), where("usado", "==", false));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) throw new Error("Código inválido o usado");

            let codigoId = "", rol = "usuario";
            querySnapshot.forEach(d => { codigoId = d.id; rol = d.data().rol; });

            // 2. Crear Auth
            const fakeEmail = user + "@fiestaspueblo.com";
            const cred = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
            
            // 3. Crear en DB
            await setDoc(doc(db, "usuarios", cred.user.uid), { username: user, rol: rol, codigo: code });
            
            // 4. Quemar código
            await updateDoc(doc(db, "invitaciones", codigoId), { usado: true, usado_por: user });

        } catch (e) {
            console.error(e);
            msg.innerText = "Error: " + e.message;
        }
      }
    </script>
</head>
<body>
    <div class="container">
        <div id="login-form">
            <h2>🔑 Entrar</h2>
            <input type="text" id="login-user" placeholder="Usuario">
            <input type="password" id="login-pass" placeholder="Contraseña">
            <button onclick="login()">Iniciar Sesión</button>
            <span class="toggle-link" onclick="toggleView()">¿No tienes cuenta? Regístrate aquí</span>
        </div>

        <div id="register-form" class="hidden">
            <h2>📝 Registro</h2>
            <input type="text" id="reg-user" placeholder="Nuevo Usuario">
            <input type="password" id="reg-pass" placeholder="Contraseña (min 6)">
            <input type="text" id="reg-code" placeholder="Código de Invitación">
            <button onclick="register()">Crear Cuenta</button>
            <span class="toggle-link" onclick="toggleView()">¿Ya tienes cuenta? Entra aquí</span>
        </div>

        <p id="msg" class="error"></p>
    </div>
</body>
</html>
