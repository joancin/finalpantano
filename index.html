<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiestas Pantano</title>

    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f0f2f5; --card: white; --accent: #ff5722; --text: #333; }
        
        /* MODO OSCURO APLICADO AL HTML */
        html.dark-mode { --bg: #18191a; --card: #242526; --text: #e4e6eb; }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; transition: background 0.3s; }
        
        .hero { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .logo-icon { font-size: 4rem; color: var(--accent); margin-bottom: 10px; animation: bounce 2s infinite; }
        h1 { margin: 0; font-size: 2.5rem; line-height: 1.1; }
        p { color: gray; margin-top: 5px; }

        /* GRID PÚBLICO */
        .public-grid { display: grid; gap: 15px; max-width: 500px; margin: 0 auto; width: 100%; }
        .public-card { background: var(--card); padding: 20px; border-radius: 15px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-decoration: none; color: inherit; transition: transform 0.2s; }
        .public-card:hover { transform: translateY(-3px); }
        
        .card-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; flex-shrink: 0; }
        .c-festeros { background: linear-gradient(135deg, #FF6B6B, #EE5253); }
        .c-migany { background: linear-gradient(135deg, #FDCB6E, #E17055); }
        .c-rifa { background: linear-gradient(135deg, #0984e3, #6c5ce7); }
        .card-info h3 { margin: 0; font-size: 1.1rem; }
        .card-info span { font-size: 0.8rem; color: gray; }

        /* LOGIN FLOTANTE */
        .login-section { margin-top: auto; padding-top: 40px; text-align: center; }
        .btn-login-toggle { background: white; border: 1px solid #ccc; padding: 12px 30px; border-radius: 30px; cursor: pointer; color: #333; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .btn-login-toggle:active { transform: scale(0.95); }

        /* MODAL LOGIN / REGISTRO */
        #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .login-box { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: gray; font-weight: bold; transition: color 0.3s; }
        .tab.active { color: var(--accent); border-bottom: 3px solid var(--accent); margin-bottom: -2px; }
        
        input { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 1rem; transition: border 0.3s; }
        input:focus { border-color: var(--accent); outline: none; }
        
        .btn-action { background: var(--accent); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1rem; transition: background 0.3s; }
        .btn-action:hover { background: #e64a19; }
        
        .btn-close { position: absolute; top: 15px; right: 15px; background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center; }
        
        .hidden { display: none; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} 60% {transform: translateY(-5px);} }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, query, collection, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Control para evitar redirección prematura
        let isRegistering = false;

        onAuthStateChanged(auth, (user) => {
            if (user && !isRegistering) {
                window.location.href = "panel.html";
            }
        });

        window.abrirLogin = () => document.getElementById("login-modal").style.display = "flex";
        window.cerrarLogin = () => document.getElementById("login-modal").style.display = "none";

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            if(tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
            }
        }

        // --- LÓGICA DE LOGIN ---
        window.login = async () => {
            const user = document.getElementById("log-user").value.trim();
            const pass = document.getElementById("log-pass").value;
            
            if(!user || !pass) return alert("Rellena todo");

            const fakeEmail = user.toLowerCase().replace(/\s+/g, '') + "@fiestaspantano.com";
            const btn = document.getElementById("btn-login-action");
            btn.innerText = "Entrando..."; btn.disabled = true;

            try { 
                await signInWithEmailAndPassword(auth, fakeEmail, pass); 
            } catch (e) { 
                console.error(e);
                alert("Usuario o contraseña incorrectos");
                btn.innerText = "Entrar"; btn.disabled = false;
            }
        }

        // --- LÓGICA DE REGISTRO ---
        window.registro = async () => {
            const user = document.getElementById("reg-user").value.trim();
            const pass = document.getElementById("reg-pass").value;
            const code = document.getElementById("reg-code").value.trim().toUpperCase();

            if (!user || !pass || !code) return alert("¡Todo es obligatorio!");

            const btn = document.getElementById("btn-reg-action");
            btn.innerText = "Procesando..."; btn.disabled = true;
            isRegistering = true; // Frenamos redirección

            try {
                const fakeEmail = user.toLowerCase().replace(/\s+/g, '') + "@fiestaspantano.com";
                let rolAsignado = "usuario";
                let codigoValido = false;
                let invitacionId = null;

                // TRUCO DE EMERGENCIA (Puedes borrar esto si ya tienes Admin)
                if (code === "SOYELJEFE") { 
                    rolAsignado = "admin"; codigoValido = true; 
                } else {
                    const q = query(collection(db, "invitaciones"), where("codigo", "==", code), where("usado", "==", false));
                    const snap = await getDocs(q);
                    
                    if (!snap.empty) {
                        const docInv = snap.docs[0];
                        rolAsignado = docInv.data().rol;
                        invitacionId = docInv.id;
                        codigoValido = true;
                    }
                }

                if (!codigoValido) {
                    isRegistering = false;
                    btn.innerText = "Crear Cuenta"; btn.disabled = false;
                    return alert("⛔ Código INVÁLIDO o YA USADO.");
                }

                const cred = await createUserWithEmailAndPassword(auth, fakeEmail, pass);

                await setDoc(doc(db, "usuarios", cred.user.uid), {
                    username: user,
                    email: fakeEmail,
                    rol: rolAsignado,
                    codigo_usado: code,
                    fecha_registro: new Date()
                });

                if(invitacionId) {
                    await updateDoc(doc(db, "invitaciones", invitacionId), {
                        usado: true, usado_por: user, fecha_uso: new Date()
                    });
                }

                alert("¡Bienvenido/a! 🎉");
                window.location.href = "panel.html";

            } catch (e) { 
                console.error(e);
                isRegistering = false;
                if (auth.currentUser) await signOut(auth);

                if(e.code === 'auth/email-already-in-use') alert("Ese nombre de usuario ya existe.");
                else alert("Error: " + e.message);
                
                btn.innerText = "Crear Cuenta"; btn.disabled = false;
            }
        }
    </script>
</head>
<body>

    <div class="hero">
        <span class="material-symbols-outlined logo-icon">celebration</span>
        <h1>Fiestas<br>Pantano</h1>
        <p>Toda la información en tu bolsillo</p>
    </div>

    <div class="public-grid">
        <a href="festeros.html" class="public-card">
            <div class="card-icon c-festeros"><span class="material-symbols-outlined">diversity_3</span></div>
            <div class="card-info"><h3>Los Festeros</h3><span>Conoce al equipo</span></div>
        </a>
        <a href="migany.html" class="public-card">
            <div class="card-icon c-migany"><span class="material-symbols-outlined">stars</span></div>
            <div class="card-info"><h3>Mig Any</h3><span>Información fiesta</span></div>
        </a>
        <a href="rifa.html" class="public-card">
            <div class="card-icon c-rifa"><span class="material-symbols-outlined">confirmation_number</span></div>
            <div class="card-info"><h3>Rifa</h3><span>Ver número ganador</span></div>
        </a>
    </div>

    <div class="login-section">
        <button class="btn-login-toggle" onclick="abrirLogin()">🔑 Iniciar Sesión / Registrarse</button>
    </div>

    <div id="login-modal">
        <div class="login-box">
            <button class="btn-close" onclick="cerrarLogin()">×</button>
            
            <div class="tabs">
                <div id="tab-login" class="tab active" onclick="switchTab('login')">Entrar</div>
                <div id="tab-register" class="tab" onclick="switchTab('register')">Crear Cuenta</div>
            </div>

            <div id="form-login">
                <input type="text" id="log-user" placeholder="Nombre de Usuario">
                <input type="password" id="log-pass" placeholder="Contraseña">
                <button id="btn-login-action" class="btn-action" onclick="login()">Entrar</button>
                
                <p style="margin-top:15px; font-size:0.8rem; color:gray; cursor:pointer; text-decoration:underline;" onclick="alert('⚠️ RECUPERACIÓN DE CUENTA ⚠️\n\nContacta con un Festero/Admin.\n\nÉl reiniciará tu usuario desde el panel de control. Después podrás registrarte de nuevo con el mismo nombre y una contraseña nueva.')">
                    ¿Olvidaste tu contraseña?
                </p>
            </div>

            <div id="form-register" class="hidden">
                <div style="background:#fff3e0; padding:10px; border-radius:8px; font-size:0.8rem; color:#e65100; margin-bottom:10px;">
                    ⚠️ Necesitas un código de invitación para crear cuenta.
                </div>
                <input type="text" id="reg-user" placeholder="Elige tu Nombre de Usuario">
                <input type="password" id="reg-pass" placeholder="Contraseña">
                <input type="text" id="reg-code" placeholder="CÓDIGO (Ej: VECINO24)" style="text-transform:uppercase; letter-spacing:1px; font-weight:bold;">
                <button id="btn-reg-action" class="btn-action" style="background:#4caf50" onclick="registro()">Crear Cuenta</button>
            </div>
        </div>
    </div>

</body>
</html>
