<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - Fiestas</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        /* --- VARIABLES DE COLORES (SISTEMA DE TEMAS) --- */
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: white;
            --header-bg: white;
            --shadow: rgba(0,0,0,0.1);
            --accent: #ff5722;
            --accent-hover: #e64a19;
            --border: #ddd;
        }

        /* CLASE MODO OSCURO */
        body.dark-mode {
            --bg-color: #18191a;
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --header-bg: #242526;
            --shadow: rgba(0,0,0,0.5);
            --border: #3e4042;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; 
            transition: background 0.3s, color 0.3s;
        }

        /* HEADER / BARRA DE NAVEGACIÓN */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            padding: 10px 30px;
            box-shadow: 0 2px 5px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        .nav-controls { display: flex; align-items: center; gap: 15px; }

        /* BOTONES DEL HEADER */
        .btn-nav {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-nav:hover { background-color: var(--bg-color); }
        
        .btn-admin { border-color: #e91e63; color: #e91e63; font-weight: bold; display: none; } /* Oculto por defecto */
        .btn-festero { border-color: #9c27b0; color: #9c27b0; font-weight: bold; display: none; } /* Oculto por defecto */
        
        .btn-logout { background: #ff4444; color: white; border: none; }
        .btn-logout:hover { background: #cc0000; }

        /* CONTENIDO PRINCIPAL */
        .main-container { padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
        
        h2 { border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px; margin-bottom: 30px; }

        .grid-actividades {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* TARJETAS */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px var(--shadow);
            transition: transform 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card:hover { transform: translateY(-5px); }
        
        .icon-large { font-size: 40px; color: var(--accent); margin-bottom: 15px; }
        .card h3 { margin: 0 0 10px 0; }
        .card p { font-size: 14px; opacity: 0.8; }

    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      // --- TU CONFIGURACIÓN ---
      const firebaseConfig = {
        apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E",
        authDomain: "fiestas-pantano.firebaseapp.com",
        projectId: "fiestas-pantano",
        storageBucket: "fiestas-pantano.firebasestorage.app",
        messagingSenderId: "801380435613",
        appId: "1:801380435613:web:a842572cf7cee93ac57674",
        measurementId: "G-EG2MZGBT1B"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      // --- LÓGICA DE USUARIO Y ROL ---
      onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docRef = doc(db, "usuarios", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                const rol = data.rol;
                document.getElementById("username-display").innerText = data.username;

                // MOSTRAR BOTONES DE GESTIÓN EN LA ESQUINA (HEADER)
                if (rol === 'admin') {
                    document.getElementById('btn-admin-zone').style.display = 'flex';
                    document.getElementById('btn-festero-zone').style.display = 'flex';
                } else if (rol === 'festero') {
                    document.getElementById('btn-festero-zone').style.display = 'flex';
                }
            }
        } else {
            window.location.href = "index.html";
        }
      });

      // --- CERRAR SESIÓN ---
      window.cerrarSesion = () => {
          signOut(auth).then(() => window.location.href = "index.html");
      }

      // --- MODO OSCURO ---
      window.toggleTheme = () => {
          document.body.classList.toggle('dark-mode');
          const isDark = document.body.classList.contains('dark-mode');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          
          // Cambiar icono
          const icon = document.getElementById('theme-icon');
          icon.innerText = isDark ? 'light_mode' : 'dark_mode';
      }

      // Cargar tema guardado al iniciar
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
          document.body.classList.add('dark-mode');
          document.getElementById('theme-icon').innerText = 'light_mode';
      }

    window.irA = (lugar) => {
        if (lugar === 'zona_admin') {
            window.location.href = "admin.html";
        } else if (lugar === 'zona_festero') {
            // window.location.href = "gestion.html"; // Esto lo haremos luego
            alert("Próximamente: Zona de Gestión de Actividades");
        } else {
            alert("Sección en construcción: " + lugar);
        }
    }
    </script>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            <span class="material-symbols-outlined" style="color: var(--accent);">celebration</span>
            <span>Fiestas Pantano</span>
            <small style="font-weight: normal; margin-left: 10px; font-size: 12px;">Hola, <span id="username-display">...</span></small>
        </div>

        <div class="nav-controls">
            <button id="btn-admin-zone" class="btn-nav btn-admin" onclick="irA('zona_admin')">
                <span class="material-symbols-outlined">admin_panel_settings</span>
                Admin
            </button>
            
            <button id="btn-festero-zone" class="btn-nav btn-festero" onclick="irA('zona_festero')">
                <span class="material-symbols-outlined">edit_calendar</span>
                Gestión
            </button>

            <button class="btn-nav" onclick="toggleTheme()" title="Cambiar Tema">
                <span id="theme-icon" class="material-symbols-outlined">dark_mode</span>
            </button>

            <button class="btn-nav btn-logout" onclick="cerrarSesion()">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </div>

    <div class="main-container">
        <h2>📅 Actividades y Fiestas</h2>
        
        <div class="grid-actividades">
            <div class="card" onclick="irA('ver_actividades')">
                <span class="material-symbols-outlined icon-large">event_list</span>
                <h3>Ver Todo</h3>
                <p>Consulta el calendario completo de eventos.</p>
            </div>

            <div class="card" onclick="irA('mis_inscripciones')">
                <span class="material-symbols-outlined icon-large">confirmation_number</span>
                <h3>Mis Inscripciones</h3>
                <p>Gestiona los eventos a los que te has apuntado.</p>
            </div>

            <div class="card" onclick="irA('foro')">
                <span class="material-symbols-outlined icon-large">forum</span>
                <h3>Foro Popular</h3>
                <p>Noticias, rumores y comentarios.</p>
            </div>
        </div>
    </div>

</body>
</html>
