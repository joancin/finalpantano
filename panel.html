<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiestas Pantano</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --nav-bg: white; --accent: #ff5722; --nav-active: #ff5722; --border: #eee; }
        
        /* MODO OSCURO APLICADO AL HTML */
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --nav-bg: #242526; --nav-active: #ff5722; --border: #3e4042; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px 20px 90px 20px; transition: background 0.3s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 8px; color: var(--accent); }
        .user-greet { font-size: 0.9rem; color: gray; }

        #admin-panel { display: none; background: linear-gradient(135deg, #673ab7, #512da8); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(103, 58, 183, 0.3); }
        .admin-header { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; font-size: 1.1rem; }
        .admin-actions { display: flex; gap: 10px; }
        .btn-admin { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 10px; border-radius: 8px; flex: 1; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.8rem; transition: background 0.2s; }
        
        .grid-home { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card-home { background: var(--card); padding: 20px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 120px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; border: 1px solid var(--border); }
        .card-home:hover { transform: translateY(-3px); }
        .card-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }
        .card-title { font-weight: bold; font-size: 0.9rem; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; gap: 3px; flex: 1; text-decoration: none; }
        .nav-item.active { color: var(--nav-active); font-weight: bold; }
        .nav-item .material-symbols-outlined { font-size: 24px; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      onAuthStateChanged(auth, async (user) => {
        if (!user) window.location.href = "index.html";
        // Ya no hace falta aplicar tema aquí, lo hace el script turbo
        const uDoc = await getDoc(doc(db, "usuarios", user.uid));
        if (uDoc.exists()) {
            const data = uDoc.data();
            document.getElementById("username").innerText = data.username;
            if (data.rol === 'admin' || data.rol === 'festero') {
                document.getElementById('admin-panel').style.display = 'block';
                if(data.rol === 'admin') document.getElementById('btn-admin-users').style.display = 'flex';
            }
        }
      });
      window.irA = (url) => window.location.href = url;
    </script>
</head>
<body>
    <div class="header">
        <div class="logo"><span class="material-symbols-outlined">celebration</span>Fiestas Pantano</div>
        <div class="user-greet">Hola, <span id="username">...</span></div>
    </div>

    <div id="admin-panel">
        <div class="admin-header"><span class="material-symbols-outlined">security</span> Zona de Gestión</div>
        <div class="admin-actions">
            <button class="btn-admin" onclick="irA('gestion.html')"><span class="material-symbols-outlined">edit_calendar</span>Actividades</button>
            <button id="btn-admin-users" class="btn-admin" onclick="irA('admin.html')" style="display:none;"><span class="material-symbols-outlined">group</span>Usuarios</button>
        </div>
    </div>

    <h3 style="margin-top:0">¿Qué quieres hacer?</h3>
    <div class="grid-home">
        <div class="card-home" onclick="irA('actividades.html')"><span class="material-symbols-outlined card-icon">calendar_month</span><span class="card-title">Ver Calendario</span></div>
        <div class="card-home" onclick="irA('mis_inscripciones.html')"><span class="material-symbols-outlined card-icon">confirmation_number</span><span class="card-title">Mis Eventos</span></div>
        <div class="card-home" onclick="irA('perfil.html')"><span class="material-symbols-outlined card-icon" style="color:#9c27b0">account_circle</span><span class="card-title">Mi Perfil</span></div>
        <div class="card-home" onclick="irA('rifa.html')"><span class="material-symbols-outlined card-icon" style="color:#ffb300">local_activity</span><span class="card-title">Ver Rifa</span></div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><span class="material-symbols-outlined">home</span>Inicio</a>
        <a href="actividades.html" class="nav-item"><span class="material-symbols-outlined">event</span>Fiestas</a>
        <a href="mis_inscripciones.html" class="nav-item"><span class="material-symbols-outlined">confirmation_number</span>Tickets</a>
        <a href="perfil.html" class="nav-item"><span class="material-symbols-outlined">person</span>Perfil</a>
    </nav>
</body>
</html>
