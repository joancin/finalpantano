<!-- ============================================================
     INSTRUCCIONES DE INSTALACIÓN PWA
     Añadir estas 2 líneas en el <head> de TODOS los HTML
     ============================================================ -->

<!-- 1. MANIFEST (instalar como app) -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff5722">
<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiestas Pantano">

<!-- 2. SERVICE WORKER (pegar justo antes de </body> en index.html,
        o en un script compartido) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('[PWA] SW registrado:', reg.scope))
        .catch(err => console.warn('[PWA] SW falló:', err));
    });
  }
</script>
