<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff5722; --border: #ddd; --danger: #d32f2f; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; padding-bottom: 90px; transition: background 0.3s; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .profile-card { background: var(--card); border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .avatar-circle { width: 100px; height: 100px; background: var(--accent); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; margin: 0 auto 15px auto; font-weight: bold; }
        
        .role-badge { background: #333; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .role-admin { background: #e91e63; } .role-festero { background: #9c27b0; }

        .input-group { text-align: left; margin-top: 20px; }
        .input-group label { font-size: 0.8rem; color: gray; margin-left: 5px; }
        
        /* ESTILO PARA INPUT BLOQUEADO */
        .input-wrapper { position: relative; }
        .input-wrapper .icon-lock { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: gray; font-size: 1.2rem; }
        
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.05); color: gray; box-sizing: border-box; margin-top: 5px; cursor: not-allowed; }
        html.dark-mode .input-group input { background: rgba(255,255,255,0.05); color: #888; }

        .menu-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        
        .btn-logout { width: 100%; padding: 15px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* BOTÓN DE BORRAR CUENTA */
        .btn-delete-account { width: 100%; padding: 15px; background: #ffebee; color: var(--danger); border: 1px solid #ffcdd2; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
        .btn-delete-account:hover { background: #ffcdd2; }
        html.dark-mode .btn-delete-account { background: rgba(211, 47, 47, 0.1); border-color: #ef9a9a; color: #ef9a9a; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; transition: color 0.3s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-item .material-symbols-outlined { font-size: 24px; margin-bottom: 2px; }
        .msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; display: none; z-index: 2000; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      // Importamos deleteUser (aunque usaremos currentUser.delete())
      import { getAuth, onAuthStateChanged, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          currentUser = user;
          actualizarIconoTema();
          
          const uDoc = await getDoc(doc(db, "usuarios", user.uid));
          if(uDoc.exists()) {
              const data = uDoc.data();
              document.getElementById("user-alias").value = data.username;
              document.getElementById("avatar-initial").innerText = data.username.charAt(0).toUpperCase();
              
              const rolEl = document.getElementById("user-role");
              rolEl.innerText = data.rol.toUpperCase();
              if(data.rol === 'admin') rolEl.classList.add('role-admin');
              if(data.rol === 'festero') rolEl.classList.add('role-festero');
          }
      });

      // --- ELIMINAR CUENTA COMPLETA ---
      window.eliminarCuenta = async () => {
          if(!confirm("⚠️ ¿ESTÁS SEGURO?\n\nEsta acción es irreversible. Se borrará tu usuario y tendrás que registrarte de nuevo si quieres volver.")) return;

          const btn = document.getElementById("btn-delete");
          btn.innerText = "Borrando..."; btn.disabled = true;

          try {
              const uid = currentUser.uid;

              // 1. Borrar datos de Firestore
              await deleteDoc(doc(db, "usuarios", uid));

              // 2. Borrar cuenta de Autenticación
              await deleteUser(currentUser);

              alert("Tu cuenta ha sido eliminada.");
              window.location.href = "index.html";

          } catch(e) {
              console.error(e);
              btn.innerText = "🗑️ Eliminar mi Cuenta"; btn.disabled = false;

              // Si pide login reciente
              if(e.code === 'auth/requires-recent-login') {
                  alert("⚠️ SEGURIDAD:\nPara borrar tu cuenta, Google necesita confirmar que eres tú.\n\nPor favor:\n1. Cierra sesión.\n2. Vuelve a entrar.\n3. Intenta borrar la cuenta de nuevo.");
              } else {
                  alert("Error al borrar: " + e.message);
              }
          }
      }

      window.cambiarTema = () => {
          document.body.classList.toggle('dark-mode');
          document.documentElement.classList.toggle('dark-mode');
          localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
          actualizarIconoTema();
      }
      window.cerrarSesion = () => { signOut(auth).then(() => window.location.href = "index.html"); }
      
      function actualizarIconoTema() {
          const isDark = document.documentElement.classList.contains('dark-mode');
          document.getElementById("theme-text").innerText = isDark ? "Modo Claro" : "Modo Oscuro";
          document.getElementById("theme-icon").innerText = isDark ? "light_mode" : "dark_mode";
      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Perfil</h1>
        <div class="profile-card">
            <span id="user-role" class="role-badge">CARGANDO</span>
            <div id="avatar-initial" class="avatar-circle">?</div>
            
            <div class="input-group">
                <label>Tu Alias (No se puede modificar)</label>
                <div class="input-wrapper">
                    <input type="text" id="user-alias" disabled>
                    <span class="material-symbols-outlined icon-lock">lock</span>
                </div>
            </div>
        </div>

        <div class="menu-item" onclick="cambiarTema()">
            <span style="display:flex; align-items:center; gap:10px;">
                <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
                <span id="theme-text">Modo Oscuro</span>
            </span>
            <span class="material-symbols-outlined">chevron_right</span>
        </div>

        <button class="btn-logout" onclick="cerrarSesion()">
            <span class="material-symbols-outlined">logout</span> Cerrar Sesión
        </button>

        <button id="btn-delete" class="btn-delete-account" onclick="eliminarCuenta()">
            <span class="material-symbols-outlined">delete_forever</span> Eliminar mi Cuenta
        </button>
        
        <p style="text-align:center; color:gray; font-size:0.75rem; margin-top:10px;">
            Al eliminar tu cuenta, tu nombre quedará libre para un nuevo registro.
        </p>

        <div id="toast" class="msg"></div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item">
            <span class="material-symbols-outlined">home</span>Inicio
        </a>
        <a href="actividades.html" class="nav-item">
            <span class="material-symbols-outlined">event</span>Fiestas
        </a>
        <a href="mis_inscripciones.html" class="nav-item">
            <span class="material-symbols-outlined">confirmation_number</span>Tickets
        </a>
        <a href="#" class="nav-item active"> <span class="material-symbols-outlined">person</span>Perfil
        </a>
    </nav>
</body>
</html>
