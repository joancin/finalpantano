<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    
    <script>
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');
    </script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --accent: #ff5722; --border: #ddd; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; --border: #3e4042; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; padding-bottom: 90px; transition: background 0.3s; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .profile-card { background: var(--card); border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .avatar-circle { width: 100px; height: 100px; background: var(--accent); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px; margin: 0 auto 15px auto; font-weight: bold; }
        .role-badge { background: #333; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .role-admin { background: #e91e63; } .role-festero { background: #9c27b0; }

        .input-group { text-align: left; margin-top: 20px; }
        .input-group label { font-size: 0.8rem; color: gray; margin-left: 5px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-sizing: border-box; margin-top: 5px; }
        
        .btn-save { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; display: none; transition: background 0.3s; }
        .btn-save:hover { background: #e64a19; }

        .menu-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .btn-logout { width: 100%; padding: 15px; background: #ffebee; color: #d32f2f; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .nav-item { border: none; background: transparent; color: gray; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; text-decoration: none; flex: 1; transition: color 0.3s; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        .nav-item .material-symbols-outlined { font-size: 24px; margin-bottom: 2px; }
        .msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 30px; display: none; z-index: 2000; }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      // IMPORTANTE: Añadidos query, collection, where, getDocs para comprobar duplicados
      import { getFirestore, doc, getDoc, updateDoc, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);
      let currentUser = null;
      let currentUsername = "";

      onAuthStateChanged(auth, async (user) => {
          if (!user) window.location.href = "index.html";
          currentUser = user;
          actualizarIconoTema();
          
          const uDoc = await getDoc(doc(db, "usuarios", user.uid));
          if(uDoc.exists()) {
              const data = uDoc.data();
              currentUsername = data.username; // Guardamos el nombre actual
              document.getElementById("user-alias").value = data.username;
              document.getElementById("avatar-initial").innerText = data.username.charAt(0).toUpperCase();
              
              const rolEl = document.getElementById("user-role");
              rolEl.innerText = data.rol.toUpperCase();
              if(data.rol === 'admin') rolEl.classList.add('role-admin');
              if(data.rol === 'festero') rolEl.classList.add('role-festero');
          }
      });

      window.detectarCambio = () => { document.getElementById("btn-guardar").style.display = "block"; }

      // --- GUARDAR CON COMPROBACIÓN DE DUPLICADOS ---
      window.guardarCambios = async () => {
          const nuevoAlias = document.getElementById("user-alias").value.trim();
          
          if(!nuevoAlias) return alert("El nombre no puede estar vacío");
          if(nuevoAlias === currentUsername) return; // No ha cambiado nada

          const btn = document.getElementById("btn-guardar");
          btn.innerText = "Comprobando..."; btn.disabled = true;

          try {
              // 1. Preguntar a la base de datos si alguien ya tiene ese nombre
              const q = query(collection(db, "usuarios"), where("username", "==", nuevoAlias));
              const querySnapshot = await getDocs(q);

              // 2. Si encontramos a alguien...
              if (!querySnapshot.empty) {
                  // Comprobamos que no seamos nosotros mismos (por si acaso)
                  if (querySnapshot.docs[0].id !== currentUser.uid) {
                      btn.innerText = "Guardar Cambios"; btn.disabled = false;
                      return alert("⛔ Ese nombre ya está cogido. Por favor, elige otro.");
                  }
              }

              // 3. Si está libre, guardamos
              await updateDoc(doc(db, "usuarios", currentUser.uid), { username: nuevoAlias });
              
              currentUsername = nuevoAlias; // Actualizamos local
              document.getElementById("avatar-initial").innerText = nuevoAlias.charAt(0).toUpperCase();
              
              const msg = document.getElementById("toast"); 
              msg.style.display="block"; msg.innerText="✅ Perfil actualizado"; 
              setTimeout(()=>msg.style.display="none", 3000);
              
              btn.style.display="none";
              btn.innerText = "Guardar Cambios"; btn.disabled = false;

          } catch(e) { 
              console.error(e);
              alert("Error al guardar: " + e.message);
              btn.innerText = "Guardar Cambios"; btn.disabled = false;
          }
      }

      window.cambiarTema = () => {
          document.body.classList.toggle('dark-mode');
          document.documentElement.classList.toggle('dark-mode');
          localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
          actualizarIconoTema();
      }
      window.cerrarSesion = () => { signOut(auth).then(() => window.location.href = "index.html"); }
      
      function actualizarIconoTema() {
          const isDark = document.documentElement.classList.contains('dark-mode');
          document.getElementById("theme-text").innerText = isDark ? "Modo Claro" : "Modo Oscuro";
          document.getElementById("theme-icon").innerText = isDark ? "light_mode" : "dark_mode";
      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Perfil</h1>
        <div class="profile-card">
            <span id="user-role" class="role-badge">CARGANDO</span>
            <div id="avatar-initial" class="avatar-circle">?</div>
            
            <div class="input-group">
                <label>Tu Alias (Nombre público)</label>
                <input type="text" id="user-alias" oninput="detectarCambio()">
            </div>
            
            <button id="btn-guardar" class="btn-save" onclick="guardarCambios()">Guardar Cambios</button>
        </div>

        <div class="menu-item" onclick="cambiarTema()">
            <span style="display:flex; align-items:center; gap:10px;">
                <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
                <span id="theme-text">Modo Oscuro</span>
            </span>
            <span class="material-symbols-outlined">chevron_right</span>
        </div>

        <button class="btn-logout" onclick="cerrarSesion()">
            <span class="material-symbols-outlined">logout</span> Cerrar Sesión
        </button>
        <div id="toast" class="msg"></div>
    </div>

    <nav class="bottom-nav">
        <a href="panel.html" class="nav-item">
            <span class="material-symbols-outlined">home</span>Inicio
        </a>
        <a href="actividades.html" class="nav-item">
            <span class="material-symbols-outlined">event</span>Fiestas
        </a>
        <a href="mis_inscripciones.html" class="nav-item">
            <span class="material-symbols-outlined">confirmation_number</span>Tickets
        </a>
        <a href="#" class="nav-item active"> <span class="material-symbols-outlined">person</span>Perfil
        </a>
    </nav>
</body>
</html>
