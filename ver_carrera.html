<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #f0f2f5; --text: #333; --card: white; --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32; }
        html.dark-mode { --bg: #18191a; --text: #e4e6eb; --card: #242526; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 90px; }
        .container { max-width: 600px; margin: 0 auto; }
        
        h1 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
        .subtitle { text-align: center; color: gray; margin-bottom: 40px; font-size: 0.9rem; }

        /* PODIUM */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 250px; margin-bottom: 40px; }
        
        .podium-place { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 30%; position: relative; }
        
        .winner-name { font-weight: bold; font-size: 0.9rem; text-align: center; margin-bottom: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .block { width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; color: rgba(0,0,0,0.4); font-weight: 900; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        /* ALTURAS Y COLORES */
        .p-1 .block { height: 140px; background: var(--gold); }
        .p-2 .block { height: 100px; background: var(--silver); }
        .p-3 .block { height: 70px; background: var(--bronze); }
        
        .p-1 { order: 2; z-index: 10; } /* El 1º va en medio */
        .p-2 { order: 1; } /* El 2º a la izquierda */
        .p-3 { order: 3; } /* El 3º a la derecha */

        /* LISTA DE PARTICIPANTES */
        .list-card { background: var(--card); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .list-title { font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
        .participant { padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; }
        .participant:last-child { border: none; }
        
        .btn-back-float { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: var(--bg); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; border: none; z-index: 100; }

        .pending { color: gray; font-style: italic; font-size: 0.8rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const actId = params.get("id");

        if(!actId) window.location.href = "actividades.html";

        onSnapshot(doc(db, "actividades", actId), (docSnap) => {
            if(!docSnap.exists()) return;
            const data = docSnap.data();
            
            document.getElementById("titulo").innerText = data.titulo;
            renderPodium(data.ganadores || {});
            renderLista(data.inscritos || []);
        });

        function renderPodium(ganadores) {
            // Si hay dato, lo mostramos. Si no, "..."
            document.getElementById("name-1").innerText = ganadores.oro || "...";
            document.getElementById("name-2").innerText = ganadores.plata || "...";
            document.getElementById("name-3").innerText = ganadores.bronce || "...";
            
            // Si no hay ganadores aún, mostramos mensaje visual
            if(!ganadores.oro && !ganadores.plata && !ganadores.bronce) {
                document.querySelectorAll('.winner-name').forEach(el => {
                    el.innerHTML = "<span class='pending'>Pendiente</span>";
                });
            }
        }

        function renderLista(inscritos) {
            const container = document.getElementById("full-list");
            container.innerHTML = "";
            if(inscritos.length === 0) {
                container.innerHTML = "<p style='color:gray'>No hay inscritos.</p>";
                return;
            }

            inscritos.forEach(i => {
                // Usamos el nombre del equipo o del capitán
                const nombre = i.nombre_equipo || i.capitan || "Participante";
                container.innerHTML += `
                    <div class="participant">
                        <span class="material-symbols-outlined" style="color:gray; font-size:18px;">person</span>
                        ${nombre}
                    </div>`;
            });
        }
    </script>
</head>
<body>

    <div class="container">
        <h1 id="titulo">Cargando...</h1>
        <p class="subtitle">Clasificación Oficial</p>

        <div class="podium-container">
            <div class="podium-place p-2">
                <div id="name-2" class="winner-name">...</div>
                <div class="block">2</div>
            </div>
            
            <div class="podium-place p-1">
                <span style="font-size:2rem; margin-bottom:-10px;">👑</span>
                <div id="name-1" class="winner-name">...</div>
                <div class="block">1</div>
            </div>
            
            <div class="podium-place p-3">
                <div id="name-3" class="winner-name">...</div>
                <div class="block">3</div>
            </div>
        </div>

        <div class="list-card">
            <div class="list-title">Lista de Participantes</div>
            <div id="full-list"></div>
        </div>
    </div>

    <button class="btn-back-float" onclick="window.history.back()">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>

</body>
</html>
