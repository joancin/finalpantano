<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Invitaciones</title>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode');</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #f4f7f6; --text: #333; --card: white; --accent: #673ab7; }
        html.dark-mode { --bg: #121212; --text: #e0e0e0; --card: #1e1e1e; }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .btn-back { background: transparent; border: 1px solid var(--text); padding: 8px 15px; border-radius: 20px; cursor: pointer; color: var(--text); }
        
        .card-generator { background: var(--card); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        
        .big-btn {
            background: linear-gradient(45deg, #673ab7, #9c27b0);
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%;
            transition: transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .big-btn:active { transform: scale(0.95); }

        .code-list { display: flex; flex-direction: column; gap: 10px; }
        .code-item { 
            background: var(--card); padding: 15px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .code-text { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .badge.libre { background: #e8f5e9; color: #2e7d32; }
        .badge.usado { background: #ffebee; color: #c62828; text-decoration: line-through; }

        .btn-copy { background: #eee; border: none; padding: 8px; border-radius: 5px; cursor: pointer; }
        .btn-copy:hover { background: #ddd; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // TU CONFIG
        const firebaseConfig = { apiKey: "AIzaSyCAvWijwO-W4tlXxabVmKVjklWJ3BtQT2E", authDomain: "fiestas-pantano.firebaseapp.com", projectId: "fiestas-pantano", storageBucket: "fiestas-pantano.firebasestorage.app", messagingSenderId: "801380435613", appId: "1:801380435613:web:a842572cf7cee93ac57674", measurementId: "G-EG2MZGBT1B" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                cargarMisCodigos();
            } else {
                window.location.href = "index.html";
            }
        });

        // GENERAR CÓDIGO ALEATORIO
        window.generarCodigo = async () => {
            if(!currentUser) return;
            const btn = document.getElementById('btn-gen');
            btn.disabled = true; btn.innerText = "Generando...";

            // Crea un código tipo "FIESTA-XY12"
            const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
            const nuevoCodigo = `FIESTA-${randomStr}`;

            try {
                await addDoc(collection(db, "invitaciones"), {
                    codigo: nuevoCodigo,
                    creado_por: currentUser.uid,
                    creado_email: currentUser.email,
                    estado: "libre", // libre o usado
                    fecha: serverTimestamp()
                });
                // No hace falta alert, se verá en la lista abajo
            } catch (e) {
                alert("Error: " + e.message);
            }
            btn.disabled = false; 
            btn.innerHTML = '<span class="material-symbols-outlined">auto_fix_high</span> Generar Nuevo Código';
        }

        function cargarMisCodigos() {
            const q = query(
                collection(db, "invitaciones"), 
                where("creado_por", "==", currentUser.uid),
                orderBy("fecha", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const lista = document.getElementById("lista");
                lista.innerHTML = "";
                
                if(snapshot.empty) {
                    lista.innerHTML = "<p style='text-align:center; opacity:0.6'>No has creado códigos aún.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const estadoClass = data.estado === 'libre' ? 'libre' : 'usado';
                    const estadoText = data.estado === 'libre' ? 'LIBRE' : 'USADO';
                    
                    lista.innerHTML += `
                        <div class="code-item">
                            <div>
                                <div class="code-text">${data.codigo}</div>
                                <span class="badge ${estadoClass}">${estadoText}</span>
                            </div>
                            ${data.estado === 'libre' ? 
                                `<button class="btn-copy" onclick="copiar('${data.codigo}')">
                                    <span class="material-symbols-outlined">content_copy</span>
                                </button>` : ''
                            }
                        </div>
                    `;
                });
            });
        }

        window.copiar = (texto) => {
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Copiado! Pásaselo a tu amigo.");
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-back" onclick="window.history.back()">⬅ Volver</button>
            <h2>Gestor de Invitaciones 🎟️</h2>
        </div>

        <div class="card-generator">
            <p style="margin-bottom: 20px;">Genera un código único para que un usuario se pueda registrar.</p>
            <button id="btn-gen" class="big-btn" onclick="generarCodigo()">
                <span class="material-symbols-outlined">auto_fix_high</span>
                Generar Nuevo Código
            </button>
        </div>

        <h3 style="margin-bottom: 15px;">Mis códigos generados</h3>
        <div id="lista" class="code-list">
            <div style="text-align:center;">Cargando...</div>
        </div>
    </div>
</body>
</html>
